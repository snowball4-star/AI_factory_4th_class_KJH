const BASE_YEAR = '2025년 귀속 기준';
const 만 = 10000;
const 억 = 100000000;

/** 숫자 파싱 — 콤마·공백 허용, 빈 값/비정상은 null */
function parseNum(raw) {
  if (raw === null || raw === undefined) return null;
  const s = String(raw).replace(/[,\s]/g, '');
  if (s === '') return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
const num = (raw, fallback = 0) => {
  const v = parseNum(raw);
  return v === null ? fallback : v;
};

const won = (n) => new Intl.NumberFormat('ko-KR').format(Math.round(n || 0));
/** 소수점 뒤 불필요한 0만 제거한다. 정수부의 0을 지우면 10%가 1%가 되므로 주의. */
const pct = (r, digits = 2) => {
  const s = ((r || 0) * 100).toFixed(digits);
  if (!s.includes('.')) return `${s}%`;
  return `${s.replace(/0+$/, '').replace(/\.$/, '')}%`;
};

/** 3억 5,000만원 형태로 읽어준다 */
function koreanMoney(n) {
  const v = Math.round(n || 0);
  if (v === 0) return '0원';
  const neg = v < 0 ? '-' : '';
  let x = Math.abs(v);
  const parts = [];
  const jo = Math.floor(x / (억 * 만)); x -= jo * 억 * 만;
  const eok = Math.floor(x / 억);       x -= eok * 억;
  const man = Math.floor(x / 만);       x -= man * 만;
  if (jo) parts.push(`${won(jo)}조`);
  if (eok) parts.push(`${won(eok)}억`);
  if (man) parts.push(`${won(man)}만`);
  if (x) parts.push(`${won(x)}`);
  return neg + parts.join(' ') + '원';
}

/** 누진공제 방식 세액 계산 */
function progressive(base, table) {
  if (!(base > 0)) return { tax: 0, rate: 0, deduct: 0 };
  const row = table.find((r) => base <= r.upTo) || table[table.length - 1];
  return { tax: Math.max(0, base * row.rate - row.deduct), rate: row.rate, deduct: row.deduct };
}

// ── 소득세 (종합소득 과세표준) ──────────────────────────
const INCOME_BRACKETS = [

  { upTo: 88000000,   rate: 0.24, deduct: 5760000 },
  { upTo: 150000000,  rate: 0.35, deduct: 15440000 },
  { upTo: 300000000,  rate: 0.38, deduct: 19940000 },
  { upTo: 500000000,  rate: 0.40, deduct: 25940000 },
  { upTo: 1000000000, rate: 0.42, deduct: 35940000 },
  { upTo: Infinity,   rate: 0.45, deduct: 65940000 },
];

/** 근로소득공제 (한도 2,000만원) */
function earnedIncomeDeduction(gross) {
  let d;
  if (gross <= 5000000) d = gross * 0.7;
  else if (gross <= 15000000) d = 3500000 + (gross - 5000000) * 0.4;
  else if (gross <= 45000000) d = 7500000 + (gross - 15000000) * 0.15;
  else if (gross <= 100000000) d = 12000000 + (gross - 45000000) * 0.05;
  else d = 14750000 + (gross - 100000000) * 0.02;
  return Math.min(Math.max(0, d), 20000000);
}

/** 근로소득세액공제 (총급여 구간별 한도 적용) */
function earnedIncomeTaxCredit(computedTax, gross) {
  const raw = computedTax <= 1300000
    ? computedTax * 0.55
    : 715000 + (computedTax - 1300000) * 0.30;
  let cap;
  if (gross <= 33000000) cap = 740000;
  else if (gross <= 70000000) cap = Math.max(660000, 740000 - (gross - 33000000) * 0.008);
  else if (gross <= 120000000) cap = Math.max(500000, 660000 - (gross - 70000000) * 0.5);
  else cap = Math.max(200000, 500000 - (gross - 120000000) * 0.5);
  return Math.min(raw, cap);
}

// ── 취득세 (주택 유상취득) ──────────────────────────────
/** 6~9억 구간 누진: 세율(%) = 취득가액(억) × 2 ÷ 3 − 3 */
function acquisitionBaseRate(price) {
  if (price <= 600000000) return 0.01;
  if (price >= 900000000) return 0.03;
  const eok = price / 억;
  const p = eok * 2 / 3 - 3;                 // % 단위
  return Math.round(p * 10000) / 10000 / 100; // 소수점 넷째자리 반올림 후 비율화
}

/**
 * 주택 유상취득 세율 일체
 * @returns { acq, edu, farm, total, heavy }
 */
function acquisitionRates(price, houseCount, adjusted, over85) {
  // 중과 판정 (취득 후 주택 수 기준)
  let heavy = 0;
  if (adjusted) {
    if (houseCount >= 3) heavy = 0.12;
    else if (houseCount === 2) heavy = 0.08;
  } else {
    if (houseCount >= 4) heavy = 0.12;
    else if (houseCount === 3) heavy = 0.08;
  }

  const acq = heavy || acquisitionBaseRate(price);
  let edu, farm;
  if (heavy === 0.12) { edu = 0.004; farm = over85 ? 0.010 : 0; }
  else if (heavy === 0.08) { edu = 0.004; farm = over85 ? 0.006 : 0; }
  else { edu = acq * 0.1; farm = over85 ? 0.002 : 0; }

  return { acq, edu, farm, total: acq + edu + farm, heavy };
}

// ── 양도소득세 (부동산) ─────────────────────────────────
const ONE_HOUSE_EXEMPT_LINE = 1200000000; // 1세대 1주택 비과세 기준 12억

/** 장기보유특별공제 — 일반 (표1) */
function ltcgBasic(years) {
  if (years < 3) return 0;
  return Math.min(0.30, 0.06 + (Math.floor(years) - 3) * 0.02);
}
/** 장기보유특별공제 — 1세대 1주택 (표2, 보유 + 거주, 최대 80%) */
function ltcgOneHouse(holdYears, liveYears) {
  if (holdYears < 3) return 0;
  const hold = Math.min(0.40, Math.floor(holdYears) * 0.04);
  let live = 0;
  if (liveYears >= 3) live = Math.min(0.40, Math.floor(liveYears) * 0.04);
  else if (liveYears >= 2) live = 0.08;
  return Math.min(0.80, hold + live);
}

    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label={title}>

// ========================================
// 🔀 Router (hash-based)
// ========================================

const RouterContext = createContext({ path: '/', params: {}, navigate: () => {} });

function matchRoute(pattern, path) {
  const p = pattern.split('/').filter(Boolean);
  const c = path.split('/').filter(Boolean);
  if (p.length !== c.length) return null;
  const params = {};
  for (let i = 0; i < p.length; i++) {
    if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(c[i]);
    else if (p[i] !== c[i]) return null;
  }
  return params;
}

function Router({ children }) {
  const readHash = () => window.location.hash.replace(/^#/, '') || '/';
  const [path, setPath] = useState(readHash);

  useEffect(() => {
    const onChange = () => { setPath(readHash()); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', onChange);
    return () => window.removeEventListener('hashchange', onChange);
  }, []);

  const navigate = useCallback((to) => { window.location.hash = to; }, []);
  const value = useMemo(() => ({ path, navigate }), [path, navigate]);

  return <RouterContext.Provider value={value}>{children}</RouterContext.Provider>;
}

function useRouter() { return useContext(RouterContext); }

function Routes({ children }) {
  const ctx = useRouter();
  const routes = React.Children.toArray(children);

  const matched = useMemo(() => {
    for (const r of routes) {
      const params = matchRoute(r.props.path, ctx.path);
      if (params) return { element: r.props.element, params };
    }
    const fallback = routes.find((r) => r.props.path === '*');
    return fallback ? { element: fallback.props.element, params: {} } : null;
  }, [ctx.path, children]);

  const value = useMemo(() => ({ ...ctx, params: matched ? matched.params : {} }), [ctx, matched]);

  if (!matched) return null;
  return <RouterContext.Provider value={value}>{matched.element}</RouterContext.Provider>;
}

function Route() { return null; }

function Link({ to, className = '', children, onClick, ...rest }) {
  const { navigate } = useRouter();
  const handleClick = (e) => { e.preventDefault(); navigate(to); if (onClick) onClick(e); };
  return <a href={`#${to}`} className={className} onClick={handleClick} {...rest}>{children}</a>;
}

/** 계산 과정 한 줄 */
function Row({ label, value, sub, sign, strong, tone }) {
  const toneClass = tone === 'minus' ? 'text-rose-600' : tone === 'plus' ? 'text-ink-700' : 'text-slate-900';
  return (
    <div className={`flex items-start justify-between gap-4 py-2.5 ${strong ? 'font-bold' : ''}`}>
      <div className="min-w-0">
        <span className={`block text-sm ${strong ? 'text-slate-900' : 'text-slate-600'}`}>{label}</span>

      <span className={`tnum shrink-0 text-sm ${strong ? 'text-base' : ''} ${toneClass}`}>
        {sign}{typeof value === 'number' ? `${won(value)}원` : value}
      </span>
    </div>
  );
}

/** 좌: 입력 / 우: 결과 2단 레이아웃 */
function CalcLayout({ inputs, result }) {

function IncomePage() {
  const [mode, setMode] = useState('salary');   // salary | direct
  const [gross, setGross] = useState('');       // 총급여
  const [baseDirect, setBaseDirect] = useState(''); // 과세표준 직접 입력
  const [dependents, setDependents] = useState('0');
  const [pension, setPension] = useState('');   // 국민연금 등 공적연금보험료
  const [otherDeduct, setOtherDeduct] = useState(''); // 기타 소득공제
  const [taxCredit, setTaxCredit] = useState('');     // 기타 세액공제
  const [rateOpen, setRateOpen] = useState(false);

  const r = useMemo(() => {
    if (mode === 'direct') {
      const base = num(baseDirect);
      if (base <= 0) return null;
      const { tax, rate, deduct } = progressive(base, INCOME_BRACKETS);
      const credit = Math.min(tax, num(taxCredit));
      const decided = Math.max(0, tax - credit);
      return { kind: 'direct', base, tax, rate, deduct, credit, decided, local: decided * 0.1, total: decided * 1.1 };
    }

    const g = num(gross);
    if (g <= 0) return null;
    const eid = earnedIncomeDeduction(g);
    const incomeAmount = Math.max(0, g - eid);                 // 근로소득금액
    const personal = (1 + Math.max(0, Math.floor(num(dependents)))) * 1500000; // 본인 + 부양가족
    const pens = num(pension);
    const other = num(otherDeduct);
    const base = Math.max(0, incomeAmount - personal - pens - other);
    const { tax, rate, deduct } = progressive(base, INCOME_BRACKETS);
    const eitc = earnedIncomeTaxCredit(tax, g);
    const extra = num(taxCredit);
    const credit = Math.min(tax, eitc + extra);
    const decided = Math.max(0, tax - credit);
    return {
      kind: 'salary', gross: g, eid, incomeAmount, personal, pens, other,
      base, tax, rate, deduct, eitc, extra, credit, decided,
      local: decided * 0.1, total: decided * 1.1,
      effective: g > 0 ? (decided * 1.1) / g : 0,
    };
  }, [mode, gross, baseDirect, dependents, pension, otherDeduct, taxCredit]);

  const rows = !r ? [] : r.kind === 'direct' ? [
    { label: '과세표준', value: r.base, strong: true },
    { label: '산출세액', value: r.tax, sub: `적용 세율 ${pct(r.rate)}${r.deduct ? ` · 누진공제 ${won(r.deduct)}원` : ''}` },
    { label: '세액공제', value: r.credit, sign: '− ', tone: 'minus' },
    { label: '결정세액 (소득세)', value: r.decided, strong: true },
    { label: '지방소득세 (10%)', value: r.local, sign: '+ ', tone: 'plus' },
  ] : [
    { label: '총급여', value: r.gross },
    { label: '근로소득공제', value: r.eid, sign: '− ', tone: 'minus', sub: '한도 2,000만원' },
    { label: '근로소득금액', value: r.incomeAmount, strong: true },
    { label: '인적공제', value: r.personal, sign: '− ', tone: 'minus', sub: `본인 포함 ${1 + Math.max(0, Math.floor(num(dependents)))}명 × 150만원` },
    { label: '연금보험료공제', value: r.pens, sign: '− ', tone: 'minus' },
    { label: '그 밖의 소득공제', value: r.other, sign: '− ', tone: 'minus' },
    { label: '과세표준', value: r.base, strong: true },
    { label: '산출세액', value: r.tax, sub: `적용 세율 ${pct(r.rate)}${r.deduct ? ` · 누진공제 ${won(r.deduct)}원` : ''}` },
    { label: '근로소득세액공제', value: r.eitc, sign: '− ', tone: 'minus' },
    { label: '그 밖의 세액공제', value: r.extra, sign: '− ', tone: 'minus' },
    { label: '결정세액 (소득세)', value: r.decided, strong: true },
    { label: '지방소득세 (10%)', value: r.local, sign: '+ ', tone: 'plus' },
  ];

  return (
    <PageShell
      eyebrow="소득세"
      title="근로소득 · 종합소득세"
      lead="총급여를 넣으면 근로소득공제부터 결정세액까지 단계별로 계산한다. 과세표준을 이미 알고 있다면 직접 입력 모드를 쓴다."
    >
      <CalcLayout
        inputs={
          <>
            <InputCard title="계산 방식"
              action={<Button size="sm" variant="ghost" onClick={() => setRateOpen(true)}>세율표</Button>}>
              <Segmented value={mode} onChange={setMode} options={[
                { value: 'salary', label: '총급여로 계산 (근로소득)' },
                { value: 'direct', label: '과세표준 직접 입력' },
              ]} />
            </InputCard>

            {mode === 'salary' ? (
              <>
                <InputCard title="소득">
                  <MoneyField label="총급여 (연간, 비과세 제외)" value={gross} onChange={setGross}
                    hint="세전 연봉에서 비과세 급여를 뺀 금액" />
                </InputCard>

                <InputCard title="공제">
                  <div className="grid gap-4 sm:grid-cols-2">
                    <Input label="부양가족 수 (본인 제외)" type="number" inputMode="numeric"
                      value={dependents} onChange={setDependents} suffix="명"
                      hint="본인 150만원은 자동 포함된다" />
                    <MoneyField label="연금보험료공제" value={pension} onChange={setPension}
                      hint="국민연금 등 본인 부담분" />
                  </div>
                  <div className="mt-4 grid gap-4 sm:grid-cols-2">
                    <MoneyField label="그 밖의 소득공제" value={otherDeduct} onChange={setOtherDeduct}
                      hint="신용카드·주택청약·보험료 등 합계" />
                    <MoneyField label="그 밖의 세액공제" value={taxCredit} onChange={setTaxCredit}
                      hint="자녀·연금계좌·의료비·기부금 등" />
                  </div>
                </InputCard>
              </>
            ) : (
              <InputCard title="과세표준 직접 입력">
                <MoneyField label="과세표준" value={baseDirect} onChange={setBaseDirect}
                  hint="각종 공제를 모두 반영한 뒤의 금액" />
                <MoneyField className="mt-4" label="세액공제 합계" value={taxCredit} onChange={setTaxCredit} />
              </InputCard>
            )}
          </>
        }
        result={
          <>
            <ResultCard
              empty={!r}
              title="총 부담세액 (소득세 + 지방소득세)"
              amount={r ? r.total : 0}
              caption={r && r.kind === 'salary' ? `총급여 대비 실효세율 ${pct(r.effective, 2)}` : undefined}
              rows={rows}
              notes={[
                '4대보험료(건강·고용) 본인 부담분은 별도이며 여기에 포함되지 않는다.',
                '자녀세액공제, 연금계좌·의료비·교육비·기부금 세액공제는 직접 입력해야 반영된다.',
                '소득 종류가 여럿이면 합산 후 종합소득세로 신고해야 한다.',
              ]}
            />
          </>
        }
      />

      <Modal isOpen={rateOpen} onClose={() => setRateOpen(false)} title="소득세 세율표">
        <RateTable title="종합소득 과세표준 세율" rows={INCOME_BRACKETS} />
        <p className="mt-4 text-sm leading-relaxed text-slate-600">
          산출세액 = 과세표준 × 세율 − 누진공제. 여기에 소득세액의 10%가 지방소득세로 더해진다.
        </p>
      </Modal>
    </PageShell>
  );
}

// 📄 Page — 종합부동산세

function JongbusePage() {
  const [priceSum, setPriceSum] = useState('');   // 공시가격 합계
  const [single, setSingle] = useState(true);     // 1세대 1주택 여부
  const [houseCount, setHouseCount] = useState('1');
  const [age, setAge] = useState('');
  const [holdYears, setHoldYears] = useState('');
  const [rateOpen, setRateOpen] = useState(false);

  const count = Math.max(1, Math.floor(num(houseCount, 1)));
  const isMulti = count >= 3;

  const r = useMemo(() => {
    const p = num(priceSum);
    if (p <= 0) return null;
    const deduction = single ? DEDUCT_SINGLE : DEDUCT_OTHER;
    const base = Math.max(0, (p - deduction) * FAIR_RATIO);
    const table = isMulti ? JONGBU_MULTI : JONGBU_GENERAL;
    const { tax, rate, deduct } = progressive(base, table);

    // 1세대 1주택자만 고령자·장기보유 세액공제 (합계 80% 한도)
    let elderly = 0, longHold = 0, creditRate = 0;
    if (single) {
      elderly = elderlyRate(num(age));
      longHold = longHoldRate(num(holdYears));
      creditRate = Math.min(0.8, elderly + longHold);
    }
    const credit = tax * creditRate;
    const jong = Math.max(0, tax - credit);
    const farm = jong * 0.2; // 농어촌특별세
    return { p, deduction, base, tax, rate, deduct, elderly, longHold, creditRate, credit, jong, farm, total: jong + farm };
  }, [priceSum, single, isMulti, age, holdYears]);

  const rows = !r ? [] : [
    { label: '주택 공시가격 합계', value: r.p },
    { label: '공제금액', value: r.deduction, sign: '− ', tone: 'minus',
      sub: single ? '1세대 1주택자 12억원' : '그 외 9억원' },
    { label: `공정시장가액비율 ${pct(FAIR_RATIO, 0)}`, value: `× ${pct(FAIR_RATIO, 0)}` },
    { label: '과세표준', value: r.base, strong: true },
    { label: '종부세 산출세액', value: r.tax,
      sub: `${isMulti ? '3주택 이상' : '2주택 이하'} · 세율 ${pct(r.rate, 1)}${r.deduct ? ` · 누진공제 ${won(r.deduct)}원` : ''}` },
    ...(single && r.creditRate > 0 ? [{
      label: '세액공제', value: r.credit, sign: '− ', tone: 'minus',
      sub: `고령자 ${pct(r.elderly, 0)} + 장기보유 ${pct(r.longHold, 0)} = ${pct(r.creditRate, 0)} (80% 한도)`,
    }] : []),
    { label: '종합부동산세', value: r.jong, strong: true },
    { label: '농어촌특별세 (20%)', value: r.farm, sign: '+ ', tone: 'plus' },
  ];

  return (
    <PageShell
      eyebrow="종합부동산세"
      title="종합부동산세 (주택 · 개인)"
      lead="매년 6월 1일 기준 보유 주택의 공시가격 합계로 계산한다. 공제금액을 뺀 뒤 공정시장가액비율 60%를 곱해 과세표준을 만든다."
    >
      <CalcLayout
        inputs={
          <>
            <InputCard title="보유 현황"
              action={<Button size="sm" variant="ghost" onClick={() => setRateOpen(true)}>세율표</Button>}>
              <MoneyField label="주택 공시가격 합계" value={priceSum} onChange={setPriceSum}
                hint="시가가 아니라 공시가격이다" />
              <div className="mt-4 grid gap-4 sm:grid-cols-2">
                <Input label="보유 주택 수" type="number" inputMode="numeric" value={houseCount}
                  onChange={setHouseCount} suffix="채"
                  hint={isMulti ? '3주택 이상 → 중과 세율 적용' : '2주택 이하 → 일반 세율'} />
                <div className="flex items-end pb-1">
                  <Checkbox checked={single} onChange={(v) => setSingle(v)}
                    label="1세대 1주택자"
                    description="공제금액 12억원 및 고령자·장기보유 세액공제 대상" />
                </div>
              </div>
            </InputCard>

            <InputCard title="세액공제 (1세대 1주택자만)">
              {!single && (
                <p className="mb-3 rounded-lg bg-slate-100 px-4 py-2.5 text-xs text-slate-500">
                  1세대 1주택자가 아니면 고령자·장기보유 세액공제는 적용되지 않는다.
                </p>

              <div className="grid gap-4 sm:grid-cols-2">
                <Input label="만 나이" type="number" inputMode="numeric" value={age} onChange={setAge}
                  suffix="세" disabled={!single}

        result={

            rows={rows}

              '세부담상한(직전 연도 대비 150%) 적용 전 금액이다.',

              '법인 보유분은 별도 세율 체계라 이 계산기로는 맞지 않는다.',
            ]}
          />
        }
      />

      <Modal isOpen={rateOpen} onClose={() => setRateOpen(false)} title="종합부동산세 세율표" size="lg">
        <div className="space-y-6">
          <RateTable title="2주택 이하 (일반)" rows={JONGBU_GENERAL} unitPercent={1} />
          <RateTable title="3주택 이상 (중과)" rows={JONGBU_MULTI} unitPercent={1} />
          <p className="text-sm leading-relaxed text-slate-600">

            공제금액은 1세대 1주택자 12억원, 그 외 9억원이다.

        </div>

    </PageShell>

function CapitalGainsPage() {
  const [salePrice, setSalePrice] = useState('');
  const [buyPrice, setBuyPrice] = useState('');
  const [expense, setExpense] = useState('');
  const [assetType, setAssetType] = useState('house'); // house | other
  const [holdYears, setHoldYears] = useState('');
  const [liveYears, setLiveYears] = useState('');
  const [oneHouse, setOneHouse] = useState(false);
  const [heavy, setHeavy] = useState('none'); // none | plus20 | plus30

  const r = useMemo(() => {
    const sale = num(salePrice);
    const buy = num(buyPrice);
    const exp = num(expense);
    if (sale <= 0) return null;

    const gainAll = sale - buy - exp;                 // 전체 양도차익
    const hold = Math.max(0, num(holdYears));
    const live = Math.max(0, num(liveYears));

    // 1세대 1주택 비과세 — 12억 초과분만 과세
    let taxableRatio = 1;
    let exempt = false;
    if (oneHouse && assetType === 'house') {
      if (sale <= ONE_HOUSE_EXEMPT_LINE) { taxableRatio = 0; exempt = true; }
      else taxableRatio = (sale - ONE_HOUSE_EXEMPT_LINE) / sale;
    }
    const gain = Math.max(0, gainAll) * taxableRatio;

    // 장기보유특별공제
    const ltcgRate = gainAll <= 0 ? 0
      : (oneHouse && assetType === 'house') ? ltcgOneHouse(hold, live) : ltcgBasic(hold);
    const ltcg = gain * ltcgRate;
    const incomeAmount = Math.max(0, gain - ltcg);

    const basicDeduct = incomeAmount > 0 ? Math.min(2500000, incomeAmount) : 0;
    const base = Math.max(0, incomeAmount - basicDeduct);

    // 세율
    let flatRate = null, label = '';
    if (assetType === 'house') {
      if (hold < 1) { flatRate = 0.70; label = '보유 1년 미만 주택 70% 단일세율'; }
      else if (hold < 2) { flatRate = 0.60; label = '보유 1~2년 주택 60% 단일세율'; }
    } else {
      if (hold < 1) { flatRate = 0.50; label = '보유 1년 미만 50% 단일세율'; }
      else if (hold < 2) { flatRate = 0.40; label = '보유 1~2년 40% 단일세율'; }
    }

    let tax, rateUsed, deductUsed = 0;
    if (flatRate !== null) {
      tax = base * flatRate;
      rateUsed = flatRate;
    } else {
      const surcharge = heavy === 'plus20' ? 0.20 : heavy === 'plus30' ? 0.30 : 0;
      const p = progressive(base, INCOME_BRACKETS);
      tax = p.tax + base * surcharge;
      rateUsed = p.rate + surcharge;
      deductUsed = p.deduct;
      label = surcharge > 0
        ? `기본세율 ${pct(p.rate)} + 중과 ${pct(surcharge, 0)}p`
        : `기본세율 ${pct(p.rate)}${p.deduct ? ` · 누진공제 ${won(p.deduct)}원` : ''}`;
    }

    return {
      sale, buy, exp, gainAll, exempt, taxableRatio, gain,
      ltcgRate, ltcg, incomeAmount, basicDeduct, base,
      tax, rateUsed, deductUsed, label,
      local: tax * 0.1, total: tax * 1.1,
    };
  }, [salePrice, buyPrice, expense, assetType, holdYears, liveYears, oneHouse, heavy]);

  const rows = !r ? [] : [
    { label: '양도가액', value: r.sale },
    { label: '취득가액', value: r.buy, sign: '− ', tone: 'minus' },
    { label: '필요경비', value: r.exp, sign: '− ', tone: 'minus', sub: '중개보수·법무비·자본적지출 등' },
    { label: '양도차익', value: r.gainAll, strong: true },
    ...(r.taxableRatio < 1 ? [{
      label: '과세대상 양도차익', value: r.gain,
      sub: r.exempt ? '12억원 이하 1세대 1주택 → 전액 비과세' : `12억 초과분 비율 ${pct(r.taxableRatio, 2)} 적용`,
    }] : []),
    { label: '장기보유특별공제', value: r.ltcg, sign: '− ', tone: 'minus',
      sub: r.ltcgRate > 0 ? `공제율 ${pct(r.ltcgRate, 0)}` : '보유 3년 미만은 공제 없음' },
    { label: '양도소득금액', value: r.incomeAmount },
    { label: '기본공제', value: r.basicDeduct, sign: '− ', tone: 'minus', sub: '연 250만원' },
    { label: '과세표준', value: r.base, strong: true },
    { label: '산출세액', value: r.tax, sub: r.label },
    { label: '지방소득세 (10%)', value: r.local, sign: '+ ', tone: 'plus' },
  ];

  return (
    <PageShell
      eyebrow="양도소득세"
      title="부동산 양도소득세"
      lead="양도차익에서 장기보유특별공제와 기본공제를 빼 과세표준을 만들고, 보유기간과 자산 종류에 따른 세율을 적용한다."
    >
      <CalcLayout
        inputs={
          <>
            <InputCard title="양도 · 취득">
              <div className="grid gap-4 sm:grid-cols-2">
                <MoneyField label="양도가액 (판 금액)" value={salePrice} onChange={setSalePrice} />
                <MoneyField label="취득가액 (산 금액)" value={buyPrice} onChange={setBuyPrice} />
              </div>
              <MoneyField className="mt-4" label="필요경비" value={expense} onChange={setExpense}
                hint="취득세·중개보수·법무비·자본적지출 등" />
            </InputCard>

            <InputCard title="자산 · 보유">
              <Segmented label="자산 종류" value={assetType} onChange={setAssetType} options={[
                { value: 'house', label: '주택' },
                { value: 'other', label: '토지 · 건물 등' },
              ]} />
              <div className="mt-4 grid gap-4 sm:grid-cols-2">
                <Input label="보유기간" type="number" inputMode="numeric" value={holdYears}
                  onChange={setHoldYears} suffix="년"
                  hint="1년 미만·1~2년은 단일 중과세율" />
                <Input label="거주기간" type="number" inputMode="numeric" value={liveYears}
                  onChange={setLiveYears} suffix="년" disabled={!oneHouse || assetType !== 'house'}
                  hint="1세대 1주택 장특공(표2)에만 사용" />
              </div>
              <div className="mt-4 space-y-3">
                <Checkbox checked={oneHouse} onChange={setOneHouse}
                  label="1세대 1주택 비과세 요건 충족"
                  description="12억원 이하는 비과세, 초과분만 과세된다" />
                <Select label="조정대상지역 다주택 중과" value={heavy} onChange={setHeavy}
                  options={[
                    { value: 'none', label: '적용 안 함 (중과 한시 배제 등)' },
                    { value: 'plus20', label: '2주택 — 기본세율 + 20%p' },
                    { value: 'plus30', label: '3주택 이상 — 기본세율 + 30%p' },
                  ]}
                  hint="중과는 한시 배제 기간이 반복 연장되어 왔다. 적용 여부를 반드시 확인한다." />
              </div>
            </InputCard>
          </>
        }
        result={
          <ResultCard
            empty={!r}
            title="총 부담세액 (양도세 + 지방소득세)"
            amount={r ? r.total : 0}
            caption={r && r.gainAll <= 0 ? '양도차손이 발생해 납부할 세액이 없다' : undefined}
            rows={rows}
            notes={[
              '중과 적용 시 장기보유특별공제가 배제되는 경우가 있으나 반영되지 않았다.',
              '분양권·조합원입주권은 별도 세율 체계다.',
              '같은 해에 여러 건을 양도하면 합산 신고해야 하고 기본공제는 연 1회만 적용된다.',
              '1세대 1주택 비과세는 보유·거주 요건 충족 여부를 별도로 확인해야 한다.',
            ]}
          />
        }
      />
    </PageShell>
  );
}

function InheritancePage() {
  const [tab, setTab] = useState('gift'); // gift | inherit
  const [rateOpen, setRateOpen] = useState(false);

  // 증여
  const [giftAmount, setGiftAmount] = useState('');
  const [relation, setRelation] = useState('lineal_adult');
  const [priorGift, setPriorGift] = useState('');
  const [marriageDeduct, setMarriageDeduct] = useState(false);

  // 상속
  const [estate, setEstate] = useState('');
  const [debt, setDebt] = useState('');
  const [hasSpouse, setHasSpouse] = useState(true);
  const [spouseDeduct, setSpouseDeduct] = useState('500000000');
  const [financial, setFinancial] = useState('');

  const gift = useMemo(() => {
    const amount = num(giftAmount);
    if (amount <= 0) return null;
    const rel = GIFT_RELATIONS.find((x) => x.value === relation);
    const prior = num(priorGift);
    const totalGift = amount + prior;
    const marriage = marriageDeduct ? 100000000 : 0;

    // 10년 합산 과세표준에 세율을 적용한 뒤, 사전증여분 산출세액을 기납부세액으로 뺀다
    const base = Math.max(0, totalGift - rel.deduction - marriage);
    const combined = progressive(base, INHERIT_BRACKETS);
    const priorBase = Math.max(0, prior - Math.min(prior, rel.deduction));
    const priorPaid = prior > 0 ? progressive(priorBase, INHERIT_BRACKETS).tax : 0;
    const tax = Math.max(0, combined.tax - priorPaid);

    const filingCredit = tax * 0.03;
    return {
      amount, prior, totalGift, rel, marriage, base,
      combinedTax: combined.tax, rate: combined.rate, deduct: combined.deduct,
      priorPaid, tax, filingCredit, final: Math.max(0, tax - filingCredit),
    };
  }, [giftAmount, relation, priorGift, marriageDeduct]);

  const inherit = useMemo(() => {
    const gross = num(estate);
    if (gross <= 0) return null;
    const liabilities = num(debt);
    const taxableEstate = Math.max(0, gross - liabilities);
    const lump = 500000000;                                   // 일괄공제 5억
    const spouse = hasSpouse ? Math.min(3000000000, Math.max(500000000, num(spouseDeduct))) : 0;
    const fin = num(financial);
    const finDeduct = fin <= 0 ? 0 : fin <= 20000000 ? fin : Math.min(200000000, fin * 0.2);
    const deductions = lump + spouse + finDeduct;
    const base = Math.max(0, taxableEstate - deductions);
    const { tax, rate, deduct } = progressive(base, INHERIT_BRACKETS);
    const filingCredit = tax * 0.03;
    return { gross, liabilities, taxableEstate, lump, spouse, finDeduct, deductions, base, tax, rate, deduct, filingCredit, final: Math.max(0, tax - filingCredit) };
  }, [estate, debt, hasSpouse, spouseDeduct, financial]);

  const giftRows = !gift ? [] : [
    { label: '이번 증여재산', value: gift.amount },
    ...(gift.prior > 0 ? [{ label: '10년 내 사전증여 합산', value: gift.prior, sign: '+ ', tone: 'plus' }] : []),
    { label: '증여재산가액 합계', value: gift.totalGift, strong: true },
    { label: '증여재산공제', value: gift.rel.deduction, sign: '− ', tone: 'minus', sub: `${gift.rel.label} · 10년간 한도` },
    ...(gift.marriage > 0 ? [{ label: '혼인·출산 증여재산공제', value: gift.marriage, sign: '− ', tone: 'minus' }] : []),
    { label: '과세표준', value: gift.base, strong: true },
    { label: '합산 산출세액', value: gift.combinedTax,
      sub: `세율 ${pct(gift.rate, 0)}${gift.deduct ? ` · 누진공제 ${won(gift.deduct)}원` : ''}` },
    ...(gift.priorPaid > 0 ? [{
      label: '기납부세액공제', value: gift.priorPaid, sign: '− ', tone: 'minus',
      sub: '사전증여분에 이미 낸 세액',
    }] : []),
    { label: '이번 증여분 산출세액', value: gift.tax, strong: true },
    { label: '신고세액공제 (3%)', value: gift.filingCredit, sign: '− ', tone: 'minus', sub: '기한 내 신고 시' },
  ];

  const inheritRows = !inherit ? [] : [
    { label: '총 상속재산', value: inherit.gross },
    { label: '채무 · 공과금 · 장례비', value: inherit.liabilities, sign: '− ', tone: 'minus' },
    { label: '상속세 과세가액', value: inherit.taxableEstate, strong: true },
    { label: '일괄공제', value: inherit.lump, sign: '− ', tone: 'minus', sub: '기초공제 2억 + 인적공제 대신 5억 적용' },
    ...(inherit.spouse > 0 ? [{ label: '배우자상속공제', value: inherit.spouse, sign: '− ', tone: 'minus', sub: '최소 5억 ~ 최대 30억' }] : []),
    ...(inherit.finDeduct > 0 ? [{ label: '금융재산상속공제', value: inherit.finDeduct, sign: '− ', tone: 'minus', sub: '순금융재산의 20%, 최대 2억' }] : []),
    { label: '과세표준', value: inherit.base, strong: true },
    { label: '산출세액', value: inherit.tax, sub: `세율 ${pct(inherit.rate, 0)}${inherit.deduct ? ` · 누진공제 ${won(inherit.deduct)}원` : ''}` },
    { label: '신고세액공제 (3%)', value: inherit.filingCredit, sign: '− ', tone: 'minus' },
  ];

  return (
    <PageShell
      eyebrow="상속세 · 증여세"
      title="상속세와 증여세"
      lead="두 세목은 10~50%의 동일한 5단계 세율을 쓴다. 차이는 공제 구조에 있다. 증여는 관계별 공제(10년 합산), 상속은 일괄공제와 배우자공제가 핵심이다."
    >
      <div className="mb-6 flex flex-wrap gap-2" role="tablist" aria-label="세목 선택">
        {[{ id: 'gift', label: '증여세' }, { id: 'inherit', label: '상속세' }].map((t) => (
          <button key={t.id} role="tab" aria-selected={tab === t.id} onClick={() => setTab(t.id)}
            className={`rounded-lg px-5 py-2.5 text-sm font-semibold transition-colors
              ${tab === t.id ? 'bg-ink-900 text-white' : 'bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-ink-50'}`}>
            {t.label}
          </button>
        ))}
        <Button size="sm" variant="ghost" className="ml-auto" onClick={() => setRateOpen(true)}>세율표</Button>
      </div>

      {tab === 'gift' ? (
        <CalcLayout
          inputs={
            <InputCard title="증여 정보">
              <MoneyField label="증여재산가액" value={giftAmount} onChange={setGiftAmount} />
              <Select className="mt-4" label="증여자와의 관계" value={relation} onChange={setRelation}
                options={GIFT_RELATIONS.map((x) => ({ value: x.value, label: `${x.label} — 공제 ${koreanMoney(x.deduction)}` }))}
                hint="증여재산공제는 10년간 합산 한도다" />
              <MoneyField className="mt-4" label="10년 내 동일인 사전증여" value={priorGift} onChange={setPriorGift}
                hint="있으면 합산해 누진세율을 적용한다" />
              <div className="mt-4">
                <Checkbox checked={marriageDeduct} onChange={setMarriageDeduct}
                  label="혼인·출산 증여재산공제 적용 (1억원)"
                  description="직계존속으로부터 혼인신고일 전후 2년 또는 출산일로부터 2년 이내 증여받은 경우" />
              </div>
            </InputCard>
          }
          result={
            <ResultCard
              empty={!gift}
              title="납부할 증여세"
              amount={gift ? gift.final : 0}
              caption={gift && gift.base === 0 ? '공제 범위 내라 납부할 세액이 없다' : undefined}
              rows={giftRows}
              notes={[
                '증여재산공제는 10년간 합산 한도이므로, 과거 증여 이력을 정확히 확인해야 한다.',
                '부동산 증여는 취득세(증여 취득 3.5% 등)가 별도로 발생한다.',
                '세대를 건너뛴 증여(조부모 → 손자)는 산출세액의 30~40%가 할증된다.',
                '창업자금·가업승계 등 과세특례는 반영되지 않았다.',
              ]}
            />
          }
        />
      ) : (
        <CalcLayout
          inputs={
            <InputCard title="상속 정보">
              <div className="grid gap-4 sm:grid-cols-2">
                <MoneyField label="총 상속재산" value={estate} onChange={setEstate}
                  hint="부동산·금융재산·기타 합계" />
                <MoneyField label="채무 · 공과금 · 장례비" value={debt} onChange={setDebt} />
              </div>
              <MoneyField className="mt-4" label="순금융재산" value={financial} onChange={setFinancial}
                hint="예금·주식 등에서 금융채무를 뺀 금액 (금융재산상속공제용)" />
              <div className="mt-4 space-y-3">
                <Checkbox checked={hasSpouse} onChange={setHasSpouse}
                  label="배우자가 있다"
                  description="배우자상속공제는 최소 5억원이 보장된다" />
                {hasSpouse && (
                  <MoneyField label="배우자상속공제액" value={spouseDeduct} onChange={setSpouseDeduct}
                    hint="최소 5억 ~ 최대 30억. 실제 상속분과 법정상속분 한도 내" />
                )}
              </div>
            </InputCard>
          }
          result={
            <ResultCard
              empty={!inherit}
              title="납부할 상속세"
              amount={inherit ? inherit.final : 0}
              caption={inherit && inherit.base === 0 ? '공제 범위 내라 납부할 세액이 없다' : undefined}
              rows={inheritRows}
              notes={[
                '일괄공제 5억원을 적용했다. 기초공제 + 인적공제 합계가 더 크면 그쪽이 유리하다.',
                '동거주택상속공제, 가업·영농상속공제는 반영되지 않았다.',
                '10년 내 사전증여재산은 상속재산에 합산해야 하나 여기서는 별도 입력이 없다.',
                '상속인별 실제 부담액은 상속지분에 따라 나뉜다. 위 금액은 총 상속세다.',
              ]}
            />
          }
        />
      )}

      <Modal isOpen={rateOpen} onClose={() => setRateOpen(false)} title="상속세 · 증여세 세율표">
        <RateTable title="과세표준별 세율 (상속·증여 동일)" rows={INHERIT_BRACKETS} unitPercent={0} />
        <div className="mt-5 space-y-2 text-sm leading-relaxed text-slate-600">
          <p>산출세액 = 과세표준 × 세율 − 누진공제. 기한 내 신고하면 산출세액의 3%를 공제한다.</p>
          <p className="font-semibold text-slate-800">증여재산공제 (10년 합산)</p>
          <ul className="list-disc space-y-1 pl-5 text-sm">
            {GIFT_RELATIONS.map((g) => (
              <li key={g.value}>{g.label} — {koreanMoney(g.deduction)}</li>
            ))}
          </ul>
        </div>
      </Modal>
    </PageShell>
  );
}


// ========================================
// 📄 Page — Not Found
// ========================================

function NotFoundPage() {
  const { navigate } = useRouter();
  return (
    <PageShell eyebrow="404" title="페이지를 찾을 수 없다" lead="주소를 확인하거나 아래에서 이동한다.">
      <Button size="lg" onClick={() => navigate('/')}>홈으로 돌아가기</Button>
    </PageShell>
  );
}


// ========================================
// 🚀 App
// ========================================

function App() {
  return (
    <Router>
      <div className="flex min-h-screen flex-col">
        <Header />
        <div className="flex-1">
          <Routes>
            <Route path="/" element={<HomePage />} />
            <Route path="/income" element={<IncomePage />} />
            <Route path="/jongbuse" element={<JongbusePage />} />
            <Route path="/acquisition" element={<AcquisitionPage />} />
            <Route path="/capital-gains" element={<CapitalGainsPage />} />
            <Route path="/inheritance" element={<InheritancePage />} />
            <Route path="*" element={<NotFoundPage />} />
          </Routes>
        </div>
        <Footer />
      </div>
    </Router>
  );
}


// ========================================
// Rendering
// ========================================
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
