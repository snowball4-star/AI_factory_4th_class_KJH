<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 가계부</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN은 버전을 명시적으로 고정한다. Babel 은 반드시 7.x (8.x는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .animate-fade-in { animation: fade-in .18s ease-out; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks Destructuring
    // ========================================
    const { useState, useEffect, useRef, useMemo, useCallback, useContext, createContext } = React;

    // ========================================
    // ⚙️ Config & Utils
    // ========================================
    const API_BASE_URL = '/api';

    async function api(endpoint, options = {}) {
      const res = await fetch(`${API_BASE_URL}${endpoint}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
        body: options.body ? JSON.stringify(options.body) : undefined,
      });
      let json;
      try { json = await res.json(); } catch { throw new Error('서버 응답을 읽을 수 없습니다'); }
      if (!res.ok || !json.success) throw new Error(json.message || '요청에 실패했습니다');
      return json.data;
    }

    const won = (n) => `${Math.round(n).toLocaleString('ko-KR')}원`;
    const pad = (n) => String(n).padStart(2, '0');
    const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
    const thisMonth = () => todayStr().slice(0, 7);
    const shiftMonth = (month, delta) => {
      const [y, m] = month.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    };
    const monthLabel = (month) => { const [y, m] = month.split('-'); return `${y}년 ${Number(m)}월`; };
    const dayLabel = (date) => {
      const d = new Date(date + 'T00:00:00');
      return `${d.getMonth() + 1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`;
    };

    const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    // 부호 포함 금액: 지출은 -, 수입은 +. 지출 취소·환불(음수)은 +로 표시된다
    const signedWon = (tx) => {
      const v = tx.type === 'income' ? tx.amount : -tx.amount;
      return `${v > 0 ? '+' : v < 0 ? '-' : ''}${won(Math.abs(v))}`;
    };

    // 편한가계부 분류 체계
    const CATEGORY_ICONS = {
      '식사': '🍚', '교통비': '🚕', '사회생활': '🍻', '생활품': '🧻', '문화': '🎬', '투자': '📈',
      '건강': '💊', '경조사': '💐', '빚이자세금': '🧾', '교육': '📚', '미용': '💇', '자기계발': '🧠',
      '의복': '👕', '기타': '📌', '미분류': '❔',
      '월급': '💼', '기타소득': '💸', '수당': '🎖️', '보너스': '🎁', '잔액수정': '⚖️',
    };
    const PALETTE = ['#6366f1', '#f43f5e', '#f59e0b', '#10b981', '#0ea5e9', '#a855f7', '#ec4899', '#84cc16', '#14b8a6', '#f97316', '#64748b'];

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled, onClick, type = 'button', className = '', children, ...rest }) {
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700 focus-visible:ring-indigo-500',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus-visible:ring-slate-400',
        danger: 'bg-rose-600 text-white hover:bg-rose-700 focus-visible:ring-rose-500',
        ghost: 'text-slate-600 hover:bg-slate-100 focus-visible:ring-slate-400',
      };
      const sizes = { sm: 'px-2.5 py-1.5 text-sm', md: 'px-4 py-2 text-sm', lg: 'px-5 py-3 text-base' };
      return (
        <button type={type} disabled={disabled} onClick={onClick}
          className={`inline-flex items-center justify-center gap-1.5 rounded-lg font-medium transition focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-1 disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}>
          {children}
        </button>
      );
    }

    function Input({ label, id, error, className = '', ...rest }) {
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="block text-sm font-medium text-slate-600 mb-1">{label}</label>}
          <input id={id}
            className={`w-full rounded-lg border px-3 py-2 text-sm focus:outline-none focus:ring-2 disabled:bg-slate-100 ${error ? 'border-rose-400 focus:ring-rose-300' : 'border-slate-300 focus:ring-indigo-300'}`}
            aria-invalid={!!error} aria-describedby={error ? `${id}-err` : undefined} {...rest} />
          {error && <p id={`${id}-err`} className="mt-1 text-xs text-rose-600">{error}</p>}
        </div>
      );
    }

    function Select({ label, id, options, className = '', ...rest }) {
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="block text-sm font-medium text-slate-600 mb-1">{label}</label>}
          <select id={id} className="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" {...rest}>
            {options.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </div>
      );
    }

    function Card({ className = '', children }) {
      return <section className={`bg-white rounded-2xl shadow-sm border border-slate-200/70 p-5 ${className}`}>{children}</section>;
    }

    function Badge({ color = 'slate', children }) {
      const colors = {
        slate: 'bg-slate-100 text-slate-600', rose: 'bg-rose-50 text-rose-600',
        emerald: 'bg-emerald-50 text-emerald-600', indigo: 'bg-indigo-50 text-indigo-600',
      };
      return <span className={`inline-block rounded-full px-2 py-0.5 text-xs font-medium ${colors[color]}`}>{children}</span>;
    }

    function Modal({ isOpen, onClose, title, size = 'md', children }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => e.key === 'Escape' && onClose();
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [isOpen, onClose]);
      if (!isOpen) return null;
      const sizes = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-2xl' };
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/40 p-0 sm:p-4" onClick={onClose}>
          <div role="dialog" aria-modal="true" aria-label={title}
            className={`animate-fade-in w-full ${sizes[size]} bg-white rounded-t-2xl sm:rounded-2xl shadow-xl max-h-[92vh] overflow-y-auto`}
            onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between px-5 pt-5 pb-2">
              <h2 className="text-lg font-bold">{title}</h2>
              <button onClick={onClose} aria-label="닫기" className="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600">✕</button>
            </div>
            <div className="px-5 pb-5">{children}</div>
          </div>
        </div>
      );
    }

    function Tabs({ tabs, value, onChange, className = '' }) {
      return (
        <div role="tablist" className={`inline-flex rounded-lg bg-slate-100 p-1 ${className}`}>
          {tabs.map((t) => (
            <button key={t.value} role="tab" aria-selected={value === t.value} onClick={() => onChange(t.value)}
              className={`px-3 py-1.5 text-sm rounded-md font-medium transition ${value === t.value ? 'bg-white shadow-sm text-slate-900' : 'text-slate-500 hover:text-slate-700'}`}>
              {t.label}
            </button>
          ))}
        </div>
      );
    }

    function Spinner({ className = '' }) {
      return <div role="status" aria-label="불러오는 중" className={`h-6 w-6 animate-spin rounded-full border-2 border-indigo-200 border-t-indigo-600 ${className}`} />;
    }

    function EmptyState({ icon = '📭', title, description, action }) {
      return (
        <div className="py-10 text-center">
          <div className="text-4xl mb-2">{icon}</div>
          <p className="font-medium text-slate-700">{title}</p>
          {description && <p className="text-sm text-slate-500 mt-1">{description}</p>}
          {action && <div className="mt-4">{action}</div>}
        </div>
      );
    }

    function ErrorBox({ message, onRetry }) {
      return (
        <div role="alert" className="rounded-xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700 flex items-center justify-between gap-3">
          <span>⚠️ {message}</span>
          {onRetry && <Button size="sm" variant="secondary" onClick={onRetry}>다시 시도</Button>}
        </div>
      );
    }

    function ProgressBar({ value, max, className = '' }) {
      const pct = max > 0 ? Math.min((value / max) * 100, 100) : 0;
      const color = pct >= 100 ? 'bg-rose-500' : pct >= 80 ? 'bg-amber-500' : 'bg-indigo-500';
      return (
        <div className={`h-3 w-full rounded-full bg-slate-100 overflow-hidden ${className}`}
          role="progressbar" aria-valuenow={Math.round(pct)} aria-valuemin={0} aria-valuemax={100}>
          <div className={`h-full rounded-full transition-all duration-500 ${color}`} style={{ width: `${pct}%` }} />
        </div>
      );
    }

    // Chart.js 래퍼: config가 바뀌면 차트를 다시 그리고, 언마운트 시 파기한다
    function ChartCanvas({ type, data, options, className = '', ariaLabel }) {
      const canvasRef = useRef(null);
      useEffect(() => {
        const chart = new Chart(canvasRef.current, {
          type, data,
          options: { responsive: true, maintainAspectRatio: false, ...options },
        });
        return () => chart.destroy();
      }, [type, data, options]);
      return <div className={`relative ${className}`}><canvas ref={canvasRef} role="img" aria-label={ariaLabel} /></div>;
    }

    // ========================================
    // 🔀 Router Components
    // ========================================
    const RouterContext = createContext({ path: '/' });

    function getHashPath() {
      return window.location.hash.replace(/^#/, '') || '/';
    }

    function Router({ children }) {
      const [path, setPath] = useState(getHashPath());
      useEffect(() => {
        const onHash = () => { setPath(getHashPath()); window.scrollTo(0, 0); };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);
      const navigate = useCallback((to) => { window.location.hash = to; }, []);
      return <RouterContext.Provider value={{ path, navigate }}>{children}</RouterContext.Provider>;
    }

    const useRouter = () => useContext(RouterContext);

    function matchRoute(pattern, path) {
      const p = pattern.split('/').filter(Boolean);
      const s = path.split('?')[0].split('/').filter(Boolean);
      if (p.length !== s.length) return null;
      const params = {};
      for (let i = 0; i < p.length; i++) {
        if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(s[i]);
        else if (p[i] !== s[i]) return null;
      }
      return params;
    }

    function Route() { return null; }

    function Routes({ children, fallback }) {
      const { path } = useRouter();
      for (const child of React.Children.toArray(children)) {
        if (matchRoute(child.props.path, path)) return child.props.element;
      }
      return fallback || null;
    }

    function Link({ to, className = '', activeClassName = '', children, ...rest }) {
      const { path } = useRouter();
      const active = matchRoute(to, path) !== null;
      return (
        <a href={`#${to}`} aria-current={active ? 'page' : undefined}
          className={`${className} ${active ? activeClassName : ''}`} {...rest}>
          {children}
        </a>
      );
    }

    // ========================================
    // 🗂️ Ledger Context (전역 상태: 선택 월, 카테고리, 새로고침, 폼·토스트)
    // ========================================
    const LedgerContext = createContext(null);
    const useLedger = () => useContext(LedgerContext);

    // endpoint 또는 refreshKey가 바뀌면 다시 불러온다. 재조회 중엔 이전 데이터를 유지해 깜빡임을 줄인다
    function useFetch(endpoint) {
      const { refreshKey } = useLedger();
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [retry, setRetry] = useState(0);

      useEffect(() => {
        let cancelled = false;
        setLoading(true);
        setError(null);
        api(endpoint)
          .then((d) => { if (!cancelled) setData(d); })
          .catch((e) => { if (!cancelled) setError(e.message); })
          .finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
      }, [endpoint, refreshKey, retry]);

      return { data, loading, error, reload: () => setRetry((r) => r + 1) };
    }

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================
    const NAV = [
      { to: '/', label: '대시보드', icon: '📊' },
      { to: '/transactions', label: '내역', icon: '🧾' },
      { to: '/stats', label: '통계', icon: '📈' },
    ];

    function Header() {
      const { openForm } = useLedger();
      return (
        <header className="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-200">
          <div className="mx-auto max-w-5xl px-4 h-14 flex items-center justify-between">
            <a href="#/" className="flex items-center gap-2 font-bold text-lg">
              <span aria-hidden="true">💰</span> 나의 가계부
            </a>
            <nav className="hidden sm:flex items-center gap-1" aria-label="주 메뉴">
              {NAV.map((n) => (
                <Link key={n.to} to={n.to}
                  className="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-500 hover:bg-slate-100"
                  activeClassName="!bg-indigo-50 !text-indigo-700">
                  {n.label}
                </Link>
              ))}
              <Button size="sm" className="ml-2" onClick={() => openForm()}>+ 기록하기</Button>
            </nav>
          </div>
        </header>
      );
    }

    function BottomNav() {
      const { openForm } = useLedger();
      return (
        <>
          <button onClick={() => openForm()} aria-label="거래 기록하기"
            className="sm:hidden fixed right-4 bottom-20 z-40 h-14 w-14 rounded-full bg-indigo-600 text-white text-3xl shadow-lg hover:bg-indigo-700">+</button>
          <nav className="sm:hidden fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200 grid grid-cols-3" aria-label="하단 메뉴">
            {NAV.map((n) => (
              <Link key={n.to} to={n.to} className="py-2 flex flex-col items-center text-xs text-slate-400" activeClassName="!text-indigo-600 font-semibold">
                <span className="text-lg" aria-hidden="true">{n.icon}</span>{n.label}
              </Link>
            ))}
          </nav>
        </>
      );
    }

    function MonthPicker() {
      const { month, setMonth } = useLedger();
      return (
        <div className="flex items-center gap-1">
          <Button variant="ghost" size="sm" aria-label="이전 달" onClick={() => setMonth(shiftMonth(month, -1))}>◀</Button>
          <h1 className="text-xl font-bold min-w-[8.5rem] text-center" aria-live="polite">{monthLabel(month)}</h1>
          <Button variant="ghost" size="sm" aria-label="다음 달" onClick={() => setMonth(shiftMonth(month, 1))}>▶</Button>
          {month !== thisMonth() && <Button variant="secondary" size="sm" onClick={() => setMonth(thisMonth())}>이번 달</Button>}
        </div>
      );
    }

    function Toast({ toast }) {
      if (!toast) return null;
      return (
        <div role="status" aria-live="polite"
          className={`animate-fade-in fixed left-1/2 -translate-x-1/2 bottom-24 sm:bottom-6 z-[60] rounded-xl px-4 py-2.5 text-sm font-medium text-white shadow-lg ${toast.type === 'error' ? 'bg-rose-600' : 'bg-slate-800'}`}>
          {toast.message}
        </div>
      );
    }

    function TransactionRow({ tx, onClick, showDate = true }) {
      const positive = (tx.type === 'income') === (tx.amount > 0);
      return (
        <li>
          <button onClick={() => onClick(tx)}
            className="w-full flex items-center gap-3 px-2 py-2.5 rounded-xl hover:bg-slate-50 text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300">
            <span className="h-10 w-10 shrink-0 rounded-full bg-slate-100 flex items-center justify-center text-lg" aria-hidden="true">
              {CATEGORY_ICONS[tx.category] || '📌'}
            </span>
            <span className="flex-1 min-w-0">
              <span className="block font-medium truncate">{tx.content || tx.category}</span>
              <span className="block text-xs text-slate-400 truncate">
                {tx.category}{tx.asset && ` · ${tx.asset}`} · {showDate && `${tx.date.slice(5).replace('-', '.')} `}{tx.time}
              </span>
            </span>
            <span className="text-right shrink-0">
              <span className={`block font-semibold tabular-nums ${positive ? 'text-emerald-600' : 'text-slate-800'}`}>{signedWon(tx)}</span>
              {tx.type === 'expense' && tx.amount < 0 && <span className="block text-[11px] text-emerald-600">취소·환불</span>}
            </span>
          </button>
        </li>
      );
    }

    function TransactionForm({ isOpen, onClose, initial }) {
      const { categories, assets, bump, showToast } = useLedger();
      const editing = !!initial?.id;
      const [form, setForm] = useState({});
      const [errors, setErrors] = useState({});
      const [saving, setSaving] = useState(false);
      const [confirmDelete, setConfirmDelete] = useState(false);

      useEffect(() => {
        if (!isOpen) return;
        setForm({
          type: initial?.type || 'expense',
          amount: initial?.amount ? String(Math.abs(initial.amount)) : '',
          refund: (initial?.amount || 0) < 0,
          category: initial?.category || '',
          asset: initial?.asset ?? (assets?.[0] || ''),
          date: initial?.date || todayStr(),
          time: initial?.time || nowTime(),
          content: initial?.content || '',
          memo: initial?.memo || '',
        });
        setErrors({});
        setConfirmDelete(false);
      }, [isOpen, initial]);

      const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
      const catList = categories?.[form.type] || [];

      const validate = () => {
        const e = {};
        if (!form.amount || Number(form.amount) <= 0) e.amount = '금액을 입력해 주세요';
        if (!form.category) e.category = '분류를 선택해 주세요';
        if (!form.date) e.date = '날짜를 선택해 주세요';
        setErrors(e);
        return Object.keys(e).length === 0;
      };

      const submit = async (ev) => {
        ev.preventDefault();
        if (!validate()) return;
        setSaving(true);
        try {
          const { refund, ...rest } = form;
          const body = { ...rest, amount: Number(form.amount) * (refund ? -1 : 1) };
          // 날짜·시각을 건드리지 않았으면 보내지 않는다 → 가져온 기록의 초·밀리초가 그대로 유지된다
          if (editing && form.date === initial.date && form.time === initial.time) {
            delete body.date;
            delete body.time;
          }
          if (editing) await api(`/transactions/${initial.id}`, { method: 'PUT', body });
          else await api('/transactions', { method: 'POST', body });
          showToast(editing ? '수정했어요' : '기록했어요');
          bump();
          onClose();
        } catch (e) {
          showToast(e.message, 'error');
        } finally {
          setSaving(false);
        }
      };

      const remove = async () => {
        setSaving(true);
        try {
          await api(`/transactions/${initial.id}`, { method: 'DELETE' });
          showToast('삭제했어요');
          bump();
          onClose();
        } catch (e) {
          showToast(e.message, 'error');
        } finally {
          setSaving(false);
        }
      };

      return (
        <Modal isOpen={isOpen} onClose={onClose} title={editing ? '거래 수정' : '거래 기록'}>
          <form onSubmit={submit} className="space-y-4" noValidate>
            <Tabs className="w-full grid grid-cols-2" value={form.type}
              onChange={(v) => setForm((f) => ({ ...f, type: v, category: '' }))}
              tabs={[{ value: 'expense', label: '💸 지출' }, { value: 'income', label: '💰 수입' }]} />

            <div>
              <label htmlFor="tx-amount" className="block text-sm font-medium text-slate-600 mb-1">금액</label>
              <div className="relative">
                <input id="tx-amount" inputMode="numeric" autoFocus placeholder="0"
                  value={form.amount ? Number(form.amount).toLocaleString('ko-KR') : ''}
                  onChange={(e) => set('amount', e.target.value.replace(/[^\d]/g, '').slice(0, 11))}
                  aria-invalid={!!errors.amount}
                  className={`w-full rounded-xl border px-4 py-3 pr-10 text-2xl font-bold text-right tabular-nums focus:outline-none focus:ring-2 ${errors.amount ? 'border-rose-400 focus:ring-rose-300' : 'border-slate-300 focus:ring-indigo-300'} ${form.type === 'income' ? 'text-emerald-600' : 'text-slate-800'}`} />
                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">원</span>
              </div>
              {errors.amount && <p className="mt-1 text-xs text-rose-600">{errors.amount}</p>}
              <label className="mt-2 inline-flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                <input type="checkbox" className="h-4 w-4 accent-indigo-600" checked={!!form.refund}
                  onChange={(e) => set('refund', e.target.checked)} />
                취소·환불 (음수 금액으로 저장)
              </label>
            </div>

            <fieldset>
              <legend className="block text-sm font-medium text-slate-600 mb-1.5">분류</legend>
              <div className="flex flex-wrap gap-1.5">
                {catList.map((c) => (
                  <button type="button" key={c} onClick={() => set('category', c)} aria-pressed={form.category === c}
                    className={`rounded-full border px-3 py-1.5 text-sm transition ${form.category === c ? 'border-indigo-500 bg-indigo-50 text-indigo-700 font-semibold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                    {CATEGORY_ICONS[c] || '📌'} {c}
                  </button>
                ))}
              </div>
              {errors.category && <p className="mt-1 text-xs text-rose-600">{errors.category}</p>}
            </fieldset>

            <Input id="tx-content" label="내용" placeholder="예) 스타벅스, 택시비, 9월 월급" maxLength={200}
              value={form.content || ''} onChange={(e) => set('content', e.target.value)} />

            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
              <Input id="tx-date" type="date" label="날짜" value={form.date || ''} error={errors.date}
                onChange={(e) => set('date', e.target.value)} />
              <Input id="tx-time" type="time" label="시각" value={form.time || ''}
                onChange={(e) => set('time', e.target.value)} />
              <div className="col-span-2 sm:col-span-1">
                <Input id="tx-asset" label="자산" placeholder="카드·은행·현금" maxLength={50} list="asset-options"
                  value={form.asset || ''} onChange={(e) => set('asset', e.target.value)} />
                <datalist id="asset-options">{(assets || []).map((a) => <option key={a} value={a} />)}</datalist>
              </div>
            </div>

            <div>
              <label htmlFor="tx-memo" className="block text-sm font-medium text-slate-600 mb-1">메모</label>
              <textarea id="tx-memo" rows={2} maxLength={2000} placeholder="선택 입력 (카드 승인 문자 등)"
                value={form.memo || ''} onChange={(e) => set('memo', e.target.value)}
                className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
            </div>

            <div className="flex gap-2 pt-1">
              {editing && (confirmDelete
                ? <Button variant="danger" onClick={remove} disabled={saving}>정말 삭제</Button>
                : <Button variant="ghost" className="text-rose-600" onClick={() => setConfirmDelete(true)}>삭제</Button>)}
              <div className="flex-1" />
              <Button variant="secondary" onClick={onClose}>취소</Button>
              <Button type="submit" disabled={saving}>{saving ? '저장 중…' : editing ? '수정' : '저장'}</Button>
            </div>
          </form>
        </Modal>
      );
    }

    function BudgetForm({ isOpen, onClose, current }) {
      const { month, bump, showToast } = useLedger();
      const [amount, setAmount] = useState('');
      const [saving, setSaving] = useState(false);
      useEffect(() => { if (isOpen) setAmount(current ? String(current) : ''); }, [isOpen, current]);

      const submit = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          await api(`/budgets/${month}`, { method: 'PUT', body: { amount: Number(amount || 0) } });
          showToast('예산을 저장했어요');
          bump();
          onClose();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setSaving(false);
        }
      };

      return (
        <Modal isOpen={isOpen} onClose={onClose} title={`${monthLabel(month)} 예산`} size="sm">
          <form onSubmit={submit} className="space-y-4">
            <Input id="budget" label="한 달 지출 예산 (원)" inputMode="numeric" autoFocus placeholder="예) 1,500,000"
              value={amount ? Number(amount).toLocaleString('ko-KR') : ''}
              onChange={(e) => setAmount(e.target.value.replace(/[^\d]/g, '').slice(0, 11))} />
            <div className="flex flex-wrap gap-1.5">
              {[1000000, 1500000, 2000000, 3000000].map((v) => (
                <button type="button" key={v} onClick={() => setAmount(String(v))}
                  className="rounded-full border border-slate-200 px-3 py-1 text-xs text-slate-600 hover:bg-slate-50">{v / 10000}만원</button>
              ))}
            </div>
            <div className="flex justify-end gap-2">
              <Button variant="secondary" onClick={onClose}>취소</Button>
              <Button type="submit" disabled={saving}>{saving ? '저장 중…' : '저장'}</Button>
            </div>
          </form>
        </Modal>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================
    function StatCard({ label, value, tone = 'slate', sub }) {
      const tones = { slate: 'text-slate-900', emerald: 'text-emerald-600', rose: 'text-rose-600', indigo: 'text-indigo-600' };
      return (
        <Card className="!p-4">
          <p className="text-xs font-medium text-slate-500">{label}</p>
          <p className={`mt-1 text-lg sm:text-xl font-bold tabular-nums truncate ${tones[tone]}`}>{value}</p>
          {sub && <p className="mt-0.5 text-xs text-slate-400">{sub}</p>}
        </Card>
      );
    }

    function CategoryDoughnut({ byCategory, total }) {
      const data = useMemo(() => ({
        labels: byCategory.map((c) => c.category),
        datasets: [{ data: byCategory.map((c) => c.amount), backgroundColor: PALETTE, borderWidth: 2, borderColor: '#fff' }],
      }), [byCategory]);
      const options = useMemo(() => ({
        cutout: '68%',
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (ctx) => ` ${ctx.label}: ${won(ctx.raw)} (${Math.round((ctx.raw / total) * 100)}%)` } },
        },
      }), [total]);
      return (
        <div className="grid sm:grid-cols-2 gap-4 items-center">
          <div className="relative">
            <ChartCanvas type="doughnut" data={data} options={options} className="h-52" ariaLabel="분류별 지출 비율" />
            <div className="pointer-events-none absolute inset-0 flex flex-col items-center justify-center">
              <span className="text-xs text-slate-400">총 지출</span>
              <span className="font-bold tabular-nums">{won(total)}</span>
            </div>
          </div>
          <ul className="space-y-1.5">
            {byCategory.slice(0, 6).map((c, i) => (
              <li key={c.category} className="flex items-center gap-2 text-sm">
                <span className="h-2.5 w-2.5 rounded-full shrink-0" style={{ background: PALETTE[i % PALETTE.length] }} />
                <span className="flex-1 truncate">{CATEGORY_ICONS[c.category]} {c.category}</span>
                <span className="text-slate-400 text-xs w-9 text-right">{Math.round((c.amount / total) * 100)}%</span>
                <span className="font-medium tabular-nums w-24 text-right">{won(c.amount)}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function DashboardPage() {
      const { month, openForm } = useLedger();
      const summary = useFetch(`/summary?month=${month}`);
      const recent = useFetch(`/transactions?month=${month}`);
      const [budgetOpen, setBudgetOpen] = useState(false);
      const s = summary.data;

      const isCurrent = month === thisMonth();
      const [y, m] = month.split('-').map(Number);
      const daysInMonth = new Date(y, m, 0).getDate();
      const daysLeft = isCurrent ? daysInMonth - new Date().getDate() + 1 : 0;
      const remaining = s ? s.budget - s.expense : 0;
      const expenseCount = s?.expenseCount || 0;

      return (
        <div className="space-y-4">
          <MonthPicker />
          {summary.error && <ErrorBox message={summary.error} onRetry={summary.reload} />}
          {!s && summary.loading && <div className="flex justify-center py-16"><Spinner /></div>}

          {s && (
            <>
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                <StatCard label="수입" value={won(s.income)} tone="emerald" />
                <StatCard label="지출" value={won(s.expense)} tone="rose" />
                <StatCard label="잔액" value={`${s.balance < 0 ? '-' : ''}${won(Math.abs(s.balance))}`} tone={s.balance < 0 ? 'rose' : 'indigo'} />
                <StatCard label="거래 수" value={`${s.count}건`} sub={expenseCount ? `지출 건당 평균 ${won(s.expense / expenseCount)}` : null} />
              </div>

              <Card>
                <div className="flex items-center justify-between mb-3">
                  <h2 className="font-bold">🎯 이번 달 예산</h2>
                  <Button size="sm" variant="ghost" onClick={() => setBudgetOpen(true)}>{s.budget ? '수정' : '설정'}</Button>
                </div>
                {s.budget > 0 ? (
                  <>
                    <div className="flex items-end justify-between mb-2">
                      <p className="text-sm text-slate-500">
                        <span className="text-slate-900 font-bold text-base tabular-nums">{won(s.expense)}</span> / {won(s.budget)}
                      </p>
                      <Badge color={remaining < 0 ? 'rose' : 'indigo'}>{Math.round((s.expense / s.budget) * 100)}% 사용</Badge>
                    </div>
                    <ProgressBar value={s.expense} max={s.budget} />
                    <p className="mt-2 text-sm text-slate-500">
                      {remaining >= 0
                        ? <>남은 예산 <b className="text-slate-800">{won(remaining)}</b>{isCurrent && daysLeft > 0 && <> · 하루 <b className="text-indigo-600">{won(remaining / daysLeft)}</b>씩 쓸 수 있어요</>}</>
                        : <span className="text-rose-600 font-medium">예산을 {won(-remaining)} 초과했어요 😢</span>}
                    </p>
                  </>
                ) : (
                  <p className="text-sm text-slate-500">아직 예산이 없어요. 예산을 정하면 남은 금액과 하루 사용 가능액을 알려드려요.</p>
                )}
              </Card>

              <div className="grid lg:grid-cols-5 gap-4">
                <Card className="lg:col-span-3">
                  <h2 className="font-bold mb-3">🍩 분류별 지출</h2>
                  {s.byCategory.length
                    ? <CategoryDoughnut byCategory={s.byCategory} total={s.expense} />
                    : <EmptyState icon="🌱" title="이번 달 지출이 없어요" />}
                </Card>

                <Card className="lg:col-span-2">
                  <div className="flex items-center justify-between mb-2">
                    <h2 className="font-bold">🧾 최근 내역</h2>
                    <a href="#/transactions" className="text-sm text-indigo-600 hover:underline">전체 보기</a>
                  </div>
                  {recent.data?.length ? (
                    <ul className="-mx-2">
                      {recent.data.slice(0, 5).map((tx) => <TransactionRow key={tx.id} tx={tx} onClick={openForm} />)}
                    </ul>
                  ) : !recent.loading && (
                    <EmptyState title="기록이 없어요" action={<Button size="sm" onClick={() => openForm()}>첫 기록 남기기</Button>} />
                  )}
                </Card>
              </div>
            </>
          )}
          <BudgetForm isOpen={budgetOpen} onClose={() => setBudgetOpen(false)} current={s?.budget} />
        </div>
      );
    }

    function TransactionsPage() {
      const { month, categories, assets, openForm } = useLedger();
      const [type, setType] = useState('');
      const [category, setCategory] = useState('');
      const [asset, setAsset] = useState('');
      const [q, setQ] = useState('');
      const [debouncedQ, setDebouncedQ] = useState('');

      useEffect(() => {
        const t = setTimeout(() => setDebouncedQ(q.trim()), 250);
        return () => clearTimeout(t);
      }, [q]);

      const params = new URLSearchParams({ month });
      if (type) params.set('type', type);
      if (category) params.set('category', category);
      if (asset) params.set('asset', asset);
      if (debouncedQ) params.set('q', debouncedQ);
      const { data, loading, error, reload } = useFetch(`/transactions?${params}`);

      const groups = useMemo(() => {
        const map = new Map();
        (data || []).forEach((tx) => {
          if (!map.has(tx.date)) map.set(tx.date, []);
          map.get(tx.date).push(tx);
        });
        return [...map.entries()];
      }, [data]);

      const totals = useMemo(() => ({
        income: (data || []).filter((t) => t.type === 'income').reduce((s, t) => s + t.amount, 0),
        expense: (data || []).filter((t) => t.type === 'expense').reduce((s, t) => s + t.amount, 0),
      }), [data]);

      const catOptions = [{ value: '', label: '전체 분류' }, ...[...new Set([
        ...(type !== 'income' ? categories?.expense || [] : []),
        ...(type !== 'expense' ? categories?.income || [] : []),
      ])].map((c) => ({ value: c, label: `${CATEGORY_ICONS[c] || ''} ${c}` }))];

      // 편한가계부 내보내기와 같은 열 순서
      const exportCsv = () => {
        const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
        const rows = [['날짜', '자산', '분류', '소분류', '내용', 'KRW', '수입/지출', '메모', '화폐'],
          ...(data || []).map((t) => [`${t.date} ${t.time}`, q(t.asset), q(t.category), q(t.subcategory), q(t.content),
            t.amount, t.type === 'income' ? '수입' : '지출', q(t.memo), t.currency])];
        const blob = new Blob(['﻿' + rows.map((r) => r.join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `가계부_${month}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
      };

      return (
        <div className="space-y-4">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <MonthPicker />
            <Button variant="secondary" size="sm" onClick={exportCsv} disabled={!data?.length}>⬇ CSV 내보내기</Button>
          </div>

          <Card className="!p-4 space-y-3">
            <div className="flex flex-wrap items-center gap-2">
              <Tabs value={type} onChange={(v) => { setType(v); setCategory(''); }}
                tabs={[{ value: '', label: '전체' }, { value: 'expense', label: '지출' }, { value: 'income', label: '수입' }]} />
              <Select id="f-cat" aria-label="분류 필터" className="w-36" value={category} options={catOptions}
                onChange={(e) => setCategory(e.target.value)} />
              <Select id="f-asset" aria-label="자산 필터" className="w-40" value={asset}
                options={[{ value: '', label: '전체 자산' }, ...(assets || []).map((a) => ({ value: a, label: a }))]}
                onChange={(e) => setAsset(e.target.value)} />
              <Input id="f-q" aria-label="검색" className="flex-1 min-w-[10rem]" placeholder="🔍 내용·메모·분류·자산 검색"
                value={q} onChange={(e) => setQ(e.target.value)} />
            </div>
            <div className="flex gap-4 text-sm">
              <span className="text-slate-500">수입 <b className="text-emerald-600 tabular-nums">{won(totals.income)}</b></span>
              <span className="text-slate-500">지출 <b className="text-rose-600 tabular-nums">{won(totals.expense)}</b></span>
              <span className="text-slate-400 ml-auto">{data?.length || 0}건</span>
            </div>
          </Card>

          {error && <ErrorBox message={error} onRetry={reload} />}
          {!data && loading && <div className="flex justify-center py-16"><Spinner /></div>}
          {data && !groups.length && (
            <Card><EmptyState icon="🔎" title="조건에 맞는 내역이 없어요"
              description={type || category || asset || q ? '필터를 바꿔 보세요' : '오른쪽 위 + 버튼으로 기록을 시작해 보세요'} /></Card>
          )}

          {groups.map(([date, items]) => {
            const dayExpense = items.filter((t) => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            const dayIncome = items.filter((t) => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            return (
              <Card key={date} className="!p-3">
                <div className="flex items-center justify-between px-2 pb-1 border-b border-slate-100 mb-1">
                  <h3 className="text-sm font-semibold text-slate-600">{dayLabel(date)}</h3>
                  <span className="text-xs tabular-nums space-x-2">
                    {dayIncome > 0 && <span className="text-emerald-600">+{won(dayIncome)}</span>}
                    {dayExpense > 0 && <span className="text-rose-500">-{won(dayExpense)}</span>}
                  </span>
                </div>
                <ul>{items.map((tx) => <TransactionRow key={tx.id} tx={tx} onClick={openForm} showDate={false} />)}</ul>
              </Card>
            );
          })}
        </div>
      );
    }

    function StatsPage() {
      const { month } = useLedger();
      const trend = useFetch(`/trend?months=6&end=${month}`);
      const summary = useFetch(`/summary?month=${month}`);
      const s = summary.data;

      const trendData = useMemo(() => trend.data && ({
        labels: trend.data.map((t) => `${Number(t.month.slice(5))}월`),
        datasets: [
          { label: '수입', data: trend.data.map((t) => t.income), backgroundColor: '#10b981', borderRadius: 6 },
          { label: '지출', data: trend.data.map((t) => t.expense), backgroundColor: '#f43f5e', borderRadius: 6 },
        ],
      }), [trend.data]);

      const dailyData = useMemo(() => s && ({
        labels: s.daily.map((d) => Number(d.date.slice(8))),
        datasets: [{ label: '지출', data: s.daily.map((d) => d.expense), backgroundColor: '#6366f1', borderRadius: 4 }],
      }), [s]);

      const moneyAxis = useMemo(() => ({
        plugins: { tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${won(c.raw)}` } } },
        scales: {
          y: { beginAtZero: true, ticks: { callback: (v) => (v >= 10000 ? `${v / 10000}만` : v) } },
          x: { grid: { display: false } },
        },
      }), []);
      const dailyOptions = useMemo(() => ({ ...moneyAxis, plugins: { ...moneyAxis.plugins, legend: { display: false } } }), [moneyAxis]);

      const spentDays = s ? s.daily.filter((d) => d.expense > 0) : [];
      const topDay = spentDays.reduce((a, b) => (b.expense > (a?.expense || 0) ? b : a), null);
      const prev = trend.data?.[trend.data.length - 2];
      const diff = s && prev ? s.expense - prev.expense : null;

      return (
        <div className="space-y-4">
          <MonthPicker />
          {(trend.error || summary.error) && <ErrorBox message={trend.error || summary.error} onRetry={() => { trend.reload(); summary.reload(); }} />}

          {s && (
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <StatCard label="지난달 대비 지출" tone={diff > 0 ? 'rose' : 'emerald'}
                value={diff === null ? '-' : `${diff > 0 ? '▲' : diff < 0 ? '▼' : ''} ${won(Math.abs(diff))}`} />
              <StatCard label="일 평균 지출" value={won(s.expense / (month === thisMonth() ? new Date().getDate() : s.daily.length))} />
              <StatCard label="가장 많이 쓴 날" value={topDay ? dayLabel(topDay.date).split(' (')[0] : '-'} sub={topDay ? won(topDay.expense) : null} />
              <StatCard label="저축률" tone="indigo" value={s.income ? `${Math.round((s.balance / s.income) * 100)}%` : '-'} sub="(수입-지출)/수입" />
            </div>
          )}

          <Card>
            <h2 className="font-bold mb-3">📊 최근 6개월 수입·지출</h2>
            {trendData ? <ChartCanvas type="bar" data={trendData} options={moneyAxis} className="h-64" ariaLabel="최근 6개월 수입 지출 막대 그래프" />
              : <div className="h-64 flex items-center justify-center"><Spinner /></div>}
          </Card>

          <div className="grid lg:grid-cols-2 gap-4">
            <Card>
              <h2 className="font-bold mb-3">📅 일별 지출</h2>
              {dailyData ? <ChartCanvas type="bar" data={dailyData} options={dailyOptions} className="h-56" ariaLabel="일별 지출 막대 그래프" />
                : <div className="h-56 flex items-center justify-center"><Spinner /></div>}
            </Card>
            <Card>
              <h2 className="font-bold mb-3">🏆 분류 순위</h2>
              {s && s.byCategory.length ? (
                <ol className="space-y-3">
                  {s.byCategory.map((c, i) => (
                    <li key={c.category}>
                      <div className="flex justify-between text-sm mb-1">
                        <span><span className="text-slate-400 w-5 inline-block">{i + 1}</span>{CATEGORY_ICONS[c.category]} {c.category}</span>
                        <span className="tabular-nums font-medium">{won(c.amount)} <span className="text-slate-400 text-xs">{Math.round((c.amount / s.expense) * 100)}%</span></span>
                      </div>
                      <div className="h-2 rounded-full bg-slate-100 overflow-hidden">
                        <div className="h-full rounded-full" style={{ width: `${(c.amount / s.byCategory[0].amount) * 100}%`, background: PALETTE[i % PALETTE.length] }} />
                      </div>
                    </li>
                  ))}
                </ol>
              ) : s && <EmptyState icon="🌱" title="이 달의 지출이 없어요" />}
            </Card>
          </div>
        </div>
      );
    }

    function NotFoundPage() {
      return <Card><EmptyState icon="🧭" title="페이지를 찾을 수 없어요" action={<a href="#/" className="text-indigo-600 hover:underline">대시보드로 가기</a>} /></Card>;
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function LedgerProvider({ children }) {
      const [month, setMonth] = useState(thisMonth());
      const [meta, setMeta] = useState(null);
      const [refreshKey, setRefreshKey] = useState(0);
      const [formState, setFormState] = useState({ open: false, tx: null });
      const [toast, setToast] = useState(null);
      const toastTimer = useRef(null);

      // 분류·자산 선택지는 실제 기록에서 뽑으므로, 기록이 바뀌면 다시 불러온다
      useEffect(() => {
        api('/meta').then(setMeta).catch(() => setMeta({ categories: { expense: ['기타'], income: ['기타소득'] }, assets: [] }));
      }, [refreshKey]);

      const showToast = useCallback((message, type = 'info') => {
        clearTimeout(toastTimer.current);
        setToast({ message, type });
        toastTimer.current = setTimeout(() => setToast(null), 2200);
      }, []);

      const value = useMemo(() => ({
        month, setMonth, refreshKey, showToast,
        categories: meta?.categories, assets: meta?.assets, dataRange: meta && { first: meta.first, last: meta.last, total: meta.total },
        bump: () => setRefreshKey((k) => k + 1),
        openForm: (tx = null) => setFormState({ open: true, tx }),
      }), [month, meta, refreshKey, showToast]);

      const closeForm = useCallback(() => setFormState({ open: false, tx: null }), []);

      return (
        <LedgerContext.Provider value={value}>
          {children}
          <TransactionForm isOpen={formState.open} initial={formState.tx} onClose={closeForm} />
          <Toast toast={toast} />
        </LedgerContext.Provider>
      );
    }

    function App() {
      return (
        <Router>
          <LedgerProvider>
            <Header />
            <main className="mx-auto max-w-5xl px-4 py-5 pb-28 sm:pb-10">
              <Routes fallback={<NotFoundPage />}>
                <Route path="/" element={<DashboardPage />} />
                <Route path="/transactions" element={<TransactionsPage />} />
                <Route path="/stats" element={<StatsPage />} />
              </Routes>
            </main>
            <BottomNav />
          </LedgerProvider>
        </Router>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
