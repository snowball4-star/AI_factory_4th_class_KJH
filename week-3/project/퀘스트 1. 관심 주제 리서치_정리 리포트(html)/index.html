      return (

      );

    function Bar({ ratio, tone = 'amber' }) {
      const tones = { amber: 'bg-amber-500', sky: 'bg-sky-500', violet: 'bg-violet-500', emerald: 'bg-emerald-500' };
      return (
        <div className="h-1.5 w-full overflow-hidden rounded-full bg-zinc-800" role="presentation">

        </div>
      );
    }

    // ========================================
    // 🔀 Router Components (hash-based)
    // ========================================

    const RouterContext = createContext({ path: '/', navigate: () => {} });

    function Router({ children }) {
      const [path, setPath] = useState(() => window.location.hash.slice(1) || '/');

      useEffect(() => {
        const onHashChange = () => {
          setPath(window.location.hash.slice(1) || '/');
          window.scrollTo({ top: 0 });
        };
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      const navigate = useCallback((to) => { window.location.hash = to; }, []);

      return <RouterContext.Provider value={{ path, navigate }}>{children}</RouterContext.Provider>;
    }

    function useRouter() { return useContext(RouterContext); }

    function Routes({ children }) {
      const { path } = useRouter();
      const routes = React.Children.toArray(children);
      const matched = routes.find((r) => r.props.path === path) || routes.find((r) => r.props.path === '*');
      return matched ? matched.props.element : null;
    }

    function Route() { return null; }

    function Link({ to, className = '', children, ...props }) {
      const { navigate } = useRouter();
      return (
        <a
          href={`#${to}`}
          onClick={(e) => { e.preventDefault(); navigate(to); }}
          className={className}
          {...props}
        >
          {children}
        </a>
      );
    }

          <div className="mb-10 grid gap-4 md:grid-cols-3">
            {OFFICIAL_BLOGS.map((b) => (
              <Card key={b.id} className="p-5">
                <Badge tone="amber">공식</Badge>
                <h4 className="mt-3 text-base font-bold text-zinc-50">{b.name}</h4>
                <p className="mt-1.5 text-sm leading-relaxed text-zinc-400">{b.desc}</p>
                <a
                  href={`https://blog.naver.com/${b.id}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="mt-3 inline-block text-xs text-sky-400 hover:text-sky-300 hover:underline"
                >
                  blog.naver.com/{b.id} ↗
                </a>
              </Card>
            ))}
          </div>

          <Card className="mb-10 border-zinc-700 bg-zinc-900 p-5">
            <p className="text-sm leading-relaxed text-zinc-300">
              <strong className="text-zinc-100">후지필름은 카메라 부문 공식 블로그가 없습니다.</strong> 대신 멤버 13.5만 명의 카페{' '}
              <a href="https://cafe.naver.com/fujipeople" target="_blank" rel="noopener noreferrer" className="text-sky-400 hover:underline">후지피플</a>
              이 사실상 공식 창구 역할을 합니다. 검색에 걸리는 <code className="rounded bg-zinc-800 px-1 py-0.5 text-xs">fujifilm_bi_kr</code>은
              프린터·복합기를 다루는 비즈니스이노베이션 부문이라 카메라와 무관합니다.
            </p>
          </Card>

          <h3 className="mb-4 text-sm font-semibold text-zinc-300">카메라·렌즈 리뷰 전문 블로그 10곳</h3>
          <div className="grid gap-3 md:grid-cols-2">
            {REVIEW_BLOGS.map((b) => (
              <Card key={b.id} className="p-5 transition-colors hover:border-zinc-700">
                <div className="flex items-start justify-between gap-3">
                  <h4 className="text-sm font-bold leading-snug text-zinc-50">{b.name}</h4>
                  <Badge tone="sky">{b.tag}</Badge>
                </div>
                <p className="mt-1.5 text-sm leading-relaxed text-zinc-400">{b.desc}</p>
                <a
                  href={`https://blog.naver.com/${b.id}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="mt-2.5 inline-block text-xs text-sky-400 hover:text-sky-300 hover:underline"
                >
                  blog.naver.com/{b.id} ↗
                </a>
              </Card>
            ))}
          </div>

          <Card className="mt-8 border-rose-500/25 bg-rose-500/[0.06] p-6">
            <h3 className="text-sm font-bold text-rose-300">⚠️ 읽을 때 주의</h3>
            <p className="mt-2 text-sm leading-relaxed text-zinc-300">
              카메라 검색 상위에는 협찬·제휴 링크 글이 섞여 있습니다. 본문 하단의 <code className="rounded bg-zinc-800 px-1 py-0.5 text-xs">#협찬</code>,
              <code className="ml-1 rounded bg-zinc-800 px-1 py-0.5 text-xs">#체험단</code>, 쿠팡 파트너스 고지를 먼저 확인하고,
              <strong className="text-zinc-100"> 작례 원본을 올리는 블로그</strong>를 우선으로 보세요.
            </p>
          </Card>
        </Page>
      );
    }

    function RankingPage() {
      const [tab, setTab] = useState('mirrorless');
      const [sort, setSort] = useState('reviews');

      const raw = tab === 'mirrorless' ? MIRRORLESS : COMPACT;
      const maxReviews = Math.max(...raw.map((r) => r.reviews));

      const rows = useMemo(() => {
        const copy = [...raw];
        if (sort === 'price') copy.sort((a, b) => a.price - b.price);
        else if (sort === 'rating') copy.sort((a, b) => b.rating - a.rating);
        else copy.sort((a, b) => b.reviews - a.reviews);
        return copy;
      }, [raw, sort]);

      return (
        <Page>
          <SectionTitle
            eyebrow="Part 3 · Ranking"
            title="지금 인기 있는 디지털카메라"
            desc="네이버 쇼핑 가격비교를 리뷰 많은 순으로 정렬해 수집했습니다. 렌탈·판매처 패키지는 제외하고 브랜드 카탈로그(정품 바디/킷)만 집계했습니다."
          />

          <div className="mb-6 flex flex-wrap items-center gap-3">
            <div className="flex gap-1.5" role="tablist" aria-label="카메라 종류">
              <Button role="tab" aria-selected={tab === 'mirrorless'} variant={tab === 'mirrorless' ? 'primary' : 'secondary'} onClick={() => setTab('mirrorless')}>
                렌즈교환식 미러리스 19
              </Button>
              <Button role="tab" aria-selected={tab === 'compact'} variant={tab === 'compact' ? 'primary' : 'secondary'} onClick={() => setTab('compact')}>
                컴팩트 · 하이엔드 10
              </Button>
            </div>
            <div className="flex items-center gap-1.5 sm:ml-auto">
              <span className="text-xs text-zinc-500">정렬</span>
              {[['reviews', '리뷰 많은 순'], ['price', '가격 낮은 순'], ['rating', '별점 높은 순']].map(([k, label]) => (
                <Button key={k} size="sm" variant={sort === k ? 'primary' : 'ghost'} onClick={() => setSort(k)}>
                  {label}
                </Button>
              ))}
            </div>
          </div>

          <ul className="space-y-2.5">
            {rows.map((r) => (
              <li key={r.name + r.variant}>
                <Card className="p-4 transition-colors hover:border-zinc-700 sm:p-5">
                  <div className="flex items-start gap-4">
                    <div className="w-9 shrink-0 pt-0.5 text-center">
                      <span className={`text-lg font-bold tabular-nums ${r.rank <= 3 ? 'text-amber-400' : 'text-zinc-600'}`}>
                        {r.rank <= 3 ? ['🥇', '🥈', '🥉'][r.rank - 1] : r.rank}
                      </span>
                    </div>

                    <div className="min-w-0 flex-1">
                      <div className="flex flex-wrap items-center gap-2">
                        <h3 className="text-base font-bold text-zinc-50">{r.name}</h3>
                        {r.variant && <span className="text-xs text-zinc-500">{r.variant}</span>}
                        <Badge tone={BRAND_TONE[r.brand] || 'zinc'}>{r.brand}</Badge>
                      </div>
                      <p className="mt-1.5 text-sm leading-relaxed text-zinc-400">{r.note}</p>
                      <div className="mt-3 max-w-md">
                        <Bar ratio={r.reviews / maxReviews} tone={BRAND_TONE[r.brand] === 'zinc' ? 'amber' : BRAND_TONE[r.brand]} />
                      </div>
                    </div>

                    <div className="shrink-0 text-right">
                      <p className="text-sm font-bold tabular-nums text-zinc-100">{won(r.price)}</p>
                      <p className="mt-0.5 text-xs tabular-nums text-zinc-400">리뷰 {r.reviews.toLocaleString('ko-KR')}</p>
                      <p className="mt-0.5 text-xs tabular-nums text-amber-500/80">★ {r.rating}</p>
                    </div>
                  </div>
                </Card>
              </li>
            ))}
          </ul>

          <Card className="mt-8 p-6">
            <h3 className="text-sm font-bold text-zinc-100">이 순위를 읽을 때</h3>
            <ul className="mt-3 space-y-2 text-sm leading-relaxed text-zinc-400">
              <li>· 리뷰 수는 <strong className="text-zinc-200">누적값</strong>이라 오래된 기종이 유리합니다. 신제품(A7 V, Z5 II)은 과소평가될 수 있습니다.</li>
              <li>· 같은 기종도 바디/킷/판매처 패키지로 나뉘어 리뷰가 분산됩니다.</li>
              <li>· 5만~14만 원대 노네임 "빈티지 디카"도 리뷰 90~300건대로 상위에 올라옵니다. 화질보다 필름 느낌·가벼움·가격을 사는 수요입니다.</li>
              <li>· 가격은 2026-09-06 기준 최저가입니다.</li>
            </ul>
          </Card>
        </Page>
      );
    }

    function TrendsPage() {
      return (
        <Page>
          <SectionTitle
            eyebrow="Part 4 · Insight"
            title="데이터에서 읽히는 5가지 흐름"
            desc="카페 멤버 수와 쇼핑 리뷰 수를 겹쳐 보면 커뮤니티의 규모와 실제 구매가 어긋나는 지점이 보입니다."
          />

          <div className="mb-16 space-y-4">
            {TRENDS.map((t) => (
              <Card key={t.no} className="p-6">
                <div className="flex flex-col gap-4 sm:flex-row">
                  <span className="shrink-0 text-3xl font-bold tabular-nums text-zinc-800">{t.no}</span>
                  <div className="min-w-0">
                    <h3 className="text-lg font-bold text-zinc-50">{t.title}</h3>
                    <p className="mt-2 text-sm leading-relaxed text-zinc-400">{t.body}</p>
                    <div className="mt-3">
                      <Badge tone={t.tone}>{t.punch}</Badge>
                    </div>
                  </div>
                </div>
              </Card>
            ))}
          </div>

          <SectionTitle eyebrow="Part 5 · Pick" title="이렇게 고르면 된다" desc="상황별로 한 대씩. 먼저 볼 커뮤니티까지 같이 적었습니다." />
          <Card className="overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full min-w-[640px] text-left text-sm">
                <thead className="border-b border-zinc-800 bg-zinc-900">
                  <tr className="text-xs uppercase tracking-wide text-zinc-500">
                    <th scope="col" className="px-5 py-3 font-medium">상황</th>
                    <th scope="col" className="px-5 py-3 font-medium">추천 기종</th>
                    <th scope="col" className="px-5 py-3 text-right font-medium">대략 예산</th>
                    <th scope="col" className="px-5 py-3 font-medium">먼저 볼 커뮤니티</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-zinc-800">
                  {PICKS.map((p) => (
                    <tr key={p.situation} className="transition-colors hover:bg-zinc-800/40">
                      <td className="px-5 py-3.5 font-medium text-zinc-200">{p.situation}</td>
                      <td className="px-5 py-3.5 text-zinc-300">{p.model}</td>
                      <td className="whitespace-nowrap px-5 py-3.5 text-right tabular-nums text-amber-400">{p.budget}</td>
                      <td className="px-5 py-3.5 text-zinc-400">{p.where}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>

          <div className="mt-10 flex flex-wrap gap-2.5">
            <Link to="/ranking"><Button>순위 다시 보기</Button></Link>
            <Link to="/cafes"><Button variant="secondary">카페 목록 보기</Button></Link>
          </div>
        </Page>
      );
    }

    function NotFoundPage() {
      return (
        <Page>
          <Card className="p-14 text-center">
            <p className="text-5xl">🔍</p>
            <h1 className="mt-4 text-xl font-bold text-zinc-50">없는 페이지입니다</h1>
            <p className="mt-2 text-sm text-zinc-400">주소를 확인해 주세요.</p>
            <Link to="/"><Button className="mt-6">개요로 돌아가기</Button></Link>
          </Card>
        </Page>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================

    function App() {
      return (
        <Router>
          <div className="flex min-h-screen flex-col">
            <Header />
            <div className="flex-1">
              <Routes>
                <Route path="/" element={<HomePage />} />
                <Route path="/cafes" element={<CafesPage />} />
                <Route path="/blogs" element={<BlogsPage />} />
                <Route path="/ranking" element={<RankingPage />} />
                <Route path="/trends" element={<TrendsPage />} />
                <Route path="*" element={<NotFoundPage />} />
              </Routes>
            </div>
            <Footer />
          </div>
        </Router>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
