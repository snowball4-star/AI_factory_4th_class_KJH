// 한글 받침 유무에 따라 조사를 고른다. ('우와' + 가 / '담택 본점' + 이)
function josa(word, withBatchim, withoutBatchim) {
  const last = (word || '').trim().slice(-1);
  const code = last.charCodeAt(0);
  if (!last || code < 0xac00 || code > 0xd7a3) return withoutBatchim;
  return (code - 0xac00) % 28 > 0 ? withBatchim : withoutBatchim;
}

const RANK_STYLE = [
  { badge: '🥇', ring: 'ring-amber-300',  bar: 'bg-amber-400'  },
  { badge: '🥈', ring: 'ring-slate-300',  bar: 'bg-slate-400'  },
  { badge: '🥉', ring: 'ring-orange-300', bar: 'bg-orange-400' },
  { badge: '4',  ring: 'ring-sky-200',    bar: 'bg-sky-400'    },
  { badge: '5',  ring: 'ring-sky-200',    bar: 'bg-sky-400'    }
];
const rankStyle = i => RANK_STYLE[i] || { badge: String(i + 1), ring: 'ring-slate-200', bar: 'bg-slate-300' };

// 입력한 지역명을 데이터셋의 동(洞)에 매칭한다. 정확 일치 → 앞부분 일치 → 부분 일치 순.
function matchRegions(query) {
  const q = query.trim().replace(/\s+/g, '');
  if (!q) return [];
  const norm = s => s.replace(/\s+/g, '');
  const scored = REGIONS.map(r => {
    const keys = [r.dong, r.gu].concat(r.aliases).map(norm);
    let score = 0;
    if (keys.some(k => k === q)) score = 100;
    else if (keys.some(k => k.startsWith(q))) score = 70;
    else if (keys.some(k => k.includes(q))) score = 40;
    else if (keys.some(k => k.length >= 2 && q.includes(k))) score = 30;
    return { region: r, score };
  });
  return scored
    .filter(s => s.score > 0)
    .sort((a, b) => b.score - a.score || b.region.surveyed - a.region.surveyed)
    .map(s => s.region);
}

const kakaoSearchUrl = (dong, name) =>
  'https://map.kakao.com/?q=' + encodeURIComponent(name ? dong + ' ' + name : dong + ' 맛집');

function SearchBar({ value, onChange, onSubmit, closeSignal }) {
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState(-1);
  const boxRef = useRef(null);

  const suggestions = useMemo(() => matchRegions(value).slice(0, 6), [value]);

  useEffect(() => {
    const onDocMouseDown = e => {
      if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', onDocMouseDown);
    return () => document.removeEventListener('mousedown', onDocMouseDown);
  }, []);

  useEffect(() => { setActive(-1); }, [value]);

  // 동네 칩이나 최근 검색으로 조회하면 열려 있던 추천 목록을 닫는다.
  useEffect(() => { setOpen(false); }, [closeSignal]);

  const choose = region => {
    onChange(region.dong);
    setOpen(false);
    onSubmit(region.dong);
  };

  const handleKeyDown = e => {
    if (!open || suggestions.length === 0) {
      if (e.key === 'Enter') { e.preventDefault(); setOpen(false); onSubmit(value); }
      return;
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setActive(i => (i + 1) % suggestions.length);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setActive(i => (i - 1 + suggestions.length) % suggestions.length);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (active >= 0) choose(suggestions[active]);
      else { setOpen(false); onSubmit(value); }
    } else if (e.key === 'Escape') {
      setOpen(false);
    }
  };

  return (
    <div ref={boxRef} className="relative">
      <form
        role="search"
        onSubmit={e => { e.preventDefault(); setOpen(false); onSubmit(value); }}
        className="flex flex-col gap-2 sm:flex-row"
      >
        <div className="flex-1" role="combobox" aria-haspopup="listbox"
             aria-owns="region-suggest" aria-expanded={open && suggestions.length > 0}>
          <Input
            id="region-input"
            type="text"
            value={value}
            onChange={e => { onChange(e.target.value); setOpen(true); }}
            onFocus={() => setOpen(true)}
            onKeyDown={handleKeyDown}
            placeholder="관심 지역을 입력하세요 (예: 대치동, 홍대, 성수)"
            autoComplete="off"
            aria-label="관심 지역"
            aria-autocomplete="list"
            aria-controls="region-suggest"
            aria-activedescendant={active >= 0 ? 'region-opt-' + active : undefined}
          />
        </div>
        <Button type="submit" size="lg" className="sm:w-32">🔍 검색</Button>
      </form>

      {open && suggestions.length > 0 && (
        <ul
          id="region-suggest"
          role="listbox"
          aria-label="지역 추천"
          className="suggest-scroll absolute z-20 mt-2 max-h-72 w-full overflow-y-auto rounded-xl border border-slate-200 bg-white py-1 shadow-lg"
        >
          {suggestions.map((r, i) => (
            <li
              key={r.dong}
              id={'region-opt-' + i}
              role="option"
              aria-selected={i === active}
              onMouseEnter={() => setActive(i)}
              onMouseDown={e => { e.preventDefault(); choose(r); }}
              className={`flex cursor-pointer items-center justify-between px-4 py-2.5 text-sm
                          ${i === active ? 'bg-slate-100' : 'hover:bg-slate-50'}`}
            >
              <span className="font-medium text-slate-800">{r.dong}</span>
              <span className="text-xs text-slate-400">{r.gu} · {r.surveyed}곳 조사</span>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

function ResultPanel({ region, metric, onMetric }) {
  const [expanded, setExpanded] = useState(false);

  // 지역이나 정렬 기준이 바뀌면 다시 TOP 5 만 보여 준다.
  useEffect(() => { setExpanded(false); }, [region.dong, metric]);

  const sorted = useMemo(() => {
    const list = region.places.slice();
    if (metric === 'rating') {
      // 별점이 같으면 평가에 참여한 사람이 많은 쪽을 위로 둔다.
      return list.sort((a, b) => b.rating - a.rating || b.ratingCnt - a.ratingCnt);
    }
    return list.sort((a, b) => b.review - a.review);
  }, [region, metric]);

  const max = region.places.reduce((m, p) => Math.max(m, p.review), 0);
  const shown = expanded ? sorted : sorted.slice(0, 5);
  const best = sorted[0];

  return (
    <section aria-labelledby="result-heading" className="space-y-4">
      <div className="flex flex-wrap items-end justify-between gap-3">
        <div>
          <h2 id="result-heading" className="text-xl font-bold sm:text-2xl">{region.dong} 맛집 TOP 5</h2>
          <p className="mt-0.5 text-sm text-slate-500">
            {region.gu} · 조사 대상 {region.surveyed}곳 중 {metric === 'review' ? '리뷰 많은 순' : '별점 높은 순'}
          </p>
        </div>

        <div className="inline-flex rounded-lg border border-slate-300 bg-white p-0.5" role="group" aria-label="정렬 기준">
          {[['review', '리뷰순'], ['rating', '별점순']].map(pair => (
            <button
              key={pair[0]}
              type="button"
              onClick={() => onMetric(pair[0])}
              aria-pressed={metric === pair[0]}
              className={`rounded-md px-3 py-1.5 text-xs font-semibold transition
                          ${metric === pair[0] ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              {pair[1]}
            </button>
          ))}
        </div>
      </div>

      {best && (
        <p className="rounded-xl bg-slate-900 px-4 py-3 text-sm leading-relaxed text-slate-100">
          🏆 <strong className="font-semibold">{best.name}</strong>
          {metric === 'review'
            ? josa(best.name, '이', '가') + ' 리뷰 ' + comma(best.review) + '건으로 1위'
              + (best.rating > 0 ? ' · 별점 ' + best.rating.toFixed(1) + '점' : '')
            : josa(best.name, '이', '가') + ' 별점 ' + best.rating.toFixed(1) + '점으로 1위 · 리뷰는 '
              + comma(best.review) + '건'}
        </p>
      )}

      <div className="space-y-3">
        {shown.map((p, i) => (
          <RestaurantCard key={p.name + p.addr} place={p} index={i} max={max} dong={region.dong} />
        ))}
      </div>

      {sorted.length > 5 && (
        <div className="flex justify-center">
          <Button variant="secondary" onClick={() => setExpanded(v => !v)} aria-expanded={expanded}>
            {expanded ? '접기 ▲' : '6~' + sorted.length + '위 더보기 ▼'}
          </Button>
        </div>
      )}

      <div className="flex justify-center pt-2">
        <a
          href={kakaoSearchUrl(region.dong)}
          target="_blank"
          rel="noopener noreferrer"
          className="text-sm font-medium text-slate-500 underline underline-offset-4 hover:text-slate-800"
        >
          카카오맵에서 {region.dong} 맛집 직접 검색하기 ↗
        </a>
      </div>
    </section>
  );
}

// ========================================
// 🚀 App
// ========================================

const RECENT_KEY = 'dongne-top5-recent';

const loadRecent = () => {
  try {
    const saved = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
    return Array.isArray(saved) ? saved.slice(0, 6) : [];
  } catch (e) {
    return []; // 시크릿 모드 등 저장소 접근이 막힌 경우
  }
};

function App() {
  const [query, setQuery] = useState('');
  const [submitted, setSubmitted] = useState('');
  const [metric, setMetric] = useState('review');
  const [closeSignal, setCloseSignal] = useState(0);
  const [recent, setRecent] = useState(loadRecent);

  const region = useMemo(() => (submitted ? matchRegions(submitted)[0] || null : null), [submitted]);

  const pushRecent = useCallback(dong => {
    setRecent(prev => {
      const next = [dong].concat(prev.filter(d => d !== dong)).slice(0, 6);
      try { localStorage.setItem(RECENT_KEY, JSON.stringify(next)); } catch (e) { /* 저장 실패는 무시 */ }
      return next;
    });
  }, []);

  const runSearch = useCallback(term => {
    const t = (term || '').trim();
    setSubmitted(t);
    const hit = matchRegions(t)[0];
    if (hit) pushRecent(hit.dong);
  }, [pushRecent]);

  const pick = useCallback(dong => {
    setQuery(dong);
    runSearch(dong);
    setCloseSignal(n => n + 1);
  }, [runSearch]);

  const clearRecent = useCallback(() => {
    setRecent([]);
    try { localStorage.removeItem(RECENT_KEY); } catch (e) { /* 무시 */ }
  }, []);

  return (
    <div className="flex min-h-screen flex-col">
      <Header />

      <main className="mx-auto w-full max-w-4xl flex-1 space-y-6 px-5 py-8">
        <SearchBar value={query} onChange={setQuery} onSubmit={runSearch} closeSignal={closeSignal} />

        <RecentSearches items={recent} onPick={pick} onClear={clearRecent} />

        <div className="space-y-2">
          <p className="text-xs font-medium text-slate-400">조회 가능한 동네 {REGIONS.length}곳</p>
          <RegionChips onPick={pick} current={region ? region.dong : ''} />
        </div>

        <div className="pt-2">
          {region
            ? <ResultPanel region={region} metric={metric} onMetric={setMetric} />
            : <EmptyState query={submitted} />}
        </div>
      </main>

      <Footer />
    </div>
  );
}
