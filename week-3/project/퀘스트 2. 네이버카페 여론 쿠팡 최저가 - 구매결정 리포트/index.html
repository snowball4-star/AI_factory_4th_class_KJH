    function computeResult(a) {
      const score = { A7C2: 0, A7M5: 0, A7M4: 0 };
      const reasons = [];

      // 보유 기기
      if (a.owned === 'none' || a.owned === 'crop') {
        score.A7C2 += 2; score.A7M5 += 1;
        reasons.push('첫 풀프레임 진입에서는 AF 세대 차이 체감이 가장 크게 보고된다.');
      }
      if (a.owned === 'oldff') {
        score.A7C2 += 2; score.A7M5 += 1;
        reasons.push('A7M3 → A7C2 기변자는 “AF가 엄청 좋아졌다, 빨리 바꾸세요”라고 적었다.');
      }
      if (a.owned === 'newff') {
        score.A7M5 += 1; score.A7C2 -= 1; score.A7M4 -= 3;
      }

      // 용도
      if (a.use === 'photo') { score.A7C2 += 2; score.A7M4 += 1; score.A7M5 -= 1; }
      if (a.use === 'both')  { score.A7M5 += 2; score.A7C2 += 1; }
      if (a.use === 'video') { score.A7M5 += 3; }
      if (a.use !== 'photo') reasons.push('영상을 겸한다면 A7M5의 4K 60p·듀얼 ISO·동적 액티브 손떨방이 차액을 설명한다.');

      // 피사체
      if (a.subject === 'static') { score.A7C2 += 2; score.A7M5 -= 1; }
      if (a.subject === 'kids')   { score.A7M5 += 2; score.A7C2 += 1; }
      if (a.subject === 'sports') { score.A7M5 += 3; score.A7C2 -= 1; }
      if (a.subject !== 'static') reasons.push('움직이는 피사체에서는 A7M5의 프리캡처·30연사가 실사용 만족으로 직결된다는 후기가 많다.');
      else reasons.push('정적 피사체 위주라면 최신 AF·연사에 돈을 더 쓸 이유가 약하다.');

      // 폼팩터
      if (a.form === 'light') { score.A7C2 += 3; score.A7M4 -= 2; }
      if (a.form === 'grip')  { score.A7M4 += 3; score.A7M5 += 1; score.A7C2 -= 2;
        reasons.push('A7C2는 “무거운 렌즈를 물리면 무게 밸런스가 무너진다”는 지적이 1위 후기의 핵심이다.'); }

      // 예산
      if (a.budget === 'low')  { score.A7C2 += 3; score.A7M4 += 1; score.A7M5 -= 4;
        reasons.push('250만원 이하에서는 A7M5(333만원)가 사실상 선택지에서 빠진다.'); }
      if (a.budget === 'mid')  { score.A7C2 += 1; score.A7M5 += 1; }
      if (a.budget === 'high') { score.A7M5 += 2; }

      const ranked = Object.entries(score).sort((x, y) => y[1] - x[1]);
      const winner = ranked[0][0];
      const runnerUp = ranked[1][0];

      // 살까/말까 판정
      const hold = a.owned === 'newff' && a.use === 'photo' && a.subject === 'static';

      return { winner, runnerUp, score, hold, reasons: reasons.slice(0, 4) };
    }

    function Diagnose() {
      const [answers, setAnswers] = useState({});
      const answered = QUESTIONS.filter(q => answers[q.id]).length;
      const done = answered === QUESTIONS.length;
      const result = useMemo(() => (done ? computeResult(answers) : null), [answers, done]);

      const pick = useCallback((qid, v) => {
        setAnswers(prev => ({ ...prev, [qid]: v }));
      }, []);

      const reset = useCallback(() => setAnswers({}), []);

      const winnerModel = result ? MODELS.find(m => m.id === result.winner) : null;

      return (

                    <span className="text-orange-600 mr-1.5">{qi + 1}.</span>{q.q}
                  </legend>
                  <div className="flex flex-wrap gap-2">
                    {q.options.map(o => {
                      const active = answers[q.id] === o.v;
                      return (
                        <button
                          key={o.v}
                          type="button"
                          onClick={() => pick(q.id, o.v)}
                          aria-pressed={active}
                          className={`px-3.5 py-2 rounded-xl text-sm font-medium border transition-all ${
                            active
                              ? 'bg-slate-900 text-white border-slate-900 shadow-sm'
                              : 'bg-white text-slate-700 border-slate-300 hover:border-slate-400 hover:bg-slate-50'
                          }`}
                        >
                          {o.label}
                        </button>
                      );
                    })}
                  </div>
                </fieldset>
              ))}
            </div>

            {/* 결과 */}
            <div className="mt-8 pt-6 border-t border-slate-200">
              {!done && (
                <p className="text-sm text-slate-500">
                  남은 문항 {QUESTIONS.length - answered}개를 선택하면 결과가 나옵니다.
                </p>
              )}

              {done && result && (
                <div className="fade-up">
                  {result.hold ? (
                    <div className="rounded-xl bg-rose-50 border border-rose-200 p-5">
                      <Badge tone="rose" className="mb-2">판정: 말까</Badge>
                      <h3 className="text-xl font-bold text-slate-900">지금은 사지 않는 쪽을 권한다</h3>
                      <p className="mt-2 text-sm text-slate-700 leading-relaxed">
                        이미 A7M4·A7C2급을 가지고 있고, 사진 위주로 정적인 피사체를 찍는다면
                        업그레이드 체감이 가장 작은 조합이다. A7M4 4년 사용자의 A7M5 후기는
                        “근거리에서 전신 꽉 차게 인물 1명 촬영 → 체감 거의 없음”이라고 적었고,
                        또 다른 실사용자는 “사진만 찍는다면 바꾸는 거 큰 의미 없어 보인다”고 결론지었다.
                      </p>
                      <p className="mt-3 text-sm text-slate-700 leading-relaxed">
                        굳이 바꾼다면 <strong>{winnerModel.name}</strong> 쪽이 상대적으로 낫지만,
                        같은 예산을 렌즈에 쓰는 편이 결과물 차이가 더 크다는 것이 후기들의 일관된 방향이다.
                      </p>
                    </div>
                  ) : (
                    <div className={`rounded-xl ${ACCENT[winnerModel.accent].soft} border ${ACCENT[winnerModel.accent].ring} border-opacity-60 p-5`}>
                      <Badge tone={winnerModel.accent} className="mb-2">판정: 산다</Badge>
                      <h3 className="text-xl sm:text-2xl font-bold text-slate-900">
                        추천 기종은 <span className={ACCENT[winnerModel.accent].text}>{winnerModel.name}</span>
                        <span className="text-base font-semibold text-slate-500 ml-2">
                          {winnerModel.price.toLocaleString()}원
                        </span>
                      </h3>
                      <p className="mt-1 text-sm text-slate-600">
                        차선책은 {runnerModel.name} ({runnerModel.price.toLocaleString()}원)
                      </p>

                      <ul className="mt-4 space-y-2">
                        {result.reasons.map((r, i) => (
                          <li key={i} className="flex gap-2 text-sm text-slate-700 leading-relaxed">
                            <span className={`${ACCENT[winnerModel.accent].text} font-bold shrink-0`}>·</span>
                            <span>{r}</span>
                          </li>
                        ))}
                      </ul>

                      <div className="mt-4 pt-4 border-t border-white/60">
                        <div className="text-xs font-semibold text-slate-500 mb-2">기종별 적합도 점수</div>
                        <div className="space-y-1.5">
                          {Object.entries(result.score)
                            .sort((a, b) => b[1] - a[1])
                            .map(([id, s]) => {
                              const m = MODELS.find(x => x.id === id);
                              const maxAbs = 12;
                              const pct = Math.max(0, Math.min(100, ((s + 4) / maxAbs) * 100));
                              return (
                                <div key={id} className="flex items-center gap-3">
                                  <span className="w-14 text-xs font-bold text-slate-700">{m.name}</span>

                                </div>
                              );

      return (
        <Section
          id="compare"
          eyebrow="한눈에 보기"
          title="3종 비교표"
          description="별점은 쿠팡 목록에 정수(★5 / ★4.5)로만 표시되므로, 상위 3개 상품의 상품평을 전수로 긁어 개별 평점을 평균 내 소수점까지 계산했다."
        >
          <div className="overflow-x-auto -mx-5 px-5">
            <table className="w-full min-w-[640px] border-collapse">
              <caption className="sr-only">A7C2, A7M5, A7M4의 가격·커뮤니티 조회수·쿠팡 지표 비교</caption>
              <thead>
                <tr>

                      </div>

                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map((r, ri) => {
                  let bestId = null;
                  if (r.best && r.raw) {
                    const vals = MODELS.map(m => ({ id: m.id, v: r.raw(m) }));
                    bestId = (r.best === 'max'
                      ? vals.reduce((a, b) => (b.v > a.v ? b : a))
                      : vals.reduce((a, b) => (b.v < a.v ? b : a))).id;

                  return (
                    <tr key={r.label} className={ri % 2 ? 'bg-slate-50/70' : ''}>
                      <th scope="row" className="text-left text-sm font-semibold text-slate-600 py-3 pr-4 align-middle">

                      {MODELS.map(m => (
                        <td key={m.id} className="py-3 px-3 align-middle">

                          </span>
                          {bestId === m.id && (
                            <span className="ml-2 text-[10px] font-bold text-white bg-slate-900 px-1.5 py-0.5 rounded">최고</span>
                          )}
                        </td>
                      ))}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <p className="mt-4 text-xs text-slate-500 leading-relaxed">
            ※ A7M4 최저가 2,185,000원 상품은 리뷰 0건·별점 없는 “기본구성 위너” 표기로 정품 확인이 되지 않아 대표가에서 제외했다.
            가격은 쿠팡 와우회원가 기준 {COLLECTED_AT} 시점 스냅숏이다.
          </p>
        </Section>
      );
    }

    // ========================================
    // 📄 SECTION: 근거 (차트)
    // ========================================

    function Evidence() {
      const maxComm = Math.max(...MODELS.map(m => m.slrHits + m.naverHits));
      const maxPrice = Math.max(...MODELS.map(m => m.price));
      const maxReviews = Math.max(...MODELS.map(m => m.reviews));
      const maxScore = Math.max(...MODELS.map(m => m.commScore), ...RUNNER_UPS.map(r => r.score));

      return (
        <Section
          id="evidence"
          eyebrow="숫자로 보는 근거"
          title="왜 이 3종인가"
          description="16개 기종을 두 커뮤니티에서 각각 집계한 뒤, 사이트별 후기 조회수 점유율(%)을 합산해 순위를 냈다. 커뮤니티 규모가 달라 조회수 절대값을 그대로 더할 수 없기 때문이다."
        >
          <div className="grid lg:grid-cols-2 gap-5">
            {/* 종합 점수 */}
            <Card className="p-6">
              <h3 className="font-bold text-slate-900">커뮤니티 후기 조회수 합산 점수</h3>
              <p className="text-xs text-slate-500 mt-1 mb-5">두 사이트 점유율(%) 합산 · 2024년 이후</p>
              <div className="space-y-2.5">
                {MODELS.map((m, i) => (
                  <Bar key={m.id} label={m.name} value={m.commScore} max={maxScore}
                       accent={m.accent} valueLabel={m.commScore.toFixed(1) + '점'} delay={i * 90} />
                ))}
                <div className="pt-2 mt-2 border-t border-slate-100 space-y-2.5">
                  {RUNNER_UPS.map((r, i) => (
                    <Bar key={r.name} label={r.name} value={r.score} max={maxScore}
                         accent="slate" valueLabel={r.score.toFixed(1) + '점'} delay={(MODELS.length + i) * 90} />
                  ))}
                </div>
              </div>
              <p className="mt-5 text-xs text-slate-500 leading-relaxed">
                1·2위는 두 사이트에서 <strong>모두 동일하게</strong> 1·2위였다. 3위만 갈렸는데
                (SLR클럽 = A7M4, 네이버 = A1M2) 합산 시 A7M4가 근소하게 앞섰다.
              </p>
            </Card>

            {/* 사이트별 분해 */}
            <Card className="p-6">
              <h3 className="font-bold text-slate-900">사이트별 후기 조회수</h3>
              <p className="text-xs text-slate-500 mt-1 mb-5">절대값 · 왼쪽 SLR클럽 / 오른쪽 네이버 소미클</p>
              <div className="space-y-5">
                {MODELS.map(m => {
                  const total = m.slrHits + m.naverHits;
                  const slrPct = Math.round((m.slrHits / total) * 100);
                  return (
                    <div key={m.id}>
                      <div className="flex items-baseline justify-between mb-1.5">
                        <span className="text-sm font-bold text-slate-800">{m.name}</span>
                        <span className="text-xs font-semibold text-slate-500 tabular-nums">
                          합계 {total.toLocaleString()}회
                        </span>
                      </div>
                      <div className="flex h-6 rounded-md overflow-hidden bg-slate-100">
                        <div className={`${ACCENT[m.accent].bar} grow-bar flex items-center justify-start px-2`}
                             style={{ width: slrPct + '%' }}>
                          <span className="text-[10px] font-bold text-white tabular-nums whitespace-nowrap">
                            {m.slrHits.toLocaleString()}
                          </span>
                        </div>
                        <div className="bg-slate-300 grow-bar flex items-center justify-end px-2"
                             style={{ width: (100 - slrPct) + '%' }}>
                          <span className="text-[10px] font-bold text-slate-700 tabular-nums whitespace-nowrap">
                            {m.naverHits.toLocaleString()}
                          </span>
                        </div>
                      </div>
                      <div className="mt-1 text-[11px] text-slate-500">
                        후기 글 {m.slrCount + m.naverCount}건 (SLR {m.slrCount} · 네이버 {m.naverCount})
                      </div>
                    </div>
                  );
                })}
              </div>
            </Card>

            {/* 가격 */}
            <Card className="p-6">
              <h3 className="font-bold text-slate-900">쿠팡 정품 바디 가격</h3>
              <p className="text-xs text-slate-500 mt-1 mb-5">와우회원가 · {COLLECTED_AT} 기준</p>
              <div className="space-y-2.5">
                {[...MODELS].sort((a, b) => a.price - b.price).map((m, i) => (
                  <Bar key={m.id} label={m.name} value={m.price} max={maxPrice}
                       accent={m.accent} valueLabel={(m.price / 10000).toFixed(1) + '만원'} delay={i * 90} />
                ))}
              </div>
              <div className="mt-5 rounded-lg bg-amber-50 border border-amber-200 px-4 py-3">
                <p className="text-xs text-slate-700 leading-relaxed">
                  <strong>가격 역전.</strong> A7C2(233.0만)가 A7M4(245.4만)보다 12.4만원 싸다.
                  A7M5는 A7C2 대비 <strong>+100.0만원</strong>이다.
                </p>
              </div>
            </Card>

            {/* 별점 & 리뷰수 */}
            <Card className="p-6">
              <h3 className="font-bold text-slate-900">쿠팡 별점과 리뷰수</h3>
              <p className="text-xs text-slate-500 mt-1 mb-5">상위 3개 상품 상품평 전수 집계</p>

              <div className="space-y-2.5 mb-6">
                {MODELS.map((m, i) => (
                  <Bar key={m.id} label={m.name} value={m.reviews} max={maxReviews}
                       accent={m.accent} valueLabel={m.reviews + '건'} delay={i * 90} />
                ))}
              </div>

              <div className="grid grid-cols-3 gap-2">
                {MODELS.map(m => (
                  <div key={m.id} className={`rounded-lg ${ACCENT[m.accent].soft} px-3 py-3 text-center`}>
                    <div className="text-[11px] font-semibold text-slate-500">{m.name}</div>
                    <div className={`text-xl font-bold ${ACCENT[m.accent].text} tabular-nums mt-0.5`}>
                      {m.rating.toFixed(2)}
                    </div>
                    <div className="text-[10px] text-slate-500 mt-0.5">5점 {m.fiveStar}%</div>
                  </div>
                ))}
              </div>

              <p className="mt-5 text-xs text-slate-500 leading-relaxed">
                <strong className="text-slate-700">주의:</strong> 별점이 4.76~4.86에 몰려 있어 변별력이 없다.
                낮은 점수 리뷰를 열어보면 대부분 제품이 아니라 배송·포장·사은품(액정필름) 불만이다.
                쿠팡 리뷰수도 인기도가 아니라 <strong className="text-slate-700">판매 누적 기간</strong>의 지표에 가깝다 —
                최근 출시된 A7M5가 적은 이유다.
              </p>
            </Card>
          </div>
        </Section>
      );
    }

    // ========================================
    // 📄 SECTION: 기종별 상세 (탭)
    // ========================================

    function ModelDetail() {
      const [active, setActive] = useState(MODELS[0].id);
      const m = MODELS.find(x => x.id === active);
      const a = ACCENT[m.accent];

      return (
        <Section
          id="models"
          eyebrow="기종별 상세"
          title="후기가 실제로 말한 것"
          description="장단점은 조회수 상위 후기 본문에서 반복적으로 언급된 항목만 추렸다. 스펙표가 아니라 사용자가 직접 겪은 내용이다."
        >
          <div role="tablist" aria-label="기종 선택" className="flex flex-wrap gap-2 mb-6">
            {MODELS.map(x => {
              const on = x.id === active;
              return (
                <button
                  key={x.id}
                  role="tab"
                  aria-selected={on}
                  aria-controls={`panel-${x.id}`}
                  id={`tab-${x.id}`}
                  onClick={() => setActive(x.id)}
                  className={`px-4 py-2.5 rounded-xl text-sm font-bold border transition-all ${
                    on ? `${ACCENT[x.accent].btn} text-white border-transparent shadow-sm`
                       : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'
                  }`}
                >
                  {x.name}
                  <span className={`ml-2 text-[11px] font-semibold ${on ? 'text-white/75' : 'text-slate-400'}`}>
                    {(x.price / 10000).toFixed(0)}만
                  </span>
                </button>
              );
            })}
          </div>

          <Card className="p-6 sm:p-8 fade-up" key={active}>
            <div role="tabpanel" id={`panel-${m.id}`} aria-labelledby={`tab-${m.id}`}>
              <div className="flex flex-wrap items-start justify-between gap-4 pb-6 border-b border-slate-200">
                <div>
                  <div className="flex items-center gap-2">
                    <h3 className="text-2xl font-bold text-slate-900">{m.name}</h3>
                    <Badge tone={m.accent}>커뮤니티 {m.commRank}위</Badge>
                  </div>
                  <p className="text-sm text-slate-500 mt-1">{m.fullName}</p>
                </div>
                <div className="text-right">
                  <div className={`text-2xl font-bold ${a.text} tabular-nums`}>
                    {m.price.toLocaleString()}<span className="text-base ml-0.5">원</span>
                  </div>
                  <div className="text-xs text-slate-500 mt-0.5">
                    ★ {m.rating.toFixed(2)} · 리뷰 {m.reviews}건
                  </div>
                </div>
              </div>

              <div className="grid md:grid-cols-2 gap-6 pt-6">
                <div>
                  <h4 className="flex items-center gap-2 text-sm font-bold text-emerald-700 mb-3">
                    <span className="w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 grid place-items-center text-xs" aria-hidden="true">+</span>
                    후기에서 반복된 장점
                  </h4>
                  <ul className="space-y-2.5">
                    {m.pros.map((p, i) => (
                      <li key={i} className="flex gap-2.5 text-sm text-slate-700 leading-relaxed">
                        <span className="text-emerald-500 font-bold shrink-0 mt-0.5">▸</span>
                        <span>{p}</span>
                      </li>
                    ))}
                  </ul>
                </div>
                <div>
                  <h4 className="flex items-center gap-2 text-sm font-bold text-rose-700 mb-3">
                    <span className="w-5 h-5 rounded-full bg-rose-100 text-rose-700 grid place-items-center text-xs" aria-hidden="true">−</span>
                    후기에서 반복된 단점
                  </h4>
                  <ul className="space-y-2.5">
                    {m.cons.map((c, i) => (
                      <li key={i} className="flex gap-2.5 text-sm text-slate-700 leading-relaxed">
                        <span className="text-rose-400 font-bold shrink-0 mt-0.5">▸</span>
                        <span>{c}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              </div>

              <div className="grid sm:grid-cols-2 gap-3 mt-6 pt-6 border-t border-slate-200">
                <div className={`rounded-xl ${a.soft} px-4 py-3.5`}>
                  <div className="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">이런 사람에게</div>
                  <p className="text-sm text-slate-800 leading-relaxed font-medium">{m.who}</p>
                </div>
                <div className="rounded-xl bg-slate-100 px-4 py-3.5">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">이런 사람은 피할 것</div>
                  <p className="text-sm text-slate-700 leading-relaxed">{m.notFor}</p>
                </div>
              </div>
            </div>
          </Card>
        </Section>
      );
    }

    // ========================================
    // 📄 SECTION: 실제 후기 인용
    // ========================================

    function Quotes() {
      const [filter, setFilter] = useState('ALL');
      const list = filter === 'ALL' ? QUOTES : QUOTES.filter(q => q.model === filter);

      return (
        <Section
          id="quotes"
          eyebrow="원문 그대로"
          title="실제 후기에서"
          description="위 판단의 근거가 된 문장들이다. 요약이 아니라 작성자가 쓴 표현 그대로 옮겼다."
        >
          <div className="flex flex-wrap gap-2 mb-6">
            {['ALL', ...MODELS.map(m => m.id)].map(f => (
              <Button key={f} size="sm"
                      variant={filter === f ? 'primary' : 'secondary'}
                      onClick={() => setFilter(f)}>
                {f === 'ALL' ? '전체' : f}
              </Button>
            ))}
          </div>

          {list.length === 0 ? (
            <Card className="p-8 text-center text-sm text-slate-500">해당하는 인용이 없습니다.</Card>
          ) : (
            <div className="grid md:grid-cols-2 gap-4">
              {list.map((q, i) => {
                const m = MODELS.find(x => x.id === q.model);
                const good = q.tone === 'pro';
                return (
                  <Card key={i} className={`p-5 border-l-4 ${good ? 'border-l-emerald-400' : 'border-l-rose-400'}`}>
                    <div className="flex items-center gap-2 mb-3 flex-wrap">
                      <Badge tone={m.accent}>{q.model}</Badge>
                      <span className="text-xs font-semibold text-slate-700">{q.source}</span>
                      <span className="text-xs text-slate-400">{q.meta}</span>
                    </div>
                    <blockquote className="text-sm text-slate-700 leading-relaxed">
                      <span className={`${good ? 'text-emerald-400' : 'text-rose-400'} font-bold mr-1`}>“</span>
                      {q.text}
                      <span className={`${good ? 'text-emerald-400' : 'text-rose-400'} font-bold ml-1`}>”</span>
                    </blockquote>
                  </Card>
                );
              })}
            </div>
          )}
        </Section>
      );
    }

    // ========================================
    // 📄 SECTION: 한계 & 출처
    // ========================================

    function Limits() {
      const limits = [
        {
          t: '네이버 카페 본문은 읽지 못했다',
          d: '계정 등급이 AUTO여서 소미클 후기 게시판의 본문 열람 권한이 없었다(P등급 필요). 네이버 쪽은 제목·조회수 등 목록 메타데이터만 수집했고, 본문 인용은 전부 SLR클럽과 쿠팡 상품평이다.'
        },
        {
          t: '조회수는 화제성이지 성능이 아니다',
          d: '신제품과 논쟁글이 유리하게 잡히고, 오래 안정적으로 쓰이는 기종은 낮게 잡힌다. “많이 읽힌 기종”과 “좋은 기종”은 같지 않다.'
        },
        {
          t: '제목 검색의 누락',
          d: 'SLR클럽 검색은 제목을 대상으로 하므로 본문에서만 모델을 언급한 글은 빠진다. A7C2·A7M4는 수집 시 페이지 상한(40p)에 걸려 실제 수치가 표보다 클 수 있다.'
        },
        {
          t: '쿠팡 표본이 작다',
          d: '상품평이 기종당 57~89건뿐이라 통계적 신뢰도가 낮다. 가격도 와우회원가 기준이며 시시각각 변한다. 검색 첫 페이지(36개 카드) 범위라 더 저렴한 하위 노출 상품이 있을 수 있다.'
        }
      ];

      return (
        <Section
          id="limits"
          eyebrow="투명성"
          title="이 리포트가 말하지 않는 것"
          description="판단에 쓴 데이터의 한계를 그대로 적는다. 아래를 감안하고 읽어야 한다."
        >
          <div className="grid md:grid-cols-2 gap-4">
            {limits.map((l, i) => (
              <Card key={i} className="p-5">
                <h3 className="text-sm font-bold text-slate-900 flex gap-2">
                  <span className="text-slate-300 font-mono tabular-nums">{String(i + 1).padStart(2, '0')}</span>
                  {l.t}
                </h3>
                <p className="mt-2 text-sm text-slate-600 leading-relaxed pl-7">{l.d}</p>
              </Card>
            ))}
          </div>

          <Card className="mt-5 p-6">
            <h3 className="text-sm font-bold text-slate-900 mb-4">데이터 출처</h3>
            <ul className="space-y-3">
              {SOURCES.map((s, i) => (
                <li key={i} className="flex flex-col sm:flex-row sm:items-baseline gap-1 sm:gap-3">
                  <a href={s.url} target="_blank" rel="noopener noreferrer"
                     className="text-sm font-semibold text-slate-800 hover:text-orange-600 underline decoration-slate-300 underline-offset-2 shrink-0">
                    {s.label}
                  </a>
                  <span className="text-xs text-slate-500">{s.detail}</span>
                </li>
              ))}
            </ul>
            <p className="mt-5 pt-4 border-t border-slate-100 text-xs text-slate-500 leading-relaxed">
              수집 도구: Playwright (MCP) · 수집일 {COLLECTED_AT} ·
              집계 대상 기간 2024-01-01 이후 · 분석 기종 16종 중 상위 3종 선별
            </p>
          </Card>
        </Section>
      );
    }

    function Footer() {
      return (
        <footer className="bg-slate-900 text-slate-400 py-10">
          <div className="max-w-5xl mx-auto px-5">
            <p className="text-sm">
              소니 카메라 구매 판단 리포트 · 커뮤니티 후기 조회수 × 쿠팡 가격·별점·리뷰수
            </p>
            <p className="mt-2 text-xs text-slate-500 leading-relaxed">
              이 리포트는 공개된 커뮤니티 게시글과 쇼핑몰 노출 정보를 집계한 결과물이며,
              특정 판매자·브랜드와 무관합니다. 가격과 재고는 수시로 변하므로 실제 구매 전 직접 확인하세요.
            </p>
          </div>
        </footer>
      );
    }

    // ========================================
    // 🚀 APP
    // ========================================

    function App() {
      return (
        <React.Fragment>
          <Header />
          <main>
            <Hero />
            <VerdictSection />
            <Diagnose />
            <CompareTable />
            <Evidence />
            <ModelDetail />
            <Quotes />
            <Limits />
          </main>
          <Footer />
        </React.Fragment>
      );
    }

    // ========================================
    // RENDERING
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
