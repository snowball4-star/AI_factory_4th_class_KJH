    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children, ...rest }) {
      const variants = {
        primary:   'bg-sky-600 text-white hover:bg-sky-700 focus:ring-sky-500',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus:ring-slate-400',

        ghost:     'bg-transparent text-slate-600 hover:bg-slate-100 focus:ring-slate-300',
      };
      const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-4 py-2 text-sm', lg: 'px-6 py-3 text-base' };
      return (
        <button
          type="button"
          onClick={onClick}
          disabled={disabled}
          className={`inline-flex items-center justify-center gap-2 rounded-lg font-semibold transition-colors
            focus:outline-none focus:ring-2 focus:ring-offset-2
            disabled:opacity-50 disabled:cursor-not-allowed
            ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm ring-1 ring-slate-200/70 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ tone = 'slate', className = '', children }) {
      const tones = {
        slate: 'bg-slate-100 text-slate-700 ring-slate-200',
        sky:   'bg-sky-50 text-sky-700 ring-sky-200',
        teal:  'bg-teal-50 text-teal-700 ring-teal-200',
        amber: 'bg-amber-50 text-amber-800 ring-amber-200',
        rose:  'bg-rose-50 text-rose-700 ring-rose-200',
      };
      return (
        <span className={`inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ring-inset ${tones[tone]} ${className}`}>
          {children}
        </span>
      );
    }

    function StatTile({ label, value, sub, tone = 'slate' }) {
      const tones = { slate: 'text-slate-900', sky: 'text-sky-700', teal: 'text-teal-700', rose: 'text-rose-600' };
      return (
        <Card className="p-5">
          <p className="text-xs font-medium text-slate-500">{label}</p>
          <p className={`mt-1 text-2xl font-bold tabular-nums ${tones[tone]}`}>{value}</p>
          {sub && <p className="mt-1 text-xs text-slate-500 leading-relaxed">{sub}</p>}

      );

      return (
        <div role="tablist" aria-label="콘텐츠 기획안 선택" className="flex flex-col sm:flex-row gap-2 p-1.5 bg-slate-100 rounded-xl">

            const selected = it.id === active;
            return (
              <button
                key={it.id}
                role="tab"
                aria-selected={selected}
                onClick={() => onChange(it.id)}
                className={`flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors text-left sm:text-center

                {it.tabLabel}
              </button>
            );
          })}
        </div>
      );
    }
