    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp .3s ease-out both; }

    @keyframes blink {
      0%, 80%, 100% { opacity: .25; transform: translateY(0); }
      40%           { opacity: 1;   transform: translateY(-3px); }
    }
    .dot { animation: blink 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: .18s; }
    .dot:nth-child(3) { animation-delay: .36s; }

    .scroll-soft::-webkit-scrollbar-thumb { background: rgba(100,116,139,.3); border-radius: 999px; }

      const variants = {
        primary:   'bg-teal-600 text-white hover:bg-teal-700 focus:ring-teal-400',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus:ring-slate-300',
        danger:    'bg-rose-600 text-white hover:bg-rose-700 focus:ring-rose-300',
        ghost:     'bg-transparent text-slate-500 hover:bg-slate-200/70 focus:ring-slate-300',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-xs',
        md: 'px-4 py-2 text-sm',
        lg: 'px-6 py-3 text-base',
      };
      return (
        <button
          type="button"
          onClick={onClick}
          disabled={disabled}
          className={`inline-flex items-center justify-center gap-1.5 rounded-xl font-medium transition
            focus:outline-none focus:ring-2 focus:ring-offset-1
            disabled:opacity-40 disabled:cursor-not-allowed
            ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

        <div className={`bg-white rounded-2xl shadow-sm border border-slate-200/80 ${className}`}>

        </div>

        teal:  'bg-teal-50 text-teal-700',
        rose:  'bg-rose-50 text-rose-700',
        amber: 'bg-amber-50 text-amber-700',
      };
      return (
        <span className={`inline-flex items-center rounded-full px-2.5 py-1 text-xs font-medium ${tones[tone]} ${className}`}>
          {children}
        </span>
      );
    }

    function Textarea({ value, onChange, onKeyDown, placeholder, disabled = false, className = '', inputRef, ...rest }) {

    const MOODS = [

      { emoji: '🫥', label: '자신이 없어요', topicId: 'selfesteem' },
      { emoji: '💬', label: '그냥 이야기하고 싶어요', topicId: 'general' },
    ];

    const ALL_RULES = [...TOPIC_RULES, DEFAULT_RULE];
    const getRule = (id) => ALL_RULES.find((r) => r.id === id) || DEFAULT_RULE;

    const isCrisis = (text) => CRISIS_KEYWORDS.some((k) => text.includes(k));

    // 키워드가 가장 많이 걸린 주제를 고르고, 매칭이 없으면 일반 대화로 처리한다.
    function detectTopic(text) {
      let best = DEFAULT_RULE;
      let bestScore = 0;
      TOPIC_RULES.forEach((rule) => {
        const score = rule.keywords.reduce((acc, k) => (text.includes(k) ? acc + 1 : acc), 0);
        if (score > bestScore) {
          best = rule;
          bestScore = score;
        }
      });
      return best;
    }

    const pick = (list, seed) => list[seed % list.length];

    // 공감 반영 → (3턴마다) 셀프케어 제안 → 열린 질문 순으로 응답을 조립한다.
    function buildReply(rule, turn) {
      const seed = turn + Math.floor(Math.random() * 3);
      const parts = [pick(rule.reflections, seed)];
      if (turn > 0 && turn % 3 === 0) parts.push(rule.care);
      parts.push(pick(rule.questions, seed + 1));
      return parts.join('\n\n');
    }

    const now = () => new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

    // ========================================
    // 📡 서버 API 연동

    // API 키는 서버(.env)에만 있고 브라우저는 이 프록시 경로만 호출한다.
    const API_BASE_URL = '/api';

    async function fetchHealth() {
      const res = await fetch(`${API_BASE_URL}/health`);
      const json = await res.json();
      if (!json || !json.success) throw new Error('상태 확인 실패');
      return json.data;
    }

    async function requestCounselorReply(history, topic) {
      const res = await fetch(`${API_BASE_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          topic,
          messages: history.map((m) => ({
            role: m.role === 'bot' ? 'assistant' : 'user',
            content: m.text,
          })),
        }),
      });
      const json = await res.json().catch(() => null);
      if (!res.ok || !json || !json.success) {
        throw new Error((json && json.message) || 'AI 응답을 받지 못했습니다.');
      }
      return { reply: json.data.reply, kind: json.data.kind || 'normal' };
    }

              <p className="text-xs text-slate-500 truncate flex items-center gap-1.5">
                판단하지 않고 끝까지 듣습니다
                <Badge tone={mode === 'ai' ? 'teal' : 'slate'} className="ml-0.5">
                  {mode === 'ai' ? 'AI 연결됨' : '오프라인 응답'}
                </Badge>
              </p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <Button variant="secondary" size="sm" onClick={onSummary} disabled={!canSummarize}>대화 정리</Button>
            <Button variant="ghost" size="sm" onClick={onReset} aria-label="대화 초기화">초기화</Button>
          </div>
        </header>
      );
    }

    function MessageBubble({ message }) {
      const isUser = message.role === 'user';
      const isCrisisMsg = message.kind === 'crisis';
      const bubble = isUser
        ? 'bg-teal-600 text-white rounded-br-md'
        : isCrisisMsg
          ? 'bg-rose-50 text-rose-900 border border-rose-200 rounded-bl-md'
          : 'bg-white text-slate-700 border border-slate-200 rounded-bl-md';

      return (
        <div className={`flex gap-2 animate-fade-up ${isUser ? 'justify-end' : 'justify-start'}`}>
          {!isUser && (
            <div className="w-8 h-8 shrink-0 rounded-full bg-teal-100 flex items-center justify-center text-sm" aria-hidden="true">
              {isCrisisMsg ? '🆘' : '🌿'}
            </div>
          )}
          <div className="max-w-[78%] sm:max-w-[70%]">
            <div className={`px-4 py-3 rounded-2xl text-sm leading-6 whitespace-pre-wrap break-words shadow-sm ${bubble}`}>
              {message.text}
            </div>
            <div className={`mt-1 text-[11px] text-slate-400 ${isUser ? 'text-right' : 'text-left'}`}>{message.time}</div>
          </div>
        </div>
      );
    }

    function TypingIndicator() {
      return (
        <div className="flex gap-2 animate-fade-up" aria-live="polite" aria-label="상담사가 입력 중입니다">
          <div className="w-8 h-8 shrink-0 rounded-full bg-teal-100 flex items-center justify-center text-sm" aria-hidden="true">🌿</div>
          <div className="px-4 py-3.5 rounded-2xl rounded-bl-md bg-white border border-slate-200 shadow-sm flex items-center gap-1.5">
            <span className="dot w-1.5 h-1.5 rounded-full bg-slate-400"></span>
            <span className="dot w-1.5 h-1.5 rounded-full bg-slate-400"></span>
            <span className="dot w-1.5 h-1.5 rounded-full bg-slate-400"></span>
          </div>
        </div>
      );
    }

    function MoodPicker({ onSelect }) {
      return (
        <div className="animate-fade-up">
          <Card className="p-6 text-center">
            <div className="text-3xl mb-3" aria-hidden="true">🌿</div>
            <h2 className="text-lg font-semibold text-slate-800">지금 마음은 어떤가요?</h2>
            <p className="mt-2 text-sm text-slate-500 leading-6">
              가장 가까운 것을 하나 골라 주세요.<br className="hidden sm:block" />
              고르지 않고 아래에 바로 이야기를 적으셔도 괜찮습니다.
            </p>
            <div className="mt-5 flex flex-wrap justify-center gap-2">
              {MOODS.map((mood) => (
                <button
                  key={mood.label}
                  type="button"
                  onClick={() => onSelect(mood)}
                  className="px-3.5 py-2 rounded-full border border-slate-200 bg-white text-sm text-slate-700
                    hover:border-teal-300 hover:bg-teal-50 transition focus:outline-none focus:ring-2 focus:ring-teal-200"
                >
                  <span className="mr-1.5" aria-hidden="true">{mood.emoji}</span>{mood.label}
                </button>
              ))}
            </div>
          </Card>
        </div>
      );
    }

    function QuickReplies({ items, onPick, disabled }) {
      if (!items.length) return null;
      return (
        <div className="flex flex-wrap gap-2 px-4 pb-2 bg-white/90">
          {items.map((text) => (
            <button
              key={text}
              type="button"
              disabled={disabled}
              onClick={() => onPick(text)}
              className="px-3 py-1.5 rounded-full border border-slate-200 bg-white text-xs text-slate-600
                hover:border-teal-300 hover:bg-teal-50 transition disabled:opacity-40
                focus:outline-none focus:ring-2 focus:ring-teal-200"
            >
              {text}
            </button>
          ))}
        </div>
      );
    }

    function Composer({ value, onChange, onSend, disabled }) {
      const inputRef = useRef(null);

      // 입력 길이에 맞춰 높이를 조절한다 (최대 140px).
      useEffect(() => {
        const el = inputRef.current;
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 140) + 'px';
      }, [value]);

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          onSend(value);
        }
      };

      return (
        <div className="px-4 pb-4 pt-2 border-t border-slate-200 bg-white/90 backdrop-blur">
          <div className="flex items-end gap-2">
            <Textarea
              inputRef={inputRef}
              value={value}
              onChange={(e) => onChange(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="마음에 있는 이야기를 편하게 적어 주세요 (Enter 전송 · Shift+Enter 줄바꿈)"
              disabled={disabled}
              aria-label="상담 메시지 입력"
            />
            <Button onClick={() => onSend(value)} disabled={disabled || !value.trim()} className="h-[46px] px-5 shrink-0">
              보내기
            </Button>
          </div>
          <p className="mt-2 text-[11px] text-slate-400 leading-5">
            이 앱은 규칙 기반 대화 도우미로, 전문가의 진단이나 치료를 대신하지 않습니다. 위급한 상황에서는 109 또는 119로 연락해 주세요.
          </p>
        </div>
      );
    }

    function SummaryCard({ topicIds, messageCount, onClose }) {
      const rules = topicIds.map(getRule);
      return (
        <Card className="p-5 animate-fade-up border-teal-200 bg-teal-50/40">
          <div className="flex items-start justify-between gap-3">
            <h3 className="text-sm font-semibold text-slate-800">오늘 대화 정리</h3>
            <Button variant="ghost" size="sm" onClick={onClose} aria-label="정리 닫기">닫기</Button>
          </div>
          <p className="mt-1 text-xs text-slate-500">주고받은 메시지 {messageCount}개</p>

          <div className="mt-3">
            <p className="text-xs font-medium text-slate-500 mb-1.5">함께 다룬 주제</p>
            <div className="flex flex-wrap gap-1.5">
              {rules.length
                ? rules.map((r) => <Badge key={r.id} tone={r.tone}>{r.label}</Badge>)
                : <Badge>아직 주제가 모이지 않았어요</Badge>}
            </div>
          </div>

          <div className="mt-4">
            <p className="text-xs font-medium text-slate-500 mb-1.5">오늘 해볼 만한 것</p>
            <ul className="space-y-2">
              {(rules.length ? rules : [DEFAULT_RULE]).map((r) => (
                <li key={r.id} className="flex gap-2 text-sm text-slate-700 leading-6">
                  <span className="text-teal-600 shrink-0" aria-hidden="true">·</span>
                  <span>{r.care}</span>
                </li>
              ))}
            </ul>
          </div>
        </Card>
      );
    }

    // ========================================
    // 📄 Page Component
    // ========================================

    function CounselorPage() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [thinking, setThinking] = useState(false);
      const [lastTopicId, setLastTopicId] = useState(null);
      const [topicIds, setTopicIds] = useState([]);
      const [showSummary, setShowSummary] = useState(false);
      const [mode, setMode] = useState('local'); // 'ai' = 서버 LLM, 'local' = 내장 규칙 엔진
      const [notice, setNotice] = useState('');

      const bottomRef = useRef(null);
      const turnRef = useRef(0);

      const started = messages.length > 0;
      const userMessageCount = useMemo(() => messages.filter((m) => m.role === 'user').length, [messages]);

      // 새 메시지가 쌓이면 항상 마지막 위치로 스크롤
      useEffect(() => {
        if (bottomRef.current) bottomRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, [messages, thinking, showSummary]);

      // 서버에 API 키가 준비돼 있는지 한 번 확인해 응답 모드를 정한다.
      useEffect(() => {
        let alive = true;
        fetchHealth()
          .then((data) => { if (alive) setMode(data.aiReady ? 'ai' : 'local'); })
          .catch(() => { if (alive) setMode('local'); });
        return () => { alive = false; };
      }, []);

      const appendBot = useCallback((text, kind = 'normal') => {
        setMessages((prev) => [...prev, { id: Date.now() + Math.random(), role: 'bot', text, kind, time: now() }]);
      }, []);

      // 서버 AI로 답을 받고, 실패하면 내장 규칙 엔진으로 대화를 끊기지 않게 이어 간다.
      const respond = useCallback(async (history, rule) => {
        setThinking(true);
        const turn = turnRef.current;
        turnRef.current += 1;
        try {
          const { reply, kind } = await requestCounselorReply(history, rule.label);
          appendBot(reply, kind);
          setMode('ai');
          setNotice('');
        } catch (err) {
          appendBot(buildReply(rule, turn), 'normal');
          setMode('local');
          setNotice(err.message || 'AI 서버에 연결하지 못해 기본 응답으로 이어 갑니다.');
        } finally {
          setThinking(false);
        }
      }, [appendBot]);

      const send = useCallback((raw) => {
        const text = (raw || '').trim();
        if (!text || thinking) return;

        const userMsg = { id: Date.now(), role: 'user', text, time: now() };
        const history = [...messages, userMsg];
        setMessages(history);
        setInput('');
        setShowSummary(false);

        // 위기 표현은 네트워크를 기다리지 않고 즉시 기관 안내를 띄운다(서버도 동일하게 한 번 더 막는다).
        if (isCrisis(text)) {
          setLastTopicId(null);
          appendBot(CRISIS_REPLY, 'crisis');
          return;
        }

        const rule = detectTopic(text);
        setLastTopicId(rule.id);
        setTopicIds((prev) => (prev.includes(rule.id) ? prev : [...prev, rule.id]));
        respond(history, rule);
      }, [thinking, messages, appendBot, respond]);

      const handleMood = useCallback((mood) => {
        const rule = getRule(mood.topicId);
        const history = [{ id: Date.now(), role: 'user', text: mood.label, time: now() }];
        setMessages(history);
        setLastTopicId(rule.id);
        setTopicIds([rule.id]);
        turnRef.current = 0;
        respond(history, rule);
      }, [respond]);

      const reset = useCallback(() => {
        setMessages([]);
        setInput('');
        setThinking(false);
        setLastTopicId(null);
        setTopicIds([]);
        setShowSummary(false);
        setNotice('');
        turnRef.current = 0;
      }, []);

      const quickReplies = useMemo(() => {
        if (thinking || !started) return [];
        return getRule(lastTopicId).quickReplies;
      }, [thinking, started, lastTopicId]);

      return (
        <div className="min-h-screen w-full flex items-center justify-center p-0 sm:p-6">
          <Card className="w-full max-w-2xl flex flex-col h-screen sm:h-[86vh] sm:min-h-[560px] overflow-hidden rounded-none sm:rounded-2xl">
            <Header
              onReset={reset}
              onSummary={() => setShowSummary(true)}
              canSummarize={userMessageCount > 0}
              mode={mode}
            />

            <main className="flex-1 overflow-y-auto scroll-soft px-4 py-5 space-y-4 bg-slate-50/70">
              {!started && <MoodPicker onSelect={handleMood} />}

              {messages.map((m) => <MessageBubble key={m.id} message={m} />)}

              {thinking && <TypingIndicator />}

              {notice && (
                <p className="text-center text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2">
                  {notice}
                </p>
              )}

              {showSummary && (
                <SummaryCard
                  topicIds={topicIds}
                  messageCount={messages.length}
                  onClose={() => setShowSummary(false)}
                />
              )}

              <div ref={bottomRef} />
            </main>

            <QuickReplies items={quickReplies} onPick={send} disabled={thinking} />
            <Composer value={input} onChange={setInput} onSend={send} disabled={thinking} />
          </Card>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return <CounselorPage />;
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
