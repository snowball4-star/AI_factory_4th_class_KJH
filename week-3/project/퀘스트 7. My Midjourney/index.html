function Button({ children, variant = 'primary', size = 'md', disabled = false, onClick, type = 'button', className = '', title }) {
  const base = 'inline-flex shrink-0 items-center justify-center gap-2 whitespace-nowrap rounded-xl font-semibold transition-all duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-fuchsia-400/70 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0a0a12] disabled:opacity-40 disabled:cursor-not-allowed';
  const variants = {

    danger: 'bg-rose-600/90 text-white hover:bg-rose-500 active:scale-[.98]',

  };
  const sizes = { sm: 'px-3 py-1.5 text-xs', md: 'px-4 py-2.5 text-sm', lg: 'px-6 py-3.5 text-base' };

      {children}
    </button>
  );
}

    </label>

}

function Modal({ isOpen, onClose, title, children, size = 'md' }) {
  useEffect(() => {
    if (!isOpen) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [isOpen, onClose]);

  if (!isOpen) return null;
  const sizes = { sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-2xl' };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label={title}>
      <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />

        </div>
        {children}
      </div>
    </div>
  );
}

function buildFinalPrompt(prompt, style, mood) {
  return [prompt.trim(), style && style.modifier, mood && mood.modifier, QUALITY_SUFFIX]
    .filter(Boolean)
    .join(', ');
}

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (_err) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (_err) { /* 저장 실패는 무시 */ }
}

// <img> 로 실제 로딩까지 끝난 뒤에 성공으로 간주한다.
function preloadImage(url, timeoutMs = 150000) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const timer = setTimeout(() => {
      img.src = '';
      reject(new Error('이미지를 받아오는 데 시간이 너무 오래 걸립니다. 잠시 후 다시 시도해 주세요.'));
    }, timeoutMs);
    img.onload = () => { clearTimeout(timer); resolve(url); };
    img.onerror = () => { clearTimeout(timer); reject(new Error('이미지 생성 서버가 응답하지 않았습니다. 프롬프트를 조금 바꿔 다시 시도해 보세요.')); };
    img.src = url;
  });
}

// 무료 엔진 — 브라우저의 <img> 요청으로만 호출한다(fetch 로 부르면 봇 차단에 걸린다).
async function generateWithFree({ finalPrompt, ratio, seed }) {
  const params = new URLSearchParams({
    width: String(ratio.w),
    height: String(ratio.h),
    seed: String(seed),
    model: 'flux',
    nologo: 'true',
    referrer: 'my-midjourney',
  });
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(finalPrompt)}?${params.toString()}`;
  await preloadImage(url);
  return url;
}

// fal.ai FLUX.1 [schnell]
async function generateWithFal({ finalPrompt, ratio, seed, apiKey }) {
  if (!apiKey) throw new Error('fal.ai API 키가 없습니다. 오른쪽 위 설정에서 키를 입력해 주세요.');

  let res;
  try {
    res = await fetch('https://fal.run/fal-ai/flux/schnell', {
      method: 'POST',
      headers: { 'Authorization': `Key ${apiKey}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: finalPrompt,
        image_size: { width: ratio.w, height: ratio.h },
        num_images: 1,
        num_inference_steps: 4,
        seed,
        enable_safety_checker: true,
      }),
    });
  } catch (_err) {
    throw new Error('fal.ai 서버에 연결하지 못했습니다. 네트워크 상태를 확인해 주세요.');
  }

  if (!res.ok) {
    let detail = '';
    try {
      const body = await res.json();
      detail = typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail || body);
    } catch (_err) {
      detail = await res.text().catch(() => '');
    }

    if (detail.indexOf('User is locked') !== -1 || detail.indexOf('TOP_UP') !== -1) {
      throw new Error('fal.ai 계정에 크레딧이 없어 잠겨 있습니다(TOP_UP). fal.ai 대시보드에서 결제 수단을 등록·충전한 뒤 다시 시도하거나, 위에서 “무료 엔진”을 선택해 주세요.');
    }
    if (res.status === 401 || res.status === 403) throw new Error(`fal.ai 인증에 실패했습니다 (${res.status}). API 키를 다시 확인해 주세요. ${detail}`);
    if (res.status === 422) throw new Error(`요청 값이 올바르지 않습니다. 프롬프트나 비율을 바꿔 보세요. ${detail}`);
    if (res.status === 429) throw new Error('요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.');
    throw new Error(`fal.ai 오류 (${res.status}) ${detail}`);
  }

  const data = await res.json();
  const url = data && data.images && data.images[0] && data.images[0].url;
  if (!url) throw new Error('응답에 이미지가 없습니다. 다시 시도해 주세요.');
  await preloadImage(url);
  return url;
}

async function downloadImage(url, filename) {
  try {
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objectUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 2000);
  } catch (_err) {
    // 교차 출처라 직접 저장이 막히면 새 탭으로 열어 준다(이미지 우클릭 → 저장).
    window.open(url, '_blank', 'noopener');
  }
}

            >
              <div className="text-lg leading-none" aria-hidden="true">{s.emoji}</div>
              <div className={`mt-2 text-xs font-bold ${active ? 'text-fuchsia-200' : 'text-slate-200'}`}>{s.name}</div>
              <div className="mt-0.5 text-[10px] leading-tight text-slate-500">{s.desc}</div>
            </button>
          );
        })}
      </div>
    </Card>
  );
}

function MoodPanel({ moodId, setMoodId, ratioId, setRatioId, disabled }) {
  return (
    <Card>
      <SectionTitle step="3">분위기 · 비율</SectionTitle>

      <div className="mb-4 flex flex-wrap gap-1.5">
        {MOOD_PRESETS.map((m) => {
          const active = m.id === moodId;
          return (
            <button
              key={m.id}
              type="button"
              disabled={disabled}
              aria-pressed={active}
              onClick={() => setMoodId(m.id)}
              className={`rounded-lg border px-3 py-1.5 text-xs font-medium transition disabled:opacity-40 ${
                active ? 'border-violet-400/70 bg-violet-500/20 text-violet-100' : 'border-white/10 bg-white/[.03] text-slate-400 hover:border-white/25 hover:text-slate-200'
              }`}
            >
              {m.name}
            </button>
          );
        })}
      </div>

      <div className="grid grid-cols-5 gap-1.5">
        {RATIOS.map((r) => {
          const active = r.id === ratioId;
          return (
            <button
              key={r.id}
              type="button"
              disabled={disabled}
              aria-pressed={active}
              title={r.name}
              onClick={() => setRatioId(r.id)}
              className={`flex flex-col items-center gap-1.5 rounded-lg border px-1 py-2 transition disabled:opacity-40 ${
                active ? 'border-violet-400/70 bg-violet-500/15' : 'border-white/10 bg-white/[.03] hover:border-white/25'
              }`}
            >
              <span
                className={`block rounded-[3px] border ${active ? 'border-violet-300 bg-violet-400/40' : 'border-slate-500'}`}
                style={{ width: Math.round(22 * Math.min(1, r.w / r.h)), height: Math.round(22 * Math.min(1, r.h / r.w)) }}
                aria-hidden="true"
              />
              <span className={`text-[10px] font-semibold ${active ? 'text-violet-200' : 'text-slate-500'}`}>{r.id}</span>
            </button>
          );
        })}
      </div>
    </Card>
  );
}

function ProviderPanel({ provider, setProvider, hasFalKey, disabled, onOpenSettings }) {
  return (
    <Card>
      <SectionTitle step="4">생성 엔진</SectionTitle>
      <div className="grid gap-2 sm:grid-cols-2">
        {Object.keys(PROVIDERS).map((key) => {
          const p = PROVIDERS[key];
          const active = p.id === provider;
          return (
            <button
              key={p.id}
              type="button"
              disabled={disabled}
              aria-pressed={active}
              onClick={() => setProvider(p.id)}
              className={`rounded-xl border p-3 text-left transition disabled:opacity-40 ${
                active ? 'border-emerald-400/60 bg-emerald-500/10' : 'border-white/10 bg-white/[.03] hover:border-white/25'
              }`}
            >
              <div className={`text-xs font-bold ${active ? 'text-emerald-200' : 'text-slate-200'}`}>{p.label}</div>
              <div className="mt-0.5 text-[10px] text-slate-500">{p.sub}</div>
            </button>
          );
        })}
      </div>
      {provider === 'fal' && !hasFalKey && (
        <p className="mt-3 text-[11px] text-amber-300">
          API 키가 비어 있습니다.{' '}
          <button type="button" onClick={onOpenSettings} className="underline hover:text-amber-200">설정에서 입력</button>
          하거나 무료 엔진을 사용하세요.
        </p>
      )}
    </Card>
  );
}

function FinalPromptPreview({ finalPrompt }) {
  const [open, setOpen] = useState(false);
  const [copied, setCopied] = useState(false);

  const copy = async () => {
    try {
      await navigator.clipboard.writeText(finalPrompt);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (_err) { /* 클립보드 접근이 막힌 환경 */ }
  };

  return (
    <div className="rounded-xl border border-white/10 bg-[#0a0a12]/90 p-3 backdrop-blur">
      <div className="flex items-center justify-between gap-2">
        <button type="button" onClick={() => setOpen((v) => !v)} className="flex items-center gap-1.5 text-[11px] font-semibold text-slate-400 transition hover:text-slate-200">
          <span className={`transition-transform ${open ? 'rotate-90' : ''}`} aria-hidden="true">▶</span>
          AI에게 실제로 보내는 프롬프트
        </button>
        <Button variant="ghost" size="sm" onClick={copy}>{copied ? '복사됨 ✓' : '복사'}</Button>
      </div>
      {open && <p className="mt-2 break-words font-mono text-[11px] leading-relaxed text-slate-400">{finalPrompt}</p>}
    </div>
  );
}

function ResultView({ status, error, image, ratio, onDownload, onCopyPrompt, onRetry }) {
  const aspect = `${ratio.w} / ${ratio.h}`;

  if (status === 'loading') {
    return (
      <div className="shimmer grid w-full place-items-center rounded-2xl border border-white/10 bg-white/[.03]" style={{ aspectRatio: aspect }}>
        <div className="flex flex-col items-center gap-3">
          <Spinner className="h-8 w-8 text-fuchsia-400" />
          <p className="text-sm font-semibold text-slate-300">그리는 중…</p>
          <p className="text-[11px] text-slate-500">보통 5~20초 정도 걸립니다</p>
        </div>
      </div>
    );
  }

  if (status === 'error') {
    return (
      <div className="grid w-full place-items-center rounded-2xl border border-rose-500/30 bg-rose-500/[.06] p-6" style={{ aspectRatio: aspect }}>
        <div className="max-w-md text-center">
          <div className="text-3xl" aria-hidden="true">⚠️</div>
          <p className="mt-3 text-sm font-semibold text-rose-200">이미지를 만들지 못했습니다</p>
          <p className="mt-2 text-xs leading-relaxed text-rose-300/80">{error}</p>
          <Button variant="secondary" size="sm" className="mt-4" onClick={onRetry}>다시 시도</Button>
        </div>
      </div>
    );
  }

  if (status === 'done' && image) {
    return (
      <figure className="float-in">
        <img
          src={image.url}
          alt={image.prompt}
          className="w-full rounded-2xl border border-white/10 bg-black/40 object-contain shadow-2xl shadow-black/50"
          style={{ aspectRatio: aspect }}
        />
        <figcaption className="mt-3 space-y-3">
          <div className="flex flex-wrap items-center gap-1.5">
            <Badge tone="accent">{image.styleName}</Badge>
            {image.moodName !== '자동' && <Badge>{image.moodName}</Badge>}
            <Badge>{image.ratioId}</Badge>
            <Badge>{PROVIDERS[image.provider].label}</Badge>
            <Badge>seed {image.seed}</Badge>
          </div>
          <p className="text-sm leading-relaxed text-slate-300">{image.prompt}</p>
          <div className="flex flex-wrap gap-2">
            <Button size="sm" onClick={onDownload}>⬇ 이미지 저장</Button>
            <Button variant="secondary" size="sm" onClick={onCopyPrompt}>프롬프트 복사</Button>
            <Button variant="ghost" size="sm" onClick={onRetry}>🎲 다른 버전 생성</Button>
          </div>
        </figcaption>
      </figure>
    );
  }

  return (
    <div className="grid w-full place-items-center rounded-2xl border border-dashed border-white/12 bg-white/[.02] p-6" style={{ aspectRatio: aspect }}>
      <div className="max-w-xs text-center">
        <div className="text-4xl" aria-hidden="true">🖼️</div>
        <p className="mt-3 text-sm font-semibold text-slate-300">아직 생성한 이미지가 없습니다</p>
        <p className="mt-1.5 text-xs leading-relaxed text-slate-500">
          왼쪽에서 프롬프트를 적고 마음에 드는 화풍을 고른 뒤<br />‘✨ 이미지 생성’을 눌러 보세요.
        </p>
      </div>
    </div>
  );
}

function Gallery({ items, currentId, onSelect, onClear }) {
  if (items.length === 0) return null;
  return (
    <Card className="mt-5">
      <div className="mb-3 flex items-center justify-between">
        <h2 className="text-sm font-bold text-slate-200">최근 생성 <span className="text-slate-500">({items.length})</span></h2>
        <Button variant="ghost" size="sm" onClick={onClear}>모두 지우기</Button>
      </div>
      <div className="scroll-thin flex gap-2.5 overflow-x-auto pb-2">
        {items.map((item) => (
          <button
            key={item.id}
            type="button"
            title={item.prompt}
            onClick={() => onSelect(item)}
            className={`h-20 w-20 shrink-0 overflow-hidden rounded-xl border transition ${
              item.id === currentId ? 'border-fuchsia-500 ring-2 ring-fuchsia-500/40' : 'border-white/10 hover:border-white/40'
            }`}
          >
            <img src={item.url} alt={item.prompt} className="h-full w-full object-cover" loading="lazy" />
          </button>
        ))}
      </div>
    </Card>
  );
}

function SettingsModal({ isOpen, onClose, falKey, setFalKey }) {
  const [draft, setDraft] = useState(falKey);
  useEffect(() => { if (isOpen) setDraft(falKey); }, [isOpen, falKey]);

  return (
    <Modal isOpen={isOpen} onClose={onClose} title="설정">
      <div className="space-y-4">
        <Input
          label="fal.ai API 키"
          value={draft}
          onChange={setDraft}
          placeholder="key_id:key_secret"
          hint="브라우저의 localStorage 에만 저장되며 fal.ai 외의 어디에도 전송되지 않습니다."
        />
        <div className="rounded-xl border border-amber-500/25 bg-amber-500/[.07] p-3 text-[11px] leading-relaxed text-amber-200/90">
          <p className="font-semibold">⚠️ 학습용 프로젝트 안내</p>
          <p className="mt-1">
            이 앱은 빌드 도구 없이 동작하는 단일 HTML 파일이라 API 키가 브라우저에 그대로 노출됩니다.
            실제 서비스로 배포할 때는 키를 서버 환경변수에 두고 백엔드 프록시를 거쳐 호출하세요.
          </p>
        </div>
        <div className="flex justify-end gap-2">
          <Button variant="ghost" onClick={onClose}>취소</Button>
          <Button onClick={() => { setFalKey(draft.trim()); onClose(); }}>저장</Button>
        </div>
      </div>
    </Modal>
  );
}

// ========================================
// 🚀 App
// ========================================

function App() {
  const [prompt, setPrompt] = useState('');
  const [styleId, setStyleId] = useState(STYLE_PRESETS[0].id);
  const [moodId, setMoodId] = useState('auto');
  const [ratioId, setRatioId] = useState('1:1');
  const [provider, setProvider] = useState('free');

  const [status, setStatus] = useState('idle'); // idle | loading | done | error
  const [error, setError] = useState('');
  const [image, setImage] = useState(null);
  const [gallery, setGallery] = useState(() => loadJSON(STORAGE_KEY_GALLERY, []));
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [falKey, setFalKey] = useState(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY_FAL);
      return saved === null ? DEFAULT_FAL_KEY : saved;
    } catch (_err) {
      return DEFAULT_FAL_KEY;
    }
  });
  const [toast, setToast] = useState('');

  const requestRef = useRef(0);

  const style = useMemo(() => STYLE_PRESETS.find((s) => s.id === styleId), [styleId]);
  const mood = useMemo(() => MOOD_PRESETS.find((m) => m.id === moodId), [moodId]);
  const ratio = useMemo(() => RATIOS.find((r) => r.id === ratioId), [ratioId]);
  const finalPrompt = useMemo(() => buildFinalPrompt(prompt, style, mood), [prompt, style, mood]);

  // 결과 영역은 방금 만든 이미지의 비율을 따른다(옵션만 바꿔도 결과가 찌그러지지 않도록).
  const viewRatio = (status === 'done' && image && RATIOS.find((r) => r.id === image.ratioId)) || ratio;

  useEffect(() => { saveJSON(STORAGE_KEY_GALLERY, gallery); }, [gallery]);
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY_FAL, falKey); } catch (_err) { /* 무시 */ }
  }, [falKey]);

  const showToast = useCallback((message) => {
    setToast(message);
    setTimeout(() => setToast(''), 1800);
  }, []);

  const generate = useCallback(async () => {
    if (!prompt.trim()) {
      setError('프롬프트를 먼저 입력해 주세요.');
      setStatus('error');
      return;
    }

    const ticket = ++requestRef.current;
    const seed = Math.floor(Math.random() * 1000000);
    setStatus('loading');
    setError('');

    try {
      const args = { finalPrompt, ratio, seed };
      const url = provider === 'fal'
        ? await generateWithFal({ ...args, apiKey: falKey.trim() })
        : await generateWithFree(args);

      if (ticket !== requestRef.current) return; // 더 최근 요청이 있으면 결과를 버린다

      const record = {
        id: `${Date.now()}-${seed}`,
        url,
        prompt: prompt.trim(),
        finalPrompt,
        styleName: style.name,
        moodName: mood.name,
        ratioId: ratio.id,
        provider,
        seed,
        createdAt: new Date().toISOString(),
      };
      setImage(record);
      setStatus('done');
      setGallery((prev) => [record].concat(prev).slice(0, 24));
    } catch (err) {
      if (ticket !== requestRef.current) return;
      setError(err.message || '알 수 없는 오류가 발생했습니다.');
      setStatus('error');
    }
  }, [prompt, finalPrompt, ratio, provider, falKey, style, mood]);

  const handleDownload = useCallback(() => {
    if (!image) return;
    downloadImage(image.url, `my-midjourney-${image.seed}.jpg`);
  }, [image]);

  const handleCopyPrompt = useCallback(async () => {
    if (!image) return;
    try {
      await navigator.clipboard.writeText(image.finalPrompt);
      showToast('프롬프트를 복사했습니다');
    } catch (_err) {
      showToast('복사에 실패했습니다');
    }
  }, [image, showToast]);

  const handleSelectFromGallery = useCallback((item) => {
    setImage(item);
    setStatus('done');
    setError('');
  }, []);

  const handleClearGallery = useCallback(() => {
    setGallery([]);
    showToast('갤러리를 비웠습니다');
  }, [showToast]);

  const busy = status === 'loading';

  return (
    <div className="min-h-screen">
      <Header onOpenSettings={() => setSettingsOpen(true)} provider={provider} />

      <main className="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:py-8">
        <div className="grid gap-5 lg:grid-cols-5">

          {/* ── 왼쪽: 입력 패널 ───────────────────────── */}
          <section className="space-y-4 lg:col-span-2" aria-label="이미지 생성 옵션">
            <PromptPanel prompt={prompt} setPrompt={setPrompt} disabled={busy} />
            <StylePanel styleId={styleId} setStyleId={setStyleId} disabled={busy} />
            <MoodPanel moodId={moodId} setMoodId={setMoodId} ratioId={ratioId} setRatioId={setRatioId} disabled={busy} />
            <ProviderPanel
              provider={provider}
              setProvider={setProvider}
              hasFalKey={!!falKey.trim()}
              disabled={busy}
              onOpenSettings={() => setSettingsOpen(true)}
            />

            {/* 아래로 스크롤해도 생성 버튼은 항상 손 닿는 곳에 둔다 */}
            <div className="sticky bottom-0 space-y-3 bg-gradient-to-t from-[#0a0a12] via-[#0a0a12]/95 to-transparent py-4">
              <Button size="lg" className="w-full" onClick={generate} disabled={busy || !prompt.trim()}>
                {busy ? <React.Fragment><Spinner /> 생성 중…</React.Fragment> : '✨ 이미지 생성'}
              </Button>
              {prompt.trim() && <FinalPromptPreview finalPrompt={finalPrompt} />}
            </div>
          </section>

          {/* ── 오른쪽: 결과 ─────────────────────────── */}
          {/* 옵션을 스크롤해도 결과 이미지는 계속 보이도록 데스크톱에서 고정한다 */}
          <section className="lg:sticky lg:top-24 lg:col-span-3 lg:self-start" aria-label="생성 결과" aria-live="polite">
            <ResultView
              status={status}
              error={error}
              image={image}
              ratio={viewRatio}
              onDownload={handleDownload}
              onCopyPrompt={handleCopyPrompt}
              onRetry={generate}
            />
            <Gallery
              items={gallery}
              currentId={image && image.id}
              onSelect={handleSelectFromGallery}
              onClear={handleClearGallery}
            />
          </section>
        </div>
      </main>

      <footer className="border-t border-white/10 py-6 text-center text-[11px] text-slate-600">
        My Midjourney · 화풍과 분위기를 골라 만드는 AI 이미지 스튜디오 — 단일 HTML 학습용 프로젝트
      </footer>

      <SettingsModal isOpen={settingsOpen} onClose={() => setSettingsOpen(false)} falKey={falKey} setFalKey={setFalKey} />

      {toast && (
        <div className="float-in fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-full border border-white/15 bg-[#1a1a2b] px-4 py-2 text-xs text-slate-200 shadow-xl" role="status">
          {toast}
        </div>
      )}
    </div>
  );
}

// ========================================
// Rendering
// ========================================
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
