    // ========================================
    // 🔀 Router (hash-based)
    // ========================================
    const RouterContext = createContext({ path: '/', query: {}, navigate: () => {} });
    const useRouter = () => useContext(RouterContext);

    const parseHash = () => {
      const raw = window.location.hash.replace(/^#/, '') || '/';
      const [path, qs] = raw.split('?');
      const query = {};
      new URLSearchParams(qs || '').forEach((v, k) => { query[k] = v; });
      return { path: path || '/', query };
    };

    function Router({ children }) {
      const [route, setRoute] = useState(parseHash);

      useEffect(() => {
        const onChange = () => { setRoute(parseHash()); window.scrollTo(0, 0); };
        window.addEventListener('hashchange', onChange);
        return () => window.removeEventListener('hashchange', onChange);
      }, []);

      const navigate = useCallback((to) => {
        if (('#' + to) === window.location.hash) { setRoute(parseHash()); window.scrollTo(0, 0); }
        else window.location.hash = to;
      }, []);

      return (
        <RouterContext.Provider value={{ path: route.path, query: route.query, navigate }}>
          {children}
        </RouterContext.Provider>
      );
    }

    function Route() { return null; }

    function Routes({ children }) {
      const { path } = useRouter();
      const routes = React.Children.toArray(children);
      const matched = routes.find(r => r.props.path === path) || routes.find(r => r.props.path === '*');
      return matched ? matched.props.element : null;
    }

      return (

          aria-current={active ? 'page' : undefined}
          onClick={(e) => { e.preventDefault(); navigate(to); }}
          className={className}
          {...props}

          {typeof children === 'function' ? children(active) : children}
        </a>
      );

    // 📄 Page — 전체 글 탐색

    const SORTS = [
      { value: 'date-desc', label: '최신순' },
      { value: 'date-asc', label: '오래된순' },
      { value: 'views-desc', label: '조회수 많은순' },
      { value: 'comments-desc', label: '댓글 많은순' },
      { value: 'likes-desc', label: '좋아요 많은순' },
    ];
    const PER_PAGE = 40;

    function ArticlesPage() {
      const { query } = useRouter();
      const [keyword, setKeyword] = useState('');
      const [board, setBoard] = useState('all');
      const [year, setYear] = useState(query.year || 'all');
      const [sort, setSort] = useState('date-desc');
      const [page, setPage] = useState(1);

      // 해시 쿼리(?year=2023)로 진입하면 연도 필터를 맞춰준다
      useEffect(() => { setYear(query.year || 'all'); setPage(1); }, [query.year]);
      useEffect(() => { setPage(1); }, [keyword, board, year, sort]);

      const filtered = useMemo(() => {
        const kw = keyword.trim().toLowerCase();
        const [key, dir] = sort.split('-');
        return ARTICLES
          .filter(a => (board === 'all' || a.board === board))
          .filter(a => (year === 'all' || a.date.startsWith(year)))
          .filter(a => (!kw || a.title.toLowerCase().includes(kw)))
          .sort((x, y) => {
            if (key === 'date') return dir === 'desc' ? y.date.localeCompare(x.date) : x.date.localeCompare(y.date);
            return y[key] - x[key] || y.date.localeCompare(x.date);
          });
      }, [keyword, board, year, sort]);

      const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
      const current = Math.min(page, totalPages);
      const pageItems = filtered.slice((current - 1) * PER_PAGE, current * PER_PAGE);
      const filteredViews = sumBy(filtered, 'views');
      const filteredComments = sumBy(filtered, 'comments');
      const isFiltered = keyword.trim() || board !== 'all' || year !== 'all';

      const reset = () => { setKeyword(''); setBoard('all'); setYear('all'); setSort('date-desc'); };

      const pageNumbers = useMemo(() => {
        const around = 2;
        const set = new Set([1, totalPages]);
        for (let i = current - around; i <= current + around; i++) if (i >= 1 && i <= totalPages) set.add(i);
        return [...set].sort((a, b) => a - b);
      }, [current, totalPages]);

      return (
        <Page>
          <SectionTitle
            eyebrow="Explorer"
            title={'전체 글 ' + nf(TOTAL) + '건 탐색'}
            desc="제목 검색과 게시판 · 연도 필터, 정렬을 조합해 원하는 글을 찾을 수 있습니다. 글 제목을 누르면 네이버 카페 원문이 새 탭에서 열립니다."
          />

          <Card className="mb-6 p-4 sm:p-5">
            <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
              <Input
                label="제목 검색"
                type="search"
                value={keyword}
                onChange={(e) => setKeyword(e.target.value)}
                placeholder="예: 튜너, 바흐, 이사"
                className="lg:col-span-1"
              />
              <Select
                label="게시판"
                value={board}
                onChange={(e) => setBoard(e.target.value)}
                options={[{ value: 'all', label: '전체 게시판' }, ...BOARDS.map(b => ({ value: b, label: b }))]}
              />
              <Select
                label="연도"
                value={year}
                onChange={(e) => setYear(e.target.value)}
                options={[{ value: 'all', label: '전체 기간' }, ...YEARS.map(y => ({ value: y, label: y + '년' }))]}
              />
              <Select label="정렬" value={sort} onChange={(e) => setSort(e.target.value)} options={SORTS} />
            </div>

            <div className="mt-4 flex flex-wrap items-center justify-between gap-3 border-t border-white/5 pt-4">
              <p className="text-sm text-slate-400">
                <strong className="font-semibold text-amber-300">{nf(filtered.length)}건</strong>
                <span className="text-slate-600"> / {nf(TOTAL)}건</span>
                <span className="ml-3 text-xs text-slate-500">조회 {nf(filteredViews)} · 댓글 {nf(filteredComments)}</span>
              </p>
              {isFiltered && <Button variant="ghost" size="sm" onClick={reset}>필터 초기화 ✕</Button>}
            </div>
          </Card>

          <ArticleList articles={pageItems} />

          {totalPages > 1 && (
            <nav className="mt-6 flex flex-wrap items-center justify-center gap-1.5" aria-label="페이지네이션">
              <Button variant="secondary" size="sm" disabled={current === 1} onClick={() => setPage(current - 1)}>← 이전</Button>
              {pageNumbers.map((p, i) => (
                <React.Fragment key={p}>
                  {i > 0 && pageNumbers[i - 1] !== p - 1 && <span className="px-1 text-xs text-slate-600">…</span>}
                  <button
                    onClick={() => setPage(p)}
                    aria-current={p === current ? 'page' : undefined}
                    className={'h-8 min-w-[2rem] rounded-lg px-2 text-xs font-semibold tabular-nums transition-colors ' +
                      (p === current ? 'bg-amber-500 text-slate-950' : 'bg-white/5 text-slate-400 ring-1 ring-white/10 hover:text-slate-100')}
                  >
                    {p}
                  </button>
                </React.Fragment>
              ))}
              <Button variant="secondary" size="sm" disabled={current === totalPages} onClick={() => setPage(current + 1)}>다음 →</Button>
            </nav>
          )}
        </Page>
      );

              desc="색이 진할수록 그 달에 글이 많았습니다. 이사와 기기 교체가 잦았던 시기에 글도 몰려 있습니다." />

                  <tr className="border-b border-white/10 text-xs text-slate-500">

          <div className="grid gap-6 lg:grid-cols-[1.3fr_1fr]">
            <Card className="p-5 sm:p-7">
              <ol className="space-y-7">

                <Route path="/" element={<OverviewPage />} />
                <Route path="/articles" element={<ArticlesPage />} />
                <Route path="/insights" element={<InsightsPage />} />
                <Route path="/method" element={<MethodPage />} />
                <Route path="*" element={<NotFoundPage />} />
              </Routes>
            </div>
            <Footer />
          </div>
        </Router>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
