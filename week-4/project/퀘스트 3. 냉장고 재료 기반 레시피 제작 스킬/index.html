<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>냉장고 재료 기입기</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- 모든 CDN 은 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .fade-in { animation: fadeIn .18s ease-out; }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ========================================
    // 📦 Constants & Domain Helpers
    // ========================================

    const CATEGORIES = ['채소', '과일', '육류', '해산물', '유제품', '달걀', '곡물·면', '양념', '가공식품', '음료', '기타'];
    const UNITS = ['개', 'g', 'kg', 'ml', 'L', '대', '쪽', '봉', '팩', '모', '줌', '공기', '단'];
    const STORAGES = ['냉장', '냉동', '실온'];

    const CATEGORY_STYLE = {
      '채소': 'bg-emerald-100 text-emerald-700',
      '과일': 'bg-rose-100 text-rose-700',
      '육류': 'bg-red-100 text-red-700',
      '해산물': 'bg-sky-100 text-sky-700',
      '유제품': 'bg-amber-100 text-amber-700',
      '달걀': 'bg-yellow-100 text-yellow-700',
      '곡물·면': 'bg-orange-100 text-orange-700',
      '양념': 'bg-purple-100 text-purple-700',
      '가공식품': 'bg-indigo-100 text-indigo-700',
      '음료': 'bg-cyan-100 text-cyan-700',
      '기타': 'bg-slate-200 text-slate-700',
    };

    const todayISO = () => {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    };

    // SKILL.md 의 파일명 규칙과 동일: 금지문자 제거, 공백은 _
    const toFileStem = (name) => name.trim().replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_');

    // SKILL.md 의 재료 JSON 스키마와 정확히 일치해야 한다
    const makeIngredient = (form) => ({
      id: toFileStem(form.name),
      name: form.name.trim(),
      category: form.category,
      quantity: Number(form.quantity) || 1,
      unit: form.unit,
      storage: form.storage,
      purchasedOn: form.purchasedOn || todayISO(),
      expiresOn: form.expiresOn || null,
      note: form.note.trim(),
      updatedAt: new Date().toISOString(),
    });

    // 유통기한까지 남은 일수. 기한이 없으면 null
    const daysLeft = (expiresOn) => {
      if (!expiresOn) return null;
      const end = new Date(expiresOn + 'T00:00:00');
      const now = new Date(todayISO() + 'T00:00:00');
      return Math.round((end - now) / 86400000);
    };

    const expiryLabel = (d) => {
      if (d === null) return { text: '기한 미입력', tone: 'bg-slate-100 text-slate-500' };
      if (d < 0) return { text: `❌ ${-d}일 지남`, tone: 'bg-red-100 text-red-700' };
      if (d === 0) return { text: '⚠️ 오늘까지', tone: 'bg-red-100 text-red-700' };
      if (d <= 2) return { text: `⚠️ D-${d}`, tone: 'bg-amber-100 text-amber-800' };
      return { text: `D-${d}`, tone: 'bg-slate-100 text-slate-600' };
    };

    // 파일 쓰기는 server.js 가 한다. 상대 경로라 어디에 배포해도 그대로 동작한다.
    const API_BASE_URL = '/api';

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', className = '', ...props }) {
      const variants = {
        primary: 'bg-slate-900 text-white hover:bg-slate-700 disabled:bg-slate-300',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 disabled:text-slate-300',
        danger: 'bg-white text-red-600 border border-red-200 hover:bg-red-50',
        ghost: 'text-slate-500 hover:text-slate-900 hover:bg-slate-100',
      };
      const sizes = { sm: 'px-2.5 py-1 text-xs', md: 'px-4 py-2 text-sm', lg: 'px-6 py-3 text-base' };
      return (
        <button
          className={`rounded-lg font-medium transition-colors disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
          {...props}
        />
      );
    }

    function Field({ label, hint, children }) {
      return (
        <label className="block">
          <span className="mb-1 block text-xs font-semibold text-slate-600">{label}</span>
          {children}
          {hint && <span className="mt-1 block text-xs text-slate-400">{hint}</span>}
        </label>
      );
    }

    const CONTROL = 'w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-900 disabled:bg-slate-50';

    const Input = React.forwardRef(function Input({ className = '', ...props }, ref) {
      return <input ref={ref} className={`${CONTROL} ${className}`} {...props} />;
    });

    function Select({ options, className = '', ...props }) {
      return (
        <select className={`${CONTROL} ${className}`} {...props}>
          {options.map((o) => <option key={o} value={o}>{o}</option>)}
        </select>
      );
    }

    function Card({ className = '', children }) {
      return <div className={`rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200 ${className}`}>{children}</div>;
    }

    function Badge({ tone = 'bg-slate-100 text-slate-600', children }) {
      return <span className={`inline-block rounded-full px-2 py-0.5 text-xs font-medium ${tone}`}>{children}</span>;
    }

    function Toast({ message }) {
      if (!message) return null;
      const tone = message.type === 'error' ? 'bg-red-600' : 'bg-slate-900';
      return (
        <div className={`fade-in fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-full px-5 py-2.5 text-sm text-white shadow-lg ${tone}`} role="status">
          {message.text}
        </div>
      );
    }

    // ========================================
    // 🗄 Fridge Storage (server.js 가 fridge/ingredients/ 에 파일로 쓴다)
    // ========================================

    async function callApi(pathname, options) {
      const res = await fetch(`${API_BASE_URL}${pathname}`, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `요청이 실패했다 (${res.status})`);
      return data;
    }

    function useFridge(notify) {
      const [items, setItems] = useState([]);
      const [dir, setDir] = useState('');
      const [loading, setLoading] = useState(true);
      const [offline, setOffline] = useState(false);

      const refresh = useCallback(async () => {
        setLoading(true);
        try {
          const { items } = await callApi('/ingredients');
          setItems(items);
          setOffline(false);
        } catch (e) {
          setOffline(true);
          notify('서버에 연결하지 못했다: ' + e.message, 'error');
        } finally {
          setLoading(false);
        }
      }, [notify]);

      // 저장 폴더 경로와 첫 목록을 함께 받아 온다
      useEffect(() => {
        let alive = true;
        (async () => {
          try {
            const config = await callApi('/config');
            if (alive) setDir(config.dir);
          } catch (e) {
            // 폴더 경로는 화면 표시용일 뿐이라, 실패해도 목록 조회는 계속한다
            console.warn('저장 폴더 경로를 받지 못했다:', e.message);
          }
          if (alive) await refresh();
        })();
        return () => { alive = false; };
      }, [refresh]);

      const write = useCallback(async (ing) => {
        await callApi('/ingredients', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(ing),
        });
        await refresh();
      }, [refresh]);

      const remove = useCallback(async (ing) => {
        await callApi(`/ingredients/${encodeURIComponent(ing.id)}`, { method: 'DELETE' });
        await refresh();
      }, [refresh]);

      return { items, dir, loading, offline, refresh, write, remove };
    }

    // ========================================
    // 🧩 Layout & List Components
    // ========================================

    function Header({ dir, count, onRefresh, loading }) {
      return (
        <header className="border-b border-slate-200 bg-white">
          <div className="mx-auto flex max-w-5xl flex-col gap-3 px-4 py-5 sm:flex-row sm:items-center sm:justify-between">
            <div className="min-w-0">
              <h1 className="text-xl font-bold text-slate-900">🧊 냉장고 재료 기입기</h1>
              <p className="mt-0.5 truncate text-sm text-slate-500">
                재료 하나당 JSON 파일 하나 →{' '}
                <code className="rounded bg-slate-100 px-1">{dir || 'fridge/ingredients/'}</code>
              </p>
            </div>
            <div className="flex shrink-0 items-center gap-2">
              <span className="hidden text-xs text-slate-500 sm:inline">재료 {count}개</span>
              <Button variant="secondary" size="sm" onClick={onRefresh} disabled={loading}>새로고침</Button>
            </div>
          </div>
        </header>
      );
    }

    function OfflineNotice({ offline }) {
      if (!offline) return null;
      return (
        <div className="rounded-xl bg-amber-50 p-4 text-sm text-amber-900 ring-1 ring-amber-200">
          <strong className="font-semibold">서버가 꺼져 있다.</strong>
          <p className="mt-1">
            이 페이지를 파일로 직접 열면 파일을 저장할 수 없다. 퀘스트 폴더에서
            <code className="mx-1 rounded bg-amber-100 px-1">npm start</code>
            를 실행한 뒤 <code className="rounded bg-amber-100 px-1">http://localhost:3000</code> 으로 접속한다.
          </p>
        </div>
      );
    }

    function EmptyState() {
      return (
        <div className="rounded-2xl border-2 border-dashed border-slate-300 p-10 text-center">
          <p className="text-4xl">🧺</p>
          <p className="mt-3 font-semibold text-slate-700">냉장고가 비었다.</p>
          <p className="mt-1 text-sm text-slate-500">왼쪽 폼으로 첫 재료를 넣어 보자.</p>
        </div>
      );
    }

    function IngredientRow({ item, onEdit, onDelete, onUse }) {
      const d = daysLeft(item.expiresOn);
      const exp = expiryLabel(d);
      const urgent = d !== null && d <= 2;

      return (
        <li className={`flex flex-wrap items-center gap-x-3 gap-y-2 px-4 py-3 ${urgent ? 'bg-amber-50/60' : ''}`}>
          <div className="min-w-0 flex-1">
            <div className="flex flex-wrap items-center gap-2">
              <span className="font-semibold text-slate-900">{item.name}</span>
              <Badge tone={CATEGORY_STYLE[item.category] || CATEGORY_STYLE['기타']}>{item.category}</Badge>
              <Badge tone={exp.tone}>{exp.text}</Badge>
            </div>
            {item.note && <p className="mt-0.5 truncate text-xs text-slate-500">{item.note}</p>}
          </div>
          <div className="w-24 text-right text-sm tabular-nums text-slate-700">{item.quantity}{item.unit}</div>
          <div className="w-12 text-right text-xs text-slate-400">{item.storage}</div>
          <div className="flex gap-1">
            <Button variant="ghost" size="sm" onClick={() => onUse(item, 1)} title="1단위 소진">−1</Button>
            <Button variant="ghost" size="sm" onClick={() => onEdit(item)}>수정</Button>
            <Button variant="danger" size="sm" onClick={() => onDelete(item)}>삭제</Button>
          </div>
        </li>
      );
    }

    function IngredientList({ items, onEdit, onDelete, onUse }) {
      // 유통기한 임박 순 → 분류 순 → 이름 순. 기한 미입력은 뒤로 민다
      const sorted = useMemo(() => {
        const rank = (x) => (x.expiresOn ? daysLeft(x.expiresOn) : 9999);
        return [...items].sort((a, b) =>
          rank(a) - rank(b) ||
          CATEGORIES.indexOf(a.category) - CATEGORIES.indexOf(b.category) ||
          a.name.localeCompare(b.name, 'ko')
        );
      }, [items]);

      if (sorted.length === 0) return <EmptyState />;

      const urgentCount = sorted.filter((x) => {
        const d = daysLeft(x.expiresOn);
        return d !== null && d <= 2;
      }).length;

      return (
        <Card className="p-0">
          <div className="flex items-center justify-between border-b border-slate-200 px-4 py-3">
            <h2 className="text-sm font-semibold text-slate-700">보유 재료 {sorted.length}개</h2>
            {urgentCount > 0 && <Badge tone="bg-amber-100 text-amber-800">빨리 먹어야 할 것 {urgentCount}개</Badge>}
          </div>
          <ul className="divide-y divide-slate-100">
            {sorted.map((item) => (
              <IngredientRow key={item.id} item={item} onEdit={onEdit} onDelete={onDelete} onUse={onUse} />
            ))}
          </ul>
        </Card>
      );
    }

    // ========================================
    // 📄 Ingredient Form
    // ========================================

    const BLANK = {
      name: '', category: '채소', quantity: '1', unit: '개',
      storage: '냉장', purchasedOn: todayISO(), expiresOn: '', note: '',
    };

    function IngredientForm({ items, editing, onSubmit, onCancelEdit, disabled }) {
      const [form, setForm] = useState(BLANK);
      const [error, setError] = useState('');
      const nameRef = useRef(null);

      useEffect(() => {
        if (!editing) return;
        setForm({
          name: editing.name,
          category: editing.category,
          quantity: String(editing.quantity),
          unit: editing.unit,
          storage: editing.storage,
          purchasedOn: editing.purchasedOn || todayISO(),
          expiresOn: editing.expiresOn || '',
          note: editing.note || '',
        });
        setError('');
        if (nameRef.current) nameRef.current.focus();
      }, [editing]);

      const set = (key) => (e) => setForm((f) => ({ ...f, [key]: e.target.value }));

      // 같은 이름이 이미 있으면 새 파일을 만들지 않고 그 파일을 갱신한다
      const duplicate = useMemo(() => {
        const stem = toFileStem(form.name);
        if (!stem || (editing && editing.id === stem)) return null;
        return items.find((x) => x.id === stem) || null;
      }, [form.name, items, editing]);

      const submit = (e) => {
        e.preventDefault();
        if (!form.name.trim()) { setError('재료 이름을 입력한다.'); return; }
        if (Number(form.quantity) <= 0) { setError('수량은 0보다 커야 한다.'); return; }
        if (form.expiresOn && form.purchasedOn && form.expiresOn < form.purchasedOn) {
          setError('유통기한이 구입일보다 빠르다.');
          return;
        }
        setError('');
        onSubmit(makeIngredient(form), duplicate);
        setForm({ ...BLANK, purchasedOn: form.purchasedOn, storage: form.storage });
        if (nameRef.current) nameRef.current.focus();
      };

      return (
        <Card>
          <div className="mb-4 flex items-center justify-between">
            <h2 className="text-sm font-semibold text-slate-700">{editing ? '재료 수정' : '재료 추가'}</h2>
            {editing && <Button variant="ghost" size="sm" onClick={onCancelEdit}>취소</Button>}
          </div>

          <form onSubmit={submit} className="space-y-3">
            <Field
              label="재료 이름"
              hint={duplicate ? `이미 있는 재료다. 저장하면 ${duplicate.name}.json 에 수량이 합쳐진다.` : null}
            >
              <Input ref={nameRef} value={form.name} onChange={set('name')} placeholder="예: 대파" disabled={disabled} />
            </Field>

            <div className="grid grid-cols-2 gap-3">
              <Field label="수량">
                <Input type="number" min="0" step="any" value={form.quantity} onChange={set('quantity')} disabled={disabled} />
              </Field>
              <Field label="단위">
                <Select options={UNITS} value={form.unit} onChange={set('unit')} disabled={disabled} />
              </Field>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <Field label="분류">
                <Select options={CATEGORIES} value={form.category} onChange={set('category')} disabled={disabled} />
              </Field>
              <Field label="보관">
                <Select options={STORAGES} value={form.storage} onChange={set('storage')} disabled={disabled} />
              </Field>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <Field label="구입일">
                <Input type="date" value={form.purchasedOn} onChange={set('purchasedOn')} disabled={disabled} />
              </Field>
              <Field label="유통기한" hint="모르면 비워 둔다">
                <Input type="date" value={form.expiresOn} onChange={set('expiresOn')} disabled={disabled} />
              </Field>
            </div>

            <Field label="메모">
              <Input value={form.note} onChange={set('note')} placeholder="예: 반 단 남음" disabled={disabled} />
            </Field>

            {error && <p className="text-xs font-medium text-red-600" role="alert">{error}</p>}

            <Button type="submit" size="lg" className="w-full" disabled={disabled}>
              {editing ? '수정 저장' : 'JSON 파일로 저장'}
            </Button>
          </form>
        </Card>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================

    function App() {
      const [toast, setToast] = useState(null);
      const [editing, setEditing] = useState(null);

      const notify = useCallback((text, type = 'info') => setToast({ text, type }), []);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2600);
        return () => clearTimeout(t);
      }, [toast]);

      const { items, dir, loading, offline, refresh, write, remove } = useFridge(notify);

      const handleSubmit = async (ing, duplicate) => {
        try {
          // 같은 재료를 다시 넣으면 수량을 더한다 (단위가 같을 때만)
          const merge = duplicate && duplicate.unit === ing.unit;
          const next = merge
            ? { ...ing, quantity: duplicate.quantity + ing.quantity, purchasedOn: duplicate.purchasedOn }
            : ing;
          await write(next);
          setEditing(null);
          notify(merge ? `${ing.name} 수량을 ${next.quantity}${ing.unit} 로 합쳤다.` : `${ing.name}.json 을 저장했다.`);
        } catch (e) {
          notify('저장에 실패했다: ' + e.message, 'error');
        }
      };

      const handleDelete = async (item) => {
        if (!window.confirm(`${item.name} 을(를) 냉장고에서 뺀다. JSON 파일이 삭제된다.`)) return;
        try {
          await remove(item);
          if (editing && editing.id === item.id) setEditing(null);
          notify(`${item.name} 을(를) 뺐다.`);
        } catch (e) {
          notify('삭제에 실패했다: ' + e.message, 'error');
        }
      };

      // 수량이 0 이하가 되면 빈 껍데기를 남기지 않고 파일을 지운다
      const handleUse = async (item, amount) => {
        const left = item.quantity - amount;
        try {
          if (left <= 0) {
            await remove(item);
            notify(`${item.name} 을(를) 다 썼다. 파일을 지웠다.`);
          } else {
            await write({ ...item, quantity: left, updatedAt: new Date().toISOString() });
            notify(`${item.name} ${left}${item.unit} 남음.`);
          }
        } catch (e) {
          notify('수정에 실패했다: ' + e.message, 'error');
        }
      };

      return (
        <div className="min-h-screen">
          <Header dir={dir} count={items.length} onRefresh={refresh} loading={loading} />

          <main className="mx-auto max-w-5xl space-y-5 px-4 py-6">
            <OfflineNotice offline={offline} />

            <div className="grid gap-5 lg:grid-cols-[20rem_1fr]">
              <IngredientForm
                items={items}
                editing={editing}
                onSubmit={handleSubmit}
                onCancelEdit={() => setEditing(null)}
                disabled={offline}
              />

              {loading ? (
                <Card className="flex items-center justify-center py-16 text-sm text-slate-400">재료를 읽는 중…</Card>
              ) : (
                <IngredientList items={items} onEdit={setEditing} onDelete={handleDelete} onUse={handleUse} />
              )}
            </div>

            <p className="pb-4 text-center text-xs text-slate-400">
              재료를 다 넣었으면 Claude Code 에서 <code className="rounded bg-slate-200 px-1 text-slate-600">/recipe</code> 로 레시피를 추천받는다.
            </p>
          </main>

          <Toast message={toast} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
