    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children, ...rest }) {
      const base = 'inline-flex items-center justify-center gap-2 rounded-full font-medium tracking-tight transition-all duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/60 disabled:opacity-30 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-white text-black hover:bg-white/90 active:scale-[.97]',
        secondary: 'bg-white/10 text-white ring-1 ring-white/20 backdrop-blur hover:bg-white/20 active:scale-[.97]',
        danger: 'bg-red-500 text-white hover:bg-red-600 active:scale-[.97]',
        ghost: 'bg-transparent text-white/60 hover:text-white hover:bg-white/10',
      };
      const sizes = { sm: 'px-3 py-1.5 text-xs', md: 'px-5 py-2.5 text-sm', lg: 'px-7 py-3.5 text-base' };
      return (
        <button type="button" onClick={onClick} disabled={disabled}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...rest}>
          {children}
        </button>
      );
    }

    function Badge({ tone = 'light', className = '', children }) {
      const tones = {
        light: 'bg-black/5 text-black/70 ring-black/10',
        dark: 'bg-white/10 text-white/80 ring-white/20 backdrop-blur',
      };
      return (
        <span className={`inline-flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-xs font-medium tracking-tight ring-1 ${tones[tone]} ${className}`}>
          {children}
        </span>
      );
    }

    function Card({ className = '', children, ...rest }) {
      return (
        <div className={`rounded-3xl bg-white shadow-[0_2px_20px_rgba(0,0,0,.06)] ring-1 ring-black/5 ${className}`} {...rest}>
          {children}
        </div>
      );
    }

    function Modal({ isOpen, onClose, title, size = 'lg', children }) {
      useEffect(
        function () {
          if (!isOpen) return undefined;
          function onKey(e) {
            if (e.key === 'Escape') onClose();
          }
          window.addEventListener('keydown', onKey);
          return function () {
            window.removeEventListener('keydown', onKey);
          };
        },
        [isOpen, onClose]
      );

      if (!isOpen) return null;

      const sizes = { md: 'max-w-2xl', lg: 'max-w-5xl', xl: 'max-w-7xl' };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-8" role="dialog" aria-modal="true" aria-label={title}>
          <div className="absolute inset-0 bg-black/70 backdrop-blur-xl" onClick={onClose} />
          <div className={`relative w-full ${sizes[size]} rounded-3xl bg-neutral-900/90 p-6 text-white shadow-2xl ring-1 ring-white/10 sm:p-8`}>
            <div className="mb-5 flex items-center justify-between">
              <h2 className="text-lg font-semibold tracking-tight">{title}</h2>
              <Button variant="ghost" size="sm" onClick={onClose} aria-label="닫기">✕</Button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function ProgressBar({ value, max, className = '' }) {
      const pct = max > 0 ? Math.min(100, (value / max) * 100) : 0;
      return (
        <div className={`h-[3px] w-full bg-white/10 ${className}`}>
          <div
            className="h-full bg-white/80 transition-all duration-500 ease-out"
            style={{ width: `${pct}%` }}
            role="progressbar"
            aria-valuenow={Math.round(pct)}
            aria-valuemin="0"
            aria-valuemax="100"
          />
        </div>
      );
    }

    function Photo({ src, alt, gradient, emoji, className = '', imgClassName = '' }) {
      const [failed, setFailed] = useState(false);
      if (failed) {
        return (
          <div className={`flex items-center justify-center bg-gradient-to-br ${gradient} ${className}`} role="img" aria-label={alt}>
            <span className="text-[18vw] opacity-40 sm:text-[8vw]" aria-hidden="true">{emoji}</span>
          </div>
        );
      }
      return (
        <img src={src} alt={alt} onError={() => setFailed(true)}
          className={`h-full w-full object-cover ${imgClassName} ${className}`} />
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      const [index, setIndex] = useState(0);
      const [overviewOpen, setOverviewOpen] = useState(false);
      const touchStartX = useRef(null);

      // 이벤트 핸들러가 항상 최신 값을 보도록 ref에 미러링한다.
      const slidesRef = useRef([]);
      const indexRef = useRef(0);

      // 라인업 카드에서 특정 레시피 슬라이드로 점프한다.
      const jumpToAnchor = useCallback(function (anchor) {
        const target = slidesRef.current.findIndex((s) => s.anchor === anchor);
        if (target >= 0) setIndex(target);
      }, []);

      const slides = useMemo(() => buildSlides(jumpToAnchor), [jumpToAnchor]);
      slidesRef.current = slides;
      indexRef.current = index;

      const total = slides.length;

      const goTo = useCallback(
        function (target) {
          setIndex(function (prevIndex) {
            const clamped = Math.max(0, Math.min(slidesRef.current.length - 1, target));
            return clamped === prevIndex ? prevIndex : clamped;
          });
        },
        []
      );

      const next = useCallback(() => goTo(indexRef.current + 1), [goTo]);
      const prev = useCallback(() => goTo(indexRef.current - 1), [goTo]);

      // 해시(#/3)로 특정 슬라이드에 바로 접근·복귀할 수 있게 동기화한다.
      useEffect(function () {
        function readHash() {
          const match = /^#\/(\d+)$/.exec(window.location.hash);
          if (!match) return;
          const parsed = parseInt(match[1], 10) - 1;
          if (!isNaN(parsed)) {
            setIndex(Math.max(0, Math.min(slidesRef.current.length - 1, parsed)));
          }
        }
        readHash();
        window.addEventListener('hashchange', readHash);
        return function () {
          window.removeEventListener('hashchange', readHash);
        };
      }, []);

      useEffect(
        function () {
          const want = `#/${index + 1}`;
          if (window.location.hash !== want) {
            window.history.replaceState(null, '', want);
          }
        },
        [index]
      );

      // 키보드 내비게이션
      useEffect(
        function () {
          function onKey(e) {
            if (overviewOpen) return;
            switch (e.key) {
              case 'ArrowRight':
              case 'ArrowDown':
              case 'PageDown':
              case ' ':
                e.preventDefault();
                next();
                break;
              case 'ArrowLeft':
              case 'ArrowUp':
              case 'PageUp':
                e.preventDefault();
                prev();
                break;
              case 'Home':
                e.preventDefault();
                goTo(0);
                break;
              case 'End':
                e.preventDefault();
                goTo(slidesRef.current.length - 1);
                break;
              case 'g':
              case 'G':
                setOverviewOpen(true);
                break;
              case 'f':
              case 'F':
                toggleFullscreen();
                break;
              default:
                break;
            }
          }
          window.addEventListener('keydown', onKey);
          return function () {
            window.removeEventListener('keydown', onKey);
          };
        },
        [next, prev, goTo, overviewOpen]
      );

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          const req = document.documentElement.requestFullscreen;
          if (req) req.call(document.documentElement).catch(function () {});
        } else if (document.exitFullscreen) {
          document.exitFullscreen().catch(function () {});
        }
      }

      function onTouchStart(e) {
        touchStartX.current = e.changedTouches[0].clientX;
      }

      function onTouchEnd(e) {
        if (touchStartX.current === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX.current;
        if (Math.abs(dx) > 60) {
          if (dx < 0) next();
          else prev();
        }
        touchStartX.current = null;
      }

      const current = slides[index];

      return (
        <div
          className="relative h-screen w-screen overflow-hidden bg-black"
          onTouchStart={onTouchStart}
          onTouchEnd={onTouchEnd}
        >
          <ProgressBar className="no-print fixed inset-x-0 top-0 z-40" value={index + 1} max={total} />

          {/* key를 바꿔 슬라이드마다 진입 애니메이션을 다시 실행한다 */}
          <div key={current.key} className="h-full w-full">
            {current.render()}
          </div>

          {/* 좌우 클릭 영역 (Apple 키노트처럼 화면 아무 곳이나 눌러 넘기기) */}
          <button
            type="button"
            aria-label="이전 슬라이드"
            onClick={prev}
            className="no-print absolute inset-y-0 left-0 z-30 w-[12%] cursor-w-resize focus:outline-none"
          />
          <button
            type="button"
            aria-label="다음 슬라이드"
            onClick={next}
            className="no-print absolute inset-y-0 right-0 z-30 w-[12%] cursor-e-resize focus:outline-none"
          />

          <DeckControls
            index={index}
            total={total}
            onPrev={prev}
            onNext={next}
            onOpenOverview={() => setOverviewOpen(true)}
            onToggleFullscreen={toggleFullscreen}
          />

          <OverviewModal
            isOpen={overviewOpen}
            onClose={() => setOverviewOpen(false)}
            slides={slides}
            index={index}
            onSelect={function (i) {
              goTo(i);
              setOverviewOpen(false);
            }}
          />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
