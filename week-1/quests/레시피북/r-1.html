    const FRACTION_SYMBOLS = { 0.25: '¼', 0.5: '½', 0.75: '¾' };

    function formatAmount(value) {
      const rounded = Math.round(value * 100) / 100;
      const whole = Math.floor(rounded);
      const frac = Math.round((rounded - whole) * 100) / 100;
      const symbol = FRACTION_SYMBOLS[frac];
      if (symbol) return whole > 0 ? `${whole}${symbol}` : symbol;
      return String(Number(rounded.toFixed(2)));
    }

    function formatClock(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function loadStored(key, fallback) {
      try {
        const raw = window.localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveStored(key, value) {
      try {
        window.localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        /* 시크릿 모드 등 저장 불가 환경은 조용히 무시 */
      }
    }

    function playChime() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        [880, 1320].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const start = ctx.currentTime + i * 0.22;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.25, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
          osc.connect(gain).connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.4);
        });
        setTimeout(() => ctx.close(), 1500);
      } catch (e) {
        /* 오디오 미지원 환경 무시 */
      }
    }

    // ========================================
    // ⏱️ Cook Timer Hook
    // ========================================
    function useCookTimer() {
      const [activeStepId, setActiveStepId] = useState(null);
      const [remaining, setRemaining] = useState(0);
      const [running, setRunning] = useState(false);
      const [finishedStepId, setFinishedStepId] = useState(null);

      useEffect(() => {
        if (!running) return undefined;
        const tick = setInterval(() => {
          setRemaining((prev) => {
            if (prev <= 1) {
              setRunning(false);
              setFinishedStepId(activeStepId);
              playChime();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(tick);
      }, [running, activeStepId]);

      const start = useCallback((stepId, seconds) => {
        setActiveStepId(stepId);
        setRemaining(seconds);
        setFinishedStepId(null);
        setRunning(true);
      }, []);

      const toggle = useCallback(() => setRunning((prev) => !prev), []);

      const stop = useCallback(() => {
        setRunning(false);
        setActiveStepId(null);
        setRemaining(0);
      }, []);

      return { activeStepId, remaining, running, finishedStepId, start, toggle, stop };
    }

        : `${formatAmount(item.amount * ratio)}${item.unit}`;

      return (
        <CheckItem checked={checked} onToggle={onToggle}>
          <span className="flex flex-wrap items-baseline gap-x-2 gap-y-0.5">
            <span className="text-[15px] font-semibold text-char-900">{item.name}</span>
            {item.optional && <span className="text-[11px] font-semibold text-char-500/70">선택</span>}
            <span className="ml-auto whitespace-nowrap rounded-md bg-char-500/10 px-2 py-0.5 text-[13px] font-bold tabular-nums text-tomato-700">{quantity}</span>
          </span>
          {item.note && <span className="mt-0.5 block text-[13px] leading-snug text-char-500">{item.note}</span>}
        </CheckItem>
      );
    }

    function IngredientsSection({ servings, onServingsChange, checked, onToggle, onReset }) {
      const ratio = servings / RECIPE.baseServings;
      const totalCount = useMemo(() => INGREDIENT_GROUPS.reduce((sum, g) => sum + g.items.length, 0), []);
      const checkedCount = Object.values(checked).filter(Boolean).length;

      return (
        <section id="ingredients" className="mx-auto max-w-5xl scroll-mt-20 px-5 py-12">
          <SectionTitle eyebrow="Ingredients" title="재료">
            인분을 바꾸면 분량이 자동으로 계산됩니다. 장 볼 때 하나씩 체크해 보세요.
          </SectionTitle>

          <div className="mb-6 flex flex-wrap items-center justify-between gap-3">
            <ServingsControl servings={servings} onChange={onServingsChange} />
            <div className="flex items-center gap-3">
              <span className="text-sm font-semibold tabular-nums text-char-500">{checkedCount} / {totalCount} 준비됨</span>
              {checkedCount > 0 && <Button size="sm" variant="ghost" onClick={onReset}>초기화</Button>}
            </div>
          </div>

          <div className="grid gap-4 md:grid-cols-3">
            {INGREDIENT_GROUPS.map((group) => (
              <Card key={group.id} className="p-4">
                <h3 className="mb-2 flex items-center gap-2 px-3 text-sm font-extrabold tracking-tight text-char-900">
                  <span aria-hidden="true">{group.emoji}</span>{group.title}
                </h3>
                <ul className="space-y-0.5">
                  {group.items.map((item) => {
                    const key = `${group.id}:${item.name}`;
                    return (
                      <li key={key}>
                        <IngredientRow item={item} ratio={ratio} checked={!!checked[key]} onToggle={() => onToggle(key)} />
                      </li>
                    );
                  })}
                </ul>
              </Card>
            ))}
          </div>
        </section>
      );
    }

    function StepTimer({ step, timer }) {
      const isActive = timer.activeStepId === step.id;
      const isDone = timer.finishedStepId === step.id;
      const total = step.timer.seconds;
      const pct = isActive ? ((total - timer.remaining) / total) * 100 : 0;

      if (!isActive) {
        return (
          <div className="mt-4 flex items-center gap-2">
            <Button size="sm" variant="secondary" onClick={() => timer.start(step.id, total)}>
              <span aria-hidden="true">⏱</span> {step.timer.label}
            </Button>
            {isDone && <span className="text-xs font-bold text-tomato-600">타이머 완료!</span>}
          </div>
        );
      }

      return (
        <div className="mt-4 rounded-2xl bg-char-900 p-4 text-white">
          <div className="flex flex-wrap items-center justify-between gap-4">
            <div>
              <p className="text-[11px] font-bold uppercase tracking-widest text-white/50">{step.timer.label}</p>
              <p className={`text-3xl font-black tabular-nums ${timer.remaining === 0 ? 'text-yolk' : ''}`}>
                {formatClock(timer.remaining)}
              </p>
            </div>
            <div className="flex gap-2">
              {timer.remaining > 0 && (
                <Button size="sm" variant="primary" onClick={timer.toggle}>
                  {timer.running ? '일시정지' : '이어서'}
                </Button>
              )}
              <Button size="sm" variant="ghost" className="text-white/70 hover:bg-white/10 hover:text-white" onClick={timer.stop}>
                {timer.remaining === 0 ? '닫기' : '취소'}
              </Button>
            </div>
          </div>
          <div className="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-white/15">
            <div className="h-full rounded-full bg-gradient-to-r from-yolk to-tomato-500 transition-[width] duration-1000 ease-linear"
              style={{ width: `${pct}%` }} />
          </div>
          {timer.remaining === 0 && <p className="mt-3 text-sm font-semibold text-yolk">시간 끝! 다음 단계로 넘어가세요.</p>}
        </div>
      );
    }

    function StepCard({ step, index, isLast, done, onToggle, timer }) {
      return (
        <li className="relative pl-12 sm:pl-16">
          {!isLast && <span aria-hidden="true" className="absolute left-[19px] top-11 bottom-0 w-0.5 bg-char-500/15 sm:left-[27px]" />}

          <button type="button" onClick={onToggle} aria-pressed={done} aria-label={`${step.title} 단계 완료 표시`}
            className={`no-tap-highlight absolute left-0 top-1 flex h-10 w-10 items-center justify-center rounded-full text-sm font-black transition-all duration-200 sm:h-14 sm:w-14 sm:text-base ${done ? 'bg-tomato-500 text-white' : 'bg-paper text-char-900 ring-1 ring-char-500/15 hover:ring-tomato-300'}`}>
            {done ? (
              <svg viewBox="0 0 20 20" className="h-5 w-5" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 10.5l4 4 8-9" />
              </svg>
            ) : index + 1}
          </button>

          <Card className={`mb-4 p-5 transition-opacity ${done ? 'opacity-55' : ''}`}>
            <div className="mb-1.5 flex flex-wrap items-center gap-2">
              <h3 className="text-lg font-extrabold tracking-tight text-char-900">{step.title}</h3>
              <Badge variant="outline">{step.at}분 경과</Badge>
            </div>
            <p className="text-[15px] leading-relaxed text-char-700">{step.body}</p>
            {step.warn && (
              <p className="mt-3 flex gap-2 rounded-xl bg-tomato-50 px-3.5 py-2.5 text-[13px] font-semibold leading-snug text-tomato-700">
                <span aria-hidden="true">⚠️</span>{step.warn}
              </p>
            )}
            {step.timer && <StepTimer step={step} timer={timer} />}
          </Card>
        </li>
      );
    }

    function StepsSection({ doneSteps, onToggle, onReset, timer }) {
      const doneCount = Object.values(doneSteps).filter(Boolean).length;

      return (
        <section id="steps" className="mx-auto max-w-5xl scroll-mt-20 px-5 py-12">
          <SectionTitle eyebrow="Method" title="만드는 법">
            0분에서 15분까지, 경과 시간대로 따라가면 됩니다. 타이머가 필요한 단계에는 버튼이 붙어 있어요.
          </SectionTitle>

          <div className="mb-8 flex flex-wrap items-center justify-between gap-4">
            <div className="min-w-[200px] flex-1">
              <div className="mb-2 flex items-center justify-between text-sm font-semibold text-char-500">
                <span>진행률</span>
                <span className="tabular-nums">{doneCount} / {STEPS.length} 단계</span>
              </div>
              <ProgressBar value={doneCount} max={STEPS.length} />
            </div>
            {doneCount > 0 && <Button size="sm" variant="ghost" onClick={onReset}>단계 초기화</Button>}
          </div>

          <ol className="list-none">
            {STEPS.map((step, i) => (
              <StepCard key={step.id} step={step} index={i} isLast={i === STEPS.length - 1}
                done={!!doneSteps[step.id]} onToggle={() => onToggle(step.id)} timer={timer} />
            ))}
          </ol>

          {doneCount === STEPS.length && (
            <div className="animate-pop mt-2 rounded-2xl bg-gradient-to-br from-tomato-500 to-tomato-700 p-6 text-center text-white">
              <p className="text-2xl font-black">완성! 🍳</p>
              <p className="mt-1 text-sm text-white/85">팬째로 올리고, 빵으로 소스까지 싹 닦아 드세요.</p>
            </div>
          )}
        </section>
      );
    }

    function TipsSection() {
      return (
        <section id="tips" className="mx-auto max-w-5xl scroll-mt-20 px-5 py-12">
          <SectionTitle eyebrow="Why it works" title="성공 포인트">
            왜 그렇게 해야 하는지 알면 다음에는 레시피 없이도 만들 수 있습니다.
          </SectionTitle>
          <div className="grid gap-4 sm:grid-cols-2">
            {TIPS.map((tip, i) => (
              <Card key={tip.point} className="flex gap-4 p-5">
                <span aria-hidden="true" className="text-2xl font-black text-tomato-100">{String(i + 1).padStart(2, '0')}</span>
                <div>
                  <h3 className="font-extrabold tracking-tight text-char-900">{tip.point}</h3>
                  <p className="mt-1 text-sm leading-relaxed text-char-500">{tip.reason}</p>
                </div>
              </Card>
            ))}
          </div>
        </section>
      );
    }

    function VariationsSection() {
      return (
        <section id="variations" className="mx-auto max-w-5xl scroll-mt-20 px-5 py-12">
          <SectionTitle eyebrow="Variations" title="응용">
            같은 뼈대에 하나만 더하면 완전히 다른 요리가 됩니다.
          </SectionTitle>
          <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            {VARIATIONS.map((v) => (
              <Card key={v.name} className="p-5 transition-transform duration-200 hover:-translate-y-1">
                <span aria-hidden="true" className="text-3xl">{v.emoji}</span>
                <h3 className="mt-3 font-extrabold tracking-tight text-char-900">{v.name}</h3>
                <p className="mt-1 text-sm leading-relaxed text-char-500">{v.desc}</p>
              </Card>
            ))}
          </div>
        </section>
      );
    }

    function PairingSection() {
      return (
        <section className="mx-auto max-w-5xl px-5 py-12">
          <Card className="overflow-hidden">
            <div className="grid gap-6 p-7 sm:grid-cols-[auto_1fr] sm:items-center sm:p-9">
              <span aria-hidden="true" className="animate-simmer text-5xl">🥖</span>
              <div>
                <h2 className="text-xl font-extrabold tracking-tight text-char-900">곁들이면 좋은 것</h2>
                <p className="mt-2 text-[15px] leading-relaxed text-char-500">
                  노릇하게 구운 바게트, 그리고 올리브유와 소금만 뿌린 루꼴라.
                  남은 소스는 <strong className="font-bold text-tomato-600">빵으로 팬을 닦아 먹는 게 정석</strong>입니다.
                </p>
              </div>
            </div>
          </Card>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="border-t border-char-500/10 px-5 py-10">
          <div className="mx-auto flex max-w-5xl flex-col items-center gap-2 text-center">
            <p className="text-sm font-bold text-char-700">15분 레시피북</p>
            <p className="text-xs text-char-500">퇴근하고 배고픈 사람을 위한, 15분 안에 끝나는 한 그릇 요리</p>
          </div>
        </footer>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    const STORAGE_KEY = 'eggs-in-hell-state-v1';

    function App() {
      const initial = useMemo(() => loadStored(STORAGE_KEY, {}), []);
      const [servings, setServings] = useState(initial.servings || RECIPE.baseServings);
      const [checkedIngredients, setCheckedIngredients] = useState(initial.checkedIngredients || {});
      const [doneSteps, setDoneSteps] = useState(initial.doneSteps || {});
      const timer = useCookTimer();

      useEffect(() => {
        saveStored(STORAGE_KEY, { servings, checkedIngredients, doneSteps });
      }, [servings, checkedIngredients, doneSteps]);

      const toggleIngredient = useCallback((key) => {
        setCheckedIngredients((prev) => ({ ...prev, [key]: !prev[key] }));
      }, []);

      const toggleStep = useCallback((id) => {
        setDoneSteps((prev) => ({ ...prev, [id]: !prev[id] }));
      }, []);

      const doneCount = Object.values(doneSteps).filter(Boolean).length;

      return (
        <div className="min-h-screen">
          <Header progressValue={doneCount} progressMax={STEPS.length} />
          <main>
            <Hero />
            <IngredientsSection
              servings={servings}
              onServingsChange={setServings}
              checked={checkedIngredients}
              onToggle={toggleIngredient}
              onReset={() => setCheckedIngredients({})}
            />
            <StepsSection
              doneSteps={doneSteps}
              onToggle={toggleStep}
              onReset={() => setDoneSteps({})}
              timer={timer}
            />
            <TipsSection />
            <VariationsSection />
            <PairingSection />
          </main>
          <Footer />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
